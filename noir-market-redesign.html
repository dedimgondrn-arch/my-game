<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>NOIR MARKET — Торговая площадка</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--user-accent:#ffae16;--a:#ffb21a;--b:#ff6a00;--c:#ffd15c;--bg:#070707;--card:#111113;--line:#343438;--tx:#f5f3ef;--mu:#a3a1a0;--dg:#ff8f7d;--f:'Nunito',system-ui,'Segoe UI',sans-serif;--d:'Unbounded','Nunito',system-ui,sans-serif}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#211307 0,transparent 38%),#070707;color:var(--tx);font:500 16px/1.55 var(--f);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(135deg,#ffb21a,#ff7600);color:#130b02;border:1px solid #ffc04a;box-shadow:0 7px 22px #ff790027;transition:transform .15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}
.gh{color:var(--tx);background:#111113!important;border:1px solid #39393d!important}
.gh:hover,.gh.on{color:#ffb21a;border-color:#ff9d12!important;background:#21170b!important}
.dg{color:var(--dg);background:#100c0b!important;border-color:#63342b!important}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0}
input:focus,textarea:focus,select:focus{border-color:#ff9d12;box-shadow:0 0 0 4px #ff8a1f20}
select option{background:#101216}textarea{resize:vertical}
label.l{display:block;color:var(--mu);font-size:14px;font-weight:600;margin:14px 0 6px}
header{position:sticky;top:8px;z-index:30;margin:8px auto;width:min(1200px,calc(100% - 24px));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:22px;background:rgba(10,10,12,.88);backdrop-filter:blur(20px);border:1px solid #303034}
.mk{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font:600 18px var(--d);color:#140900;background:linear-gradient(135deg,#ffbd24,#ff6500);cursor:pointer}
.br{font:500 13px var(--d);cursor:pointer;white-space:nowrap;background:linear-gradient(100deg,#fff0ca,#ffb21a);background-clip:text;-webkit-background-clip:text;color:transparent}
.sr{flex:1;min-width:0}.sr input{border-radius:999px;padding:10px 16px}
.lg,.ntf-box{position:relative;flex:none}
.lp,.ntf-pop{position:absolute;right:0;top:calc(100% + 10px);background:#111113;border:1px solid #343438;border-radius:18px;padding:10px;display:none;min-width:240px;box-shadow:0 20px 50px -24px #ff7b00;z-index:40}
.lp.o,.ntf-pop.o{display:block}
.lp button{width:100%;margin:3px 0;justify-content:flex-start;background:transparent;border:0}
main{max-width:1200px;margin:auto;padding:16px 14px calc(112px + env(safe-area-inset-bottom,0px))}
.ti{font:800 clamp(30px,7vw,60px)/1.05 var(--d);margin:0 0 10px;background:linear-gradient(100deg,#fff2d7,#ffb21a 62%,#ff6a00);background-clip:text;-webkit-background-clip:text;color:transparent}
.su{color:#aaa7a3;font-size:clamp(15px,2.4vw,19px);max-width:620px;margin:0 0 16px}
.sts{display:flex;gap:10px;flex-wrap:wrap}.st{padding:12px 18px;border:1px solid #343438;border-radius:16px;background:#111113;min-width:110px}.st b{display:block;font:700 22px var(--d);color:#ffb21a}.st span{color:var(--mu);font-size:13px}
.home-categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:10px 0 16px}
.home-cat{min-width:0;min-height:92px;padding:12px 7px;border:1px solid #343438;border-radius:16px;background:linear-gradient(160deg,#151517,#0d0d0f);color:#f4f1eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;cursor:pointer;transition:.2s}
.home-cat:hover,.home-cat.on{border-color:#ffad16;background:linear-gradient(160deg,#241807,#11100d);color:#ffb21a;transform:translateY(-2px)}
.home-cat i{font-style:normal;font-size:24px}.home-cat span{font-size:12px;font-weight:700}
.promo-banner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:176px;overflow:hidden;margin:10px 0 22px;padding:24px;border:1px solid #64400f;border-radius:20px;background:linear-gradient(110deg,#100d09 0%,#1e1208 54%,#100b07 100%)}
.promo-copy h2{font:800 clamp(22px,3.5vw,36px)/1.05 var(--f);margin:0 0 8px}
.promo-copy h2 em{font-style:normal;color:#ff9c12}
.promo-copy p{color:#aaa7a3;font-size:13px;margin:0 0 14px}
.promo-art{display:grid;place-items:center;flex:none;width:106px;height:106px;margin-right:5%;border:1px solid #ff9f1d88;border-radius:24px;transform:rotate(8deg);background:linear-gradient(145deg,#251608,#090909);box-shadow:0 18px 45px #ff71002b}
.promo-art span{font:800 62px/1 var(--d);color:#ff9c12;transform:rotate(-8deg)}
.trust-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 24px;padding:13px 10px;border:1px solid #493418;border-radius:16px;background:linear-gradient(110deg,#16110b,#101012)}
.trust-item{display:flex;align-items:center;justify-content:center;gap:8px}
.trust-item i{font-style:normal;color:#ff9d12;font-size:19px}
.trust-item b{display:block;font-size:11px}
.trust-item span{display:block;color:#aaa7a3;font-size:9px}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 12px;flex-wrap:wrap}.bar h2{font-size:21px;font-weight:800;margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{position:relative;border-radius:18px;border:1px solid #343438;background:#111113;padding:8px;cursor:pointer;display:flex;flex-direction:column;transition:.25s}
.card.pm{border-color:#ff9d12;box-shadow:0 0 18px #ff8a1f12}
.card:hover{transform:translateY(-3px);border-color:#ff9d12;box-shadow:0 14px 32px -22px #ff9d12}
.im{aspect-ratio:1;border-radius:13px;background:linear-gradient(145deg,#1b1b1e,#101012);display:grid;place-items:center;font-size:42px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.cb{padding:10px 4px 5px;display:flex;flex-direction:column;gap:5px}
.ct{font-size:11px;color:#ffb21a;font-weight:700}.nm{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:17px;font-weight:800;color:#ffb21a}
.tg{position:absolute;top:12px;left:12px;z-index:2;background:#ffae16;color:#1a1003;font:800 11px var(--f);padding:4px 10px;border-radius:99px}
.hr{position:absolute;top:11px;right:11px;z-index:2;width:32px;height:32px;border-radius:99px;background:#080808c9;border:0;color:#f4f1eb;font-size:15px;display:grid;place-items:center}
.emp{text-align:center;color:var(--mu);padding:46px 10px;border:1px dashed #343438;border-radius:24px}
.pan{border:1px solid #343438;background:#111113;border-radius:20px;padding:16px;margin-bottom:14px}
.det{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:760px){.det{grid-template-columns:1fr}.br{display:block;font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}}
.ga{aspect-ratio:1;border-radius:18px;overflow:hidden;background:#111113;display:grid;place-items:center;font-size:70px}.ga img{width:100%;height:100%;object-fit:contain;background:#000}
.th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;flex:none}.th img.on{border-color:var(--c)}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 340px);min-height:280px}
.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:80%;padding:9px 13px;border-radius:18px;background:rgba(255,255,255,.08);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#ffb21a,#ff6a00);color:#130b02;font-weight:600}
.m img{display:block;max-width:240px;width:100%;border-radius:12px;margin-bottom:4px}
.cf{display:flex;gap:8px;margin-top:8px;align-items:center}.ib{width:44px;height:44px;padding:0;border-radius:99px;flex:none;display:grid;place-items:center}
.row{display:flex;gap:12px}.row>*{flex:1}
.mo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center}
.mo.o{display:flex}
.sheet{width:min(560px,100%);max-height:94dvh;overflow:auto;background:#111113;border:1px solid #343438;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 18px var(--d);margin:0 0 4px}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.up .p{width:78px;height:78px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}.up img{width:100%;height:100%|object-fit:cover}
.up .p b{position:absolute;top:3px;right:3px;cursor:pointer;background:rgba(0,0,0,.7);border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.add{width:78px;height:78px;border-radius:14px;border:1px dashed var(--mu);display:grid;place-items:center;font-size:28px;cursor:pointer;color:var(--c)}
.tip{border:1px solid #594317;border-radius:16px;padding:11px 14px;color:#ffca66;font-size:14px;margin-top:14px;background:#ffb21a0a}
.pay{border:1px solid #ff9d12;border-radius:18px;padding:14px;margin-top:12px;background:#ff8a1f0c;display:none}.pay.o{display:block}
.pay b{font:700 22px var(--d);color:#ffb21a}
.ty{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#14161c;border:1px solid #343438;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}
.ty.o{opacity:1;transform:translate(-50%,0)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;width:min(620px,calc(100% - 22px));display:flex;align-items:center;justify-content:space-around;padding:7px 9px;border-radius:28px;background:rgba(13,13,15,.94);backdrop-filter:blur(22px);border:1px solid #353539;box-shadow:0 15px 40px rgba(0,0,0,.7),0 0 24px #ff850012}
nav button{position:relative;flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:11px;border:0;border-radius:16px;background:none;box-shadow:none;color:#aaa7a3}nav button i{font-style:normal;font-size:20px}
nav button.on{color:#ffb21a}nav button.sl{flex:none;width:58px;height:58px;margin:-24px 4px 0;border-radius:99px;font-size:28px;color:#150a00;background:linear-gradient(135deg,#ffbe1e,#ff6b00);box-shadow:0 0 26px #ff8b2b70}
.nb{position:absolute;top:0;right:18%;min-width:18px;height:18px;border-radius:99px;background:#ffb21a;color:#130b02;font:800 10px var(--f);display:grid;place-items:center;padding:0 4px}
.li{display:flex;gap:12px;align-items:center;padding:10px}.li .t{width:64px;height:64px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:26px;flex:none}.li .t img{width:100%;height:100%;object-fit:cover}.li>div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font:700 11px var(--f);padding:2px 9px;border-radius:99px;border:1px solid #343438;color:var(--mu);margin-right:4px}.pill.g{color:#ffb21a;border-color:#ffb21a}.pill.o{color:#ff6a00;border-color:#ff6a00}
.av{width:76px;height:76px;flex:none;border-radius:26px;display:grid;place-items:center;font:700 32px var(--d);color:#140900;background:linear-gradient(135deg,#ffbd24,#ff6500)}
.pf{display:flex;gap:16px;align-items:center}.pf h2{font:700 22px var(--d);margin:0 0 4px}
.q-reply{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.q-reply button{white-space:nowrap;font-size:12px;padding:6px 12px;border-radius:99px;flex:none}
</style>
</head>
<body>
<header>
  <div class="mk" id="lgo">N</div>
  <div class="br" id="lgb">NOIR MARKET</div>
  <div class="sr"><input id="q" type="search" placeholder="Поиск: голда, скин, аккаунт"></div>
  <div class="ntf-box">
    <button class="gh" id="bellBtn">🔔 <span id="bellBadge" class="nb" style="display:none">0</span></button>
    <div class="ntf-pop" id="ntfPop">
      <div style="font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between">
        <span>Уведомления</span>
        <button class="gh" id="clrNtf" style="padding:2px 8px;font-size:11px">Очистить</button>
      </div>
      <div id="ntfList"><div class="mu" style="font-size:12px;text-align:center;padding:10px">Нет уведомлений</div></div>
    </div>
  </div>
  <button class="gh" id="authBtn">👤 Войти</button>
</header>

<main id="app"></main>
<nav id="nv"></nav>

<div class="mo" id="authMo"><div class="sheet">
  <h3 id="authTitle">Вход в аккаунт</h3>
  <label class="l">Telegram username / Логин</label>
  <input id="auVal" placeholder="@username" required>
  <label class="l">Пароль</label>
  <input type="password" id="auPass" placeholder="Пароль" required>
  <button class="gh" style="width:100%;margin-top:18px" id="authSubmitBtn">Войти</button>
  <button class="gh" style="width:100%;margin-top:10px" id="authClose">Закрыть</button>
</div></div>

<div class="mo" id="mo"><form class="sheet" id="fm">
  <h3>Новое объявление</h3>
  <label class="l">Фото (до 5)</label><div class="up" id="up"></div>
  <input style="display:none" id="fl" type="file" accept="image/*" multiple>
  <label class="l" for="ft">Название</label><input id="ft" required placeholder="Например: 1000 голды Standoff 2">
  <div class="row">
    <div><label class="l">Категория</label><select id="fc"></select></div>
    <div><label class="l">Цена, ₽</label><input id="fp" type="number" min="1" required placeholder="500"></div>
  </div>
  <label class="l">Способ передачи</label><select id="fh"></select>
  <label class="l">Описание</label><textarea id="fs" rows="3" placeholder="Что продаете, как проходит передача"></textarea>
  <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="fpm" style="width:20px;height:20px"><span>Premium · 10 ₽ (в топе витрины)</span></label>
  <div class="pay" id="pay"><div>Оплата на карту</div><b>Скоро</b><div class="mu">Реквизиты появятся здесь.</div></div>
  <div class="row" style="margin-top:18px"><button type="button" class="gh" id="fx">Отмена</button><button id="fg">Опубликовать</button></div>
</form></div>

<div class="ty" id="ty"></div>
<div class="mo" id="gm"><div class="sheet" id="gb"></div></div>

<script>
const CATS=[["so2","🔫","Standoff 2"],["bs","⭐","Brawl Stars"],["rb","🧱","Roblox"],["mc","⛏️","Minecraft"],["cur","💰","Валюта"],["skin","🎨","Скины"],["acc","👤","Аккаунты"],["boost","🚀","Буст"],["oth","📦","Прочее"]];
const CI=Object.fromEntries(CATS.map(c=>[c[0],c[1]])), CN=Object.fromEntries(CATS.map(c=>[c[0],c[2]]));
let uid="usr_"+Math.random().toString(36).slice(2,7), L=[], TH={}, RECENT=[], FAV=[], NOTIFICATIONS=[];
try{FAV=JSON.parse(localStorage.getItem("noirfav")||"[]")}catch(e){}
try{RECENT=JSON.parse(localStorage.getItem("noirrecent")||"[]")}catch(e){}

function toast(m){const x=$("#ty");x.textContent=m;x.classList.add("o");setTimeout(()=>x.classList.remove("o"),2500)}
function e(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const $ = s => document.querySelector(s);
let view={t:"home"}, cat="all", q="", srt="new", ph=[];

function renderNav(){
  $("#nv").innerHTML=`
    <button class="${view.t==="inbox"?"on":""}" onclick="go('inbox')"><i>💬</i>Чаты</button>
    <button class="${view.t==="mine"?"on":""}" onclick="go('mine')"><i>▣</i>Мои товары</button>
    <button class="sl" onclick="openForm()">＋</button>
    <button class="${view.t==="settings"?"on":""}" onclick="go('settings')"><i>⚙</i>Настройки</button>
    <button class="${view.t==="home"?"on":""}" onclick="go('home')"><i>☰</i>Каталог</button>
  `;
}

function go(v, o={}){view={t:v,...o}; window.scrollTo(0,0); render();}

function render(){
  renderNav();
  const a=$("#app");
  if(view.t==="home") renderHome(a);
  else if(view.t==="item") renderItem(a);
  else if(view.t==="mine") renderMine(a);
  else if(view.t==="inbox") renderInbox(a);
  else if(view.t==="chat") renderChat(a);
  else if(view.t==="settings") renderSettings(a);
}

function renderHome(a){
  a.innerHTML=`
    <section class="hero">
      <h1 class="ti">NOIR MARKET</h1>
      <p class="su">Площадка игровых ценностей. Находи товар, пиши продавцу и договаривайся напрямую.</p>
      <div class="sts"><div class="st"><b>${L.length}</b><span>Объявлений</span></div><div class="st"><b>14</b><span>Продавцов</span></div></div>
    </section>
    <div class="bar"><h2>Категории</h2></div>
    <div class="home-categories">
      ${CATS.slice(0,5).map(c=>`<button class="home-cat ${cat===c[0]?"on":""}" onclick="cat='${c[0]}';render()"><i>${c[1]}</i><span>${c[2]}</span></button>`).join("")}
    </div>
    <div class="bar"><h2>Свежие объявления</h2><select id="so" onchange="srt=this.value;render()"><option value="new">Сначала новые</option><option value="asc">Сначала дешевые</option><option value="desc">Сначала дорогие</option></select></div>
    <div class="grid">${L.map(card).join("")}</div>
    ${!L.length?`<div class="emp">Пока пусто. Выставь первый товар кнопкой «＋».</div>`:""}
  `;
  $("#so").value=srt;
}

function card(x){
  const f=FAV.includes(x.id);
  return `<div class="card ${x.pm?"pm":""}" onclick="go('item',{id:'${x.id}'})">
    ${x.pm?'<span class="tg">PREMIUM</span>':""}
    <button class="hr" onclick="event.stopPropagation();toggleFav('${x.id}')">${f?"❤️":"🤍"}</button>
    <div class="im">${x.ph&&x.ph[0]?`<img src="${x.ph[0]}" alt="">`:CI[x.cat]||"📦"}</div>
    <div class="cb"><span class="ct">${CI[x.cat]} ${CN[x.cat]}</span><span class="nm">${e(x.title)}</span><span class="pr">${Number(x.price).toLocaleString()} ₽</span></div>
  </div>`;
}

function toggleFav(id){
  FAV=FAV.includes(id)?FAV.filter(i=>i!==id):[...FAV,id];
  localStorage.setItem("noirfav",JSON.stringify(FAV));
  render();
}

function renderItem(a){
  const x=L.find(i=>i.id===view.id);
  if(!x){a.innerHTML=`<div class="emp">Товар не найден<br><br><button onclick="go('home')">Назад</button></div>`;return;}
  a.innerHTML=`
    <button class="gh" onclick="go('home')">← Назад</button>
    <div class="det" style="margin-top:14px">
      <div class="ga">${x.ph&&x.ph[0]?`<img src="${x.ph[0]}">`:CI[x.cat]}</div>
      <div>
        <span class="ct">${CI[x.cat]} ${CN[x.cat]}</span>
        <h1 style="font:700 24px/1.2 var(--d);margin:6px 0 10px">${e(x.title)}</h1>
        <div class="pr" style="font-size:28px">${Number(x.price).toLocaleString()} ₽</div>
        <div class="pan" style="margin-top:16px"><div class="mu">Описание</div><p style="white-space:pre-wrap">${e(x.desc||"Без описания")}</p></div>
        <button style="width:100%;margin-top:12px" onclick="startChat('${x.id}')">💬 Написать продавцу</button>
      </div>
    </div>
  `;
}

function startChat(lid){
  const x=L.find(i=>i.id===lid);
  const tid=lid+"_"+uid;
  if(!TH[tid]){TH[tid]={id:tid, lid, title:x.title, msgs:[], ts:Date.now()};}
  go("chat",{tid});
}

function renderChat(a){
  const th=TH[view.tid];
  if(!th){go("inbox");return;}
  a.innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <button class="gh" onclick="go('inbox')">←</button>
      <div><b>Чат по товару</b><div class="mu">${e(th.title)}</div></div>
    </div>
    <div class="pan chat"><div class="ms" id="ms">
      ${th.msgs.map(m=>`<div class="m ${m.me?"me":""}">${e(m.text)}<small class="mu" style="font-size:10px;display:block">${new Date(m.ts).toLocaleTimeString()}</small></div>`).join("")}
    </div>
    <form class="cf" onsubmit="sendMsg(event)"><input id="mt" placeholder="Сообщение..." required autocomplete="off"><button class="ib">➤</button></form></div>
  `;
  const ms=$("#ms");ms.scrollTop=ms.scrollHeight;
}

function sendMsg(e){
  e.preventDefault();
  const inp=$("#mt"), txt=inp.value.trim();
  if(!txt)return;
  const th=TH[view.tid];
  th.msgs.push({text:txt, me:true, ts:Date.now()});
  inp.value="";
  render();
  setTimeout(()=>{
    th.msgs.push({text:"Здравствуйте! Товар в наличии, оформляйте сделку.", me:false, ts:Date.now()});
    render();
  },1000);
}

function renderInbox(a){
  const threads=Object.values(TH);
  a.innerHTML=`<div class="bar"><h2>Чаты</h2></div>`+
    (threads.length?threads.map(t=>`<div class="pan" style="cursor:pointer" onclick="go('chat',{tid:'${t.id}'})"><b>${e(t.title)}</b><div class="mu">Диалог активен</div></div>`).join(""):`<div class="emp">Диалогов пока нет. Открой товар и нажми «Написать продавцу».</div>`);
}

function renderMine(a){
  const mine=L.filter(x=>x.seller===uid);
  a.innerHTML=`<div class="bar"><h2>Мои товары</h2><button onclick="openForm()">＋ Выставить</button></div>`+
    (mine.length?mine.map(x=>`<div class="pan li"><div><b>${e(x.title)}</b><div class="pr">${x.price} ₽</div></div></div>`).join(""):`<div class="emp">У тебя пока нет товаров.</div>`);
}

function renderSettings(a){
  a.innerHTML=`<div class="bar"><h2>Настройки</h2></div><div class="pan"><p>Платформа работает в автономном режиме.</p></div>`;
}

function openForm(){
  ph=[]; $("#fm").reset(); $("#pay").classList.remove("o");
  $("#fc").innerHTML=CATS.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join("");
  $("#fh").innerHTML=`<option value="h1">Личная встреча / В игре</option><option value="h2">Передача данных</option>`;
  updPhotos(); $("#mo").classList.add("o");
}
function updPhotos(){
  $("#up").innerHTML=ph.map((u,i)=>`<div class="p"><img src="${u}"><b onclick="ph.splice(${i},1);updPhotos()">✕</b></div>`).join("")+(ph.length<5?`<label class="add" onclick="addDemoPhoto()">＋</label>`:"");
}
function addDemoPhoto(){
  ph.push("https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&auto=format&fit=crop&q=60");
  updPhotos();
}
$("#fx").onclick=()=>$("#mo").classList.remove("o");
$("#fm").onsubmit=e=>{
  e.preventDefault();
  L.unshift({id:"l_"+Math.random().toString(36).slice(2,7), title:$("#ft").value, cat:$("#fc").value, price:+[...$("#fp").value][0]? +$("#fp").value:500, desc:$("#fs").value, ph:[...ph], pm:$("#fpm").checked, seller:uid});
  $("#mo").classList.remove("o");
  toast("Объявление опубликовано!");
  go("home");
};

$("#authBtn").onclick=()=>$("#authMo").classList.add("o");
$("#authClose").onclick=()=>$("#authMo").classList.remove("o");
$("#authSubmitBtn").onclick=e=>{e.preventDefault();$("#authMo").classList.remove("o");toast("Вход выполнен");};

render();
</script>
</body>
</html>
