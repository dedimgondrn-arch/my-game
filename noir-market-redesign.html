<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOIR MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--card:#111113;--line:#343438;--tx:#f5f3ef;--mu:#a3a1a0;--accent:#ffb21a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito',sans-serif;padding:16px}
h1{font-family:'Unbounded',sans-serif;color:var(--accent);text-align:center;}
.pan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
input,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px;color:#fff;margin-top:6px;box-sizing:border-box;}
button{background:var(--accent);color:#000;border:0;border-radius:12px;padding:12px;font-weight:700;width:100%;cursor:pointer;margin-top:10px;}
.product-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;}
.price{color:var(--accent);font-weight:bold;font-size:18px;}
</style>
</head>
<body>

  <h1>NOIR MARKET</h1>

  <div class="pan">
    <h3>Добавить товар</h3>
    <input id="title" placeholder="Название товара (например, Голда)">
    <input id="price" type="number" placeholder="Цена в рублях">
    <button id="addBtn">Опубликовать в базу</button>
  </div>

  <div class="pan">
    <h3>Список товаров (общий)</h3>
    <div id="productsList">Загрузка из базы...</div>
  </div>

<!-- Подключаем Firebase через старые добрые скрипты, которые отлично работают на телефонах -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // Твой конфиг
  const firebaseConfig = {
    apiKey: "AIzaSyC4pMQs3YvfwBxrUPoqE-Mk7BO7FIw7ECM",
    authDomain: "noir-marketot.firebaseapp.com",
    projectId: "noir-marketot",
    storageBucket: "noir-marketot.firebasestorage.app",
    messagingSenderId: "576848905399",
    appId: "1:576848905399:web:f9d664c9a8ca2d53d47932",
    measurementId: "G-TBM4DKBF1S"
  };

  // Инициализация
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const titleInput = document.getElementById('title');
  const priceInput = document.getElementById('price');
  const addBtn = document.getElementById('addBtn');
  const productsList = document.getElementById('productsList');

  // Кнопка добавления товара
  addBtn.onclick = async () => {
    const title = titleInput.value.trim();
    const price = priceInput.value.trim();

    if(!title || !price) {
      alert('Заполни все поля!');
      return;
    }

    try {
      await db.collection('products').add({
        title: title,
        price: Number(price),
        time: Date.now()
      });
      titleInput.value = '';
      priceInput.value = '';
      alert('Товар успешно улетел в базу!');
    } catch(e) {
      alert('Ошибка: ' + e.message);
    }
  };

  // Слушатель в реальном времени (синхронизация между устройствами)
  db.collection('products').orderBy('time', 'desc').onSnapshot(snapshot => {
    if(snapshot.empty) {
      productsList.innerHTML = 'Пока нет товаров в базе.';
      return;
    }

    let html = '';
    snapshot.forEach(doc => {
      const p = doc.data();
      html += `
        <div class="product-card">
          <b>${p.title}</b>
          <div class="price">${p.price} ₽</div>
        </div>
      `;
    });
    productsList.innerHTML = html;
  }, error => {
    productsList.innerHTML = 'Ошибка подключения к базе: ' + error.message;
  });
</script>

</body>
</html>
