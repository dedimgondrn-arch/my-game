<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{color-scheme:dark;--a:#3b82ff;--b:#ff8a1f;--c:#a6ff3d;--bg:#05070b;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--tx:#ece8e2;--mu:#a39e96;--dg:#ff9d8f;--f:'Nunito',system-ui,'Segoe UI',sans-serif;--d:'Unbounded','Nunito',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

.au{position:fixed;z-index:-2;border-radius:50%;filter:blur(110px);pointer-events:none}

@keyframes f1{to{transform:translate(12vw,10vh) scale(1.2)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,textarea,select{font:inherit;color:inherit}
button,.bt{cursor:pointer;border:2px solid transparent;border-radius:16px;padding:12px 20px;font-weight:700;background:linear-gradient(#000,#000) padding-box,conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a)) border-box;animation:sp 5s linear infinite;box-shadow:0 0 22px -9px var(--b);transition:transform .15s,color .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{color:var(--c)}button:active{transform:scale(.96)}button:disabled{opacity:.4;animation:none;cursor:not-allowed}

.sm{padding:7px 13px;font-size:14px;border-radius:12px}.w{width:100%}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}

label.l{display:block;color:var(--mu);font-size:14px;font-weight:600;margin:14px 0 6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;margin:8px auto 0;width:min(1200px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-radius:24px;background:rgba(14,16,22,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line)}
.mk{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font:600 18px var(--d);color:#000;background:conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a));animation:sp 6s linear infinite;cursor:pointer}
.br{font:500 13px var(--d);cursor:pointer;white-space:nowrap;background:linear-gradient(100deg,#fff,#777,var(--c),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.sr{flex:1;min-width:0}.sr input{border-radius:999px;padding:10px 16px}
.lg,.ntf-box{position:relative;flex:none}.lg>button,.ntf-box>button{padding:9px 12px;border-radius:99px}
.lp,.ntf-pop{position:absolute;right:0;top:calc(100% + 10px);background:#0d0f14;border:1px solid var(--line);border-radius:18px;padding:10px;display:none;min-width:240px;box-shadow:0 20px 50px -20px var(--b);z-index:40}.lp.o,.ntf-pop.o{display:block}
.lp button{width:100%;margin:3px 0;justify-content:flex-start}
main{max-width:1200px;margin:auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom,0px))}
.hero{padding:30px 0 6px}
.ti{font:600 clamp(34px,8vw,70px)/1.05 var(--d);margin:0 0 12px;background:linear-gradient(100deg,var(--a),var(--b) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.su{color:var(--mu);font-size:clamp(16px,2.6vw,21px);max-width:640px;margin:0 0 18px}
.sts{display:flex;gap:10px;flex-wrap:wrap}.st{padding:12px 18px;border:1px solid var(--line);border-radius:20px;background:var(--card);min-width:110px}.st b{display:block;font:500 24px var(--d)}.st span{color:var(--mu);font-size:13px}
.tk{overflow:hidden;margin:20px 0 4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tr{display:flex;width:max-content;gap:30px;color:var(--mu);font-weight:700;animation:tk 40s linear infinite}.tr span::before{content:"✦";color:var(--c);margin-right:30px}@keyframes tk{to{transform:translateX(-50%)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}.chips button{white-space:nowrap;flex:none}
.bar{display:flex;gap:10px;align-items:center;margin:8px 0 18px;flex-wrap:wrap}.bar h2{font:500 20px var(--d);margin:0;flex:1;min-width:120px}
.sort{width:auto;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.shelf{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}.shelf .card{width:230px;flex:none}
.card{position:relative;border-radius:24px;border:1px solid var(--line);background:var(--card);padding:9px;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,box-shadow .3s,border-color .3s;animation:ri .5s both}
@keyframes ri{from{opacity:0;transform:translateY(16px)}}
.card:hover{transform:translateY(-6px);border-color:#ff8a1f70;box-shadow:0 24px 54px -26px var(--a)}
.card.pm{border:2px solid transparent;background:linear-gradient(#0a0c10,#0a0c10) padding-box,conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a)) border-box;animation:sp 5s linear infinite,ri .5s both}
.im{aspect-ratio:1;border-radius:17px;background:linear-gradient(135deg,#ffffff12,#ffffff05);display:grid;place-items:center;font-size:50px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover .im img{transform:scale(1.07)}
.cb{padding:12px 8px 6px;display:flex;flex-direction:column;gap:3px}
.ct{font-size:12px;color:var(--c);font-weight:700}.nm{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font:600 19px var(--d);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.old-pr{font-size:14px;color:var(--mu);text-decoration:line-through;font-family:var(--f)}
.disc-badge{background:var(--b);color:#000;font:800 10px var(--f);padding:2px 6px;border-radius:6px}
.mu{color:var(--mu);font-size:13px}
.tg{position:absolute;top:16px;left:16px;z-index:2;background:linear-gradient(90deg,var(--b),var(--c));color:#000;font:800 11px var(--f);padding:4px 10px;border-radius:99px}
.hr{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;padding:0;border-radius:99px;background:#000a!important;border:0;animation:none!important;box-shadow:none;backdrop-filter:blur(6px);font-size:17px}
.emp{text-align:center;color:var(--mu);padding:46px 10px;border:1px dashed var(--line);border-radius:24px}
.pan{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px}
.det{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
@media(max-width:760px){.det{grid-template-columns:1fr}.br{display:none}}
.ga{aspect-ratio:1;border-radius:22px;overflow:hidden;background:#ffffff0a;display:grid;place-items:center;font-size:80px}.ga img{width:100%;height:100%;object-fit:contain;background:#000}
.th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.th img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid transparent;cursor:pointer;flex:none}.th img.on{border-color:var(--c)}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 250px);min-height:340px}
.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:80%;padding:9px 13px;border-radius:18px;background:#ffffff14;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#3b82ff,#ff8a1f);color:#000;font-weight:600}
.m.sf{border:1px solid var(--c)}.m img{display:block;max-width:240px;width:100%;border-radius:12px;margin-bottom:4px}.m small{display:flex;justify-content:flex-end;align-items:center;gap:3px;opacity:.65;font-size:11px;margin-top:2px}
.bg{display:inline-block;background:var(--c);color:#000;font:800 10px var(--f);padding:2px 8px;border-radius:99px;margin-right:6px}
.cf{display:flex;gap:8px;margin-top:8px;align-items:center}.ib{width:44px;height:44px;padding:0;border-radius:99px;flex:none}
.row{display:flex;gap:12px}.row>*{flex:1}
.mo{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}.mo.o{display:flex}
.sheet{width:min(560px,100%);max-height:94dvh;overflow:auto;background:#0d0f14;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}.sheet h3{font:500 18px var(--d);margin:0 0 4px}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.up .p{width:78px;height:78px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}.up img{width:100%;height:100%;object-fit:cover}
.up .p b{position:absolute;top:3px;right:3px;cursor:pointer;background:#000b;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.add{width:78px;height:78px;border-radius:14px;border:1px dashed var(--mu);display:grid;place-items:center;font-size:28px;cursor:pointer;color:var(--c)}
.tip{border:1px solid #00f0ff55;border-radius:16px;padding:11px 14px;color:#8cf6ff;font-size:14px;margin-top:14px}
.pay{border:1px solid var(--b);border-radius:18px;padding:14px;margin-top:12px;background:#ff8a1f10;display:none}.pay.o{display:block}
.pay b{font:600 22px var(--d);color:var(--c)}
.ty{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#14161c;border:1px solid var(--line);padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}.ty.o{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;width:min(560px,calc(100% - 20px));display:flex;align-items:center;justify-content:space-around;padding:8px;border-radius:28px;background:rgba(14,16,22,.8);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 20px 50px -20px #000}
nav button{position:relative;flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:11px;border:0;border-radius:16px;background:none;animation:none;box-shadow:none;color:var(--mu)}nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--c)}nav button.sl{flex:none;width:58px;height:58px;margin:-24px 4px 0;border-radius:99px;font-size:28px;color:#000;background:conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a));animation:sp 5s linear infinite;box-shadow:0 0 30px -4px var(--b)}
.nb{position:absolute;top:0;right:18%;min-width:18px;height:18px;border-radius:99px;background:var(--c);color:#000;font:800 10px var(--f);display:grid;place-items:center;padding:0 4px}
.li{display:flex;gap:12px;align-items:center;padding:10px}.li .t{width:64px;height:64px;border-radius:14px;overflow:hidden;background:#ffffff0d;display:grid;place-items:center;font-size:26px;flex:none}.li .t img{width:100%;height:100%;object-fit:cover}.li>div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font:700 11px var(--f);padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mu);margin-right:4px}.pill.g{color:var(--c);border-color:var(--c)}.pill.o{color:var(--b);border-color:var(--b)}
.m.sy{align-self:center;background:none;color:var(--mu);font-size:13px;text-align:center;max-width:100%}
.steps{display:flex;gap:6px;margin-bottom:10px}.steps i{flex:1;font-style:normal;border-top:4px solid var(--line);padding-top:4px;font-size:11px;color:var(--mu);text-align:center;border-radius:2px}.steps i.on{border-color:var(--c);color:var(--c)}
.pan .w{margin-top:8px}
.av{width:76px;height:76px;flex:none;border-radius:26px;display:grid;place-items:center;font:600 32px var(--d);color:#000;background:conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a));animation:sp 6s linear infinite}
.pf{display:flex;gap:16px;align-items:center}.pf h2{font:600 22px var(--d);margin:0 0 4px;overflow-wrap:anywhere}
.chat{height:calc(100dvh - 340px);min-height:280px}
.bnr{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 0;padding:12px 14px;border-radius:20px;border:2px solid transparent;background:linear-gradient(#0a0c10,#0a0c10) padding-box,conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a)) border-box;animation:sp 6s linear infinite;font-weight:700}
.bnr .ib{width:34px;height:34px}
.q-reply{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.q-reply button{white-space:nowrap;font-size:12px;padding:6px 12px;border-radius:99px;flex:none}
.auth-tabs{display:flex;gap:8px;margin:14px 0}
.auth-tabs button{flex:1;padding:8px;font-size:13px}
.ntf-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.ntf-item:last-child{border-bottom:0}

function playBeep(freq=600, dur=0.08){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e){}
}

function createLocalDB() {
  const store = (k, val) => val !== undefined ? LS('db_' + k, JSON.stringify(val)) : JSON.parse(LS('db_' + k) || '[]');
  const listenMap = {};
  const notify = (col) => { if(listenMap[col]) listenMap[col].forEach(cb => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) })); };
  return {
    collection: function(col) {
      return {
        onSnapshot: (cb) => {
          if(!listenMap[col]) listenMap[col] = [];
          listenMap[col].push(cb);
          setTimeout(() => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) }), 0);
          return () => { listenMap[col] = listenMap[col].filter(x => x !== cb); };
        },
        where: function(field, op, val) {
          return {
            onSnapshot: (cb) => {
              const filterDocs = () => store(col).filter(d => op === '==' ? d[field] === val : true);
              setTimeout(() => cb({ docs: filterDocs().map(d => ({ id: d.id, data: () => d })) }), 0);
              return () => {};
            }
          };
        },
        doc: function(id) {
          return {
            set: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) arr[idx] = { ...arr[idx], ...data, id };
              else arr.push({ ...data, id });
              store(col, arr); notify(col);
            },
            update: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) { arr[idx] = { ...arr[idx], ...data }; store(col, arr); notify(col); }
            },
            delete: async () => {
              let arr = store(col).filter(x => x.id !== id);
              store(col, arr); notify(col);
            },
            onSnapshot: (cb) => {
              const d = store(col).find(x => x.id === id);
              cb({ exists: !!d, data: () => d });
              return () => {};
            }
          };
        }
      };
    }
  };
}

async function prep(f, max, qv) {
  let b; try { b = await createImageBitmap(f); } catch(x) { b = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); }); }
  const w = b.width || b.naturalWidth, h = b.height || b.naturalHeight, s = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s); const x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height); x.drawImage(b, 0, 0, c.width, c.height);
  return new Promise((ok, no) => c.toBlob(r => r ? ok(r) : no(), "image/jpeg", qv));
}

async function upl(f) {
  if(as) { try { const r = await as.upload(await prep(f, 1100, .82)); return "/_blob/" + r.id; } catch(x) {} }
  const bl = await prep(f, 400, .5); return await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(bl); });
}
async function uplVideo(f) {
  if(!as) throw new Error("storage unavailable");
  if(!/^video\/(mp4|webm|quicktime)$/.test(f.type) || f.size > 20 * 1024 * 1024) throw new Error("unsupported video");
  const r = await as.upload(f);
  return "/_blob/" + r.id;
}

$("#authFm").onsubmit = async (ev) => {
  ev.preventDefault();
  const val = $("#auVal").value.trim().toLowerCase();
  const pass = $("#auPass").value.trim();
  const name = $("#auName").value.trim();
  
  if(!val || !pass) return;

  const users = (await new Promise(resolve => {
    db.collection("users").onSnapshot(s => resolve(s.docs.map(d => ({ id: d.id, ...d.data() }))));
  })) || [];

  if(isRegMode) {
    const exists = users.find(u => u.login === val);
    if(exists) { toast(t("authExists")); return; }
    
    const newUid = "usr_" + Date.now().toString(36);
    const newUser = { uid: newUid, login: val, pass, name: name || "Игрок " + newUid.slice(-4), method: authMethod, ts: Date.now() };
    await db.collection("users").doc(newUid).set(newUser);
    
    userAuth = newUser;
    uid = newUid;
    LS("noir_user", JSON.stringify(userAuth));
    LS("noir_uid", uid);
    names[uid] = newUser.name;
    
    $("#authMo").classList.remove("o");
    toast(t("authWelcome"));
    render();
  } else {
    const found = users.find(u => u.login === val && u.pass === pass);
    if(!found) { toast(t("authInvalid")); return; }
    
    userAuth = found;
    uid = found.uid;
    LS("noir_user", JSON.stringify(userAuth));
    LS("noir_uid", uid);
    names[uid] = found.name;
    
    $("#authMo").classList.remove("o");
    toast(t("authReturning") + found.name + "!");
    render();
  }
};
