<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>NOIR MARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{color-scheme:dark;--a:#ffb21a;--b:#ff6a00;--c:#ffd15c;--bg:#070707;--card:#111113;--line:#343438;--tx:#f5f3ef;--mu:#a3a1a0;--dg:#ff8f7d;--f:'Nunito',system-ui,sans-serif;--d:'Unbounded',system-ui,sans-serif;box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#211307 0,transparent 38%),var(--bg);color:var(--tx);font:500 16px/1.55 var(--f);overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button,.bt{cursor:pointer;border:1px solid #ffc04a;border-radius:16px;padding:12px 20px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));color:#130b02;box-shadow:0 7px 22px #ff790027;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:not-allowed}
.gh{color:var(--tx);background:#111113!important;border:1px solid #39393d!important;box-shadow:none!important}
.gh:hover,.gh.on{color:var(--a);border-color:var(--a)!important;background:#21170b!important}
.dg{color:var(--dg);background:#100c0b!important;border-color:#63342b!important}
.sm{padding:7px 13px;font-size:14px;border-radius:12px}.w{width:100%}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 4px #ff8a1f20}
select option{background:#101216}textarea{resize:vertical}
label.l{display:block;color:var(--mu);font-size:14px;font-weight:600;margin:14px 0 6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;margin:8px auto 0;width:min(1200px,calc(100% - 20px));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:22px;background:rgba(10,10,12,.88);backdrop-filter:blur(20px);border:1px solid #303034}
.mk,.av{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font:600 18px var(--d);color:#140900;background:linear-gradient(135deg,#ffbd24,#ff6500);cursor:pointer}
.br{font:500 13px var(--d);cursor:pointer;white-space:nowrap;color:var(--a)}
.sr{flex:1;min-width:0}.sr input{border-radius:999px;padding:10px 16px}
.lg,.ntf-box{position:relative;flex:none}.lg>button,.ntf-box>button{padding:9px 12px;border-radius:99px}
.lp,.ntf-pop{position:absolute;right:0;top:calc(100% + 10px);background:#111113;border:1px solid #343438;border-radius:18px;padding:10px;display:none;min-width:240px;box-shadow:0 20px 50px -24px #ff7b00;z-index:40}.lp.o,.ntf-pop.o{display:block}
.lp button{width:100%;margin:3px 0;justify-content:flex-start}
main{max-width:1200px;margin:auto;padding:14px}
.hero{padding:18px 0 8px}
.ti{font:800 clamp(28px,7vw,58px)/1.05 var(--d);margin:0 0 10px;color:var(--tx)}
.ti span{background:linear-gradient(100deg,#fff2d7,var(--a) 62%,var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.su{color:#aaa7a3;font-size:15px;max-width:600px;margin:0 0 16px}
.sts{display:flex;gap:10px;flex-wrap:wrap}.st{padding:10px 16px;border:1px solid #343438;border-radius:16px;background:#111113;min-width:100px}.st b{display:block;font:700 20px var(--d);color:var(--a)}.st span{color:var(--mu);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}.chips button{white-space:nowrap;flex:none}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 12px}.bar h2{font:800 21px var(--d);margin:0;flex:1;letter-spacing:-.03em}
.sort{width:auto;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{position:relative;border-radius:18px;border:1px solid #343438;background:#111113;padding:8px;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,border-color .3s}
.card:hover{transform:translateY(-3px);border-color:var(--a)}
.card.pm{border-color:var(--a);box-shadow:0 0 18px #ff8a1f12}
.im{aspect-ratio:1;border-radius:13px;background:#17171a;display:grid;place-items:center;font-size:42px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.cb{padding:10px 4px 5px;display:flex;flex-direction:column;gap:5px}
.ct{color:var(--a);font-size:11px;font-weight:700}.nm{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font:800 17px var(--f);color:var(--a)}
.old-pr{font-size:13px;color:var(--mu);text-decoration:line-through;margin-left:6px}
.disc-badge{background:var(--b);color:#000;font:800 10px var(--f);padding:2px 6px;border-radius:6px;margin-left:6px}
.mu{color:var(--mu);font-size:13px}
.tg{position:absolute;top:12px;left:12px;z-index:2;background:var(--a);color:#1a1003;font:800 11px var(--f);padding:4px 10px;border-radius:99px}
.hr{position:absolute;top:11px;right:11px;z-index:2;width:32px;height:32px;padding:0;border-radius:99px;background:#080808c9!important;border:0;font-size:16px}
.emp{text-align:center;color:var(--mu);padding:40px 10px;border:1px dashed #343438;border-radius:20px}
.pan{border:1px solid #343438;background:#111113;border-radius:20px;padding:16px;margin-bottom:14px}
.det{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:760px){.det{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ga{aspect-ratio:1;border-radius:18px;overflow:hidden;background:#111113;display:grid;place-items:center;font-size:70px}.ga img{width:100%;height:100%;object-fit:contain;background:#000}
.th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;flex:none}.th img.on{border-color:var(--a)}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 300px);min-height:280px}
.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;background:#ffffff10;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#130b02;font-weight:700}
.m.sf{border:1px solid var(--a)}
.m img{display:block;max-width:220px;width:100%;border-radius:10px;margin-bottom:4px}
.m small{display:block;opacity:.65;font-size:10px;margin-top:3px;text-align:right}
.cf{display:flex;gap:8px;margin-top:8px;align-items:center}.ib{width:42px;height:42px;padding:0;border-radius:99px;flex:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.mo{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:flex-end;justify-content:center}
.mo.o{display:flex}
.sheet{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#111113;border:1px solid #343438;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 18px var(--d);margin:0 0 6px}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.up .p{width:74px;height:74px;border-radius:12px;overflow:hidden;position:relative;border:1px solid #343438}.up img{width:100%;height:100%;object-fit:cover}
.up .p b{position:absolute;top:2px;right:2px;cursor:pointer;background:#000b;border-radius:99px;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.add{width:74px;height:74px;border-radius:12px;border:1px dashed var(--mu);display:grid;place-items:center;font-size:26px;cursor:pointer;color:var(--a)}
.tip{border:1px solid #594317;border-radius:16px;padding:12px 14px;color:#ffca66;font-size:13px;margin-top:14px;background:#ffb21a0a}
.pay{border:1px solid var(--a);border-radius:16px;padding:12px;margin-top:12px;background:#ff8a1f0c;display:none}.pay.o{display:block}
.pay b{color:var(--a)}
.ty{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#17171a;border:1px solid #343438;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}
.ty.o{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;width:min(580px,calc(100% - 20px));display:flex;align-items:center;justify-content:space-around;padding:7px;border-radius:26px;background:rgba(13,13,15,.94);border:1px solid #353539;box-shadow:0 15px 40px #000b}
nav button{position:relative;flex:1;flex-direction:column;gap:1px;padding:6px 2px;font-size:10px;border:0;border-radius:16px;background:none;color:#aaa7a3;box-shadow:none}
nav button i{font-style:normal;font-size:19px}
nav button.on{color:var(--a)}
nav button.sl{color:#150a00;background:linear-gradient(135deg,#ffbe1e,#ff6b00);width:54px;height:54px;flex:none;margin:-22px 2px 0;border-radius:99px;font-size:26px;box-shadow:0 0 24px #ff850020}
.nb{position:absolute;top:2px;right:20%;min-width:16px;height:16px;border-radius:99px;background:var(--a);color:#000;font:800 9px var(--f);display:grid;place-items:center;padding:0 3px}
.li{display:flex;gap:12px;align-items:center;padding:10px}.li .t{width:60px;height:60px;border-radius:12px;overflow:hidden;background:#17171a;display:grid;place-items:center;font-size:24px;flex:none}.li .t img{width:100%;height:100%;object-fit:cover}.li>div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font:700 11px var(--f);padding:2px 8px;border-radius:99px;border:1px solid #343438;color:var(--mu);margin-right:4px}.pill.g{color:var(--a);border-color:var(--a)}.pill.o{color:var(--b);border-color:var(--b)}
.home-categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 16px}
.home-cat{min-height:86px;padding:10px 6px;border:1px solid #343438;border-radius:16px;background:linear-gradient(160deg,#151517,#0d0d0f);color:#f4f1eb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.2s}
.home-cat:hover,.home-cat.on{border-color:var(--a);color:var(--a);background:#1c1307}
.home-cat i{font-style:normal;font-size:22px}
.home-cat span{font-size:11px;font-weight:700}
.ad-slot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 16px;padding:14px;border:1px dashed #76531b;border-radius:16px;background:#191208}
.ad-slot b{display:block;color:var(--a);font-size:14px}.ad-slot span{display:block;color:var(--mu);font-size:12px}
.av-big{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font:700 30px var(--d);color:#150a00;background:linear-gradient(135deg,#ffbd24,#ff6500)}
.pf{display:flex;gap:16px;align-items:center}.pf h2{font:700 20px var(--d);margin:0 0 4px}
.theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme-choice{min-height:68px;flex-direction:column;border:1px solid #39393d!important;background:#111113!important}
.theme-choice.on{border-color:var(--a)!important;color:var(--a)!important}
.theme-dot{width:20px;height:20px;border-radius:50%;display:inline-block}
.disclaimer{border:1px solid #76531b;background:#191208;border-radius:16px;padding:14px;color:#f2d7a4;font-size:13px;line-height:1.5;margin-top:10px}
.video-player{width:100%;max-height:400px;border-radius:16px;background:#000;margin:10px 0;object-fit:contain}
.published{font-size:11px;color:var(--mu);margin-top:2px}
</style></head><body>

<header>
  <div class="mk" id="lgo" title="На главную">N</div>
  <div class="br" id="lgb">NOIR MARKET</div>
  <div class="sr"><input id="q" type="search" placeholder="Поиск товара..." autocomplete="off"></div>
  <div class="ntf-box">
    <button class="gh sm" id="bellBtn">🔔 <span id="bellBadge" class="nb" style="display:none">0</span></button>
    <div class="ntf-pop" id="ntfPop">
      <div style="font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between">
        <span>Уведомления</span><button class="gh sm" id="clrNtf" style="padding:2px 8px;font-size:11px">Очистить</button>
      </div>
      <div id="ntfList" style="max-height:240px;overflow-y:auto"><div class="mu" style="text-align:center;padding:10px">Нет уведомлений</div></div>
    </div>
  </div>
  <button class="gh sm" id="authBtn">👤 Войти</button>
  <div class="lg"><button class="gh" id="lb">🌐</button><div class="lp" id="lp"></div></div>
</header>

<main id="app"></main>

<nav id="nv">
  <button data-g="inbox"><i>💬</i>Чаты</button>
  <button data-g="mine"><i>▣</i>Мои товары</button>
  <button class="sl" data-g="sell">＋</button>
  <button data-g="settings"><i>⚙</i>Настройки</button>
  <button data-g="home"><i>☰</i>Меню</button>
</nav>

<!-- Авторизация -->
<div class="mo" id="authMo"><div class="sheet">
  <h3 id="authTitle">Вход в аккаунт</h3>
  <div class="auth-tabs" style="display:flex;gap:8px;margin:12px 0">
    <button class="gh on" id="atTg" style="flex:1">Telegram</button>
    <button class="gh" id="atPh" style="flex:1">Телефон</button>
  </div>
  <form id="authFm">
    <label class="l" id="authLbl">Telegram Юзернейм (например @username)</label>
    <input id="auVal" placeholder="@username" required>
    <label class="l">Пароль / PIN</label>
    <input type="password" id="auPass" placeholder="Пароль" required>
    <div id="regNameBox" style="display:none">
      <label class="l">Ваше имя (для регистрации)</label>
      <input id="auName" placeholder="Никнейм">
    </div>
    <button class="w" style="margin-top:16px" id="authSubmitBtn">Войти</button>
  </form>
  <div style="text-align:center;margin-top:10px">
    <button class="gh sm" id="toggleRegBtn">Создать новый аккаунт</button>
  </div>
  <button class="gh w" id="authClose" style="margin-top:10px">Отмена</button>
</div></div>

<!-- Добавление товара -->
<div class="mo" id="mo"><form class="sheet" id="fm">
  <h3>Новое объявление</h3>
  <label class="l">Фото (до 5)</label><div class="up" id="up"></div>
  <input class="vh" id="fl" type="file" accept="image/*" multiple>
  <label class="l" for="ft">Название товара</label><input id="ft" required maxlength="90" placeholder="Например: 1000 голды Standoff 2">
  <div class="row">
    <div><label class="l">Категория</label><select id="fc"></select></div>
    <div><label class="l">Цена, ₽</label><input id="fp" type="number" min="1" required placeholder="500"></div>
  </div>
  <label class="l">Старая цена (для скидки, опционально)</label><input id="fOldP" type="number" min="1" placeholder="650">
  <label class="l">Способ передачи</label><select id="fh"></select>
  <label class="l">Описание</label><textarea id="fs" rows="3" maxlength="1000" placeholder="Условия сделки, состояние..."></textarea>
  <div class="row" style="margin-top:16px"><button type="button" class="gh" id="fx">Отмена</button><button id="fg">Опубликовать</button></div>
</form></div>

<div class="ty" id="ty"></div>
<div class="mo" id="gm"><div class="sheet" id="gb"></div></div>

<script>
const CATS=[["so2","🔫","Standoff 2"],["bs","⭐","Brawl Stars"],["rb","🧱","Roblox"],["mc","⛏️","Minecraft"],["gi","🌌","Genshin Impact"],["cur","💰","Валюта"],["skin","🎨","Скины"],["acc","👤","Аккаунты"],["boost","🚀","Буст и услуги"],["oth","📦","Прочее"]];
const CI=Object.fromEntries(CATS.map(c=>[c[0],c[1]])), CN=Object.fromEntries(CATS.map(c=>[c[0],c[2]]));
const LS=(k,v)=>v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);

let userAuth=JSON.parse(LS("noir_user")||"null");
let uid=userAuth?userAuth.uid:("usr_"+Math.random().toString(36).slice(2,9));
let L=JSON.parse(LS("noir_listings")||"[]");
let TH=JSON.parse(LS("noir_threads")||"{}");
let MSGS=JSON.parse(LS("noir_msgs")||"{}");
let TK=JSON.parse(LS("noir_tickets")||"[]");
let REVS=JSON.parse(LS("noir_revs")||"[]");
let FAV=JSON.parse(LS("noir_fav")||"[]");
let view={t:"home"}, cat="all", q="", srt="new", ph=[], themeName=LS("noirtheme")||"orange";

const PALETTES={orange:["#ffb21a","#ff6a00"],blue:["#36b8ff","#1a5fff"],purple:["#bd62ff","#7014e0"]};
function applyTheme(name=themeName){
  themeName=PALETTES[name]?name:"orange";
  const p=PALETTES[themeName];
  document.documentElement.style.setProperty("--a",p[0]);
  document.documentElement.style.setProperty("--b",p[1]);
  LS("noirtheme",themeName);
}
applyTheme();

function saveAll(){
  LS("noir_listings",JSON.stringify(L));
  LS("noir_threads",JSON.stringify(TH));
  LS("noir_msgs",JSON.stringify(MSGS));
  LS("noir_tickets",JSON.stringify(TK));
  LS("noir_revs",JSON.stringify(REVS));
  LS("noir_fav",JSON.stringify(FAV));
}

const $=s=>document.querySelector(s), e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>new Intl.NumberFormat("ru-RU").format(n)+" ₽";
const dt=ts=>new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
function toast(m){const x=$("#ty");x.textContent=m;x.classList.add("o");clearTimeout(x.t);x.t=setTimeout(()=>x.classList.remove("o"),2500);}

function renderNav(){
  const unread=Object.values(TH).filter(h=>h.unread && h.lastBy!==uid).length;
  $("#bellBadge").style.display=unread?"inline-flex":"none";
  $("#bellBadge").textContent=unread;
  $("#authBtn").textContent=userAuth?("👤 "+userAuth.name):"👤 Войти";
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.classList.toggle("on", view.t===b.dataset.g || (view.t==="chat"&&b.dataset.g==="inbox") || (view.t==="item"&&b.dataset.g==="home"));
  });
}

function go(t,o={}){view={t,...o};window.scrollTo(0,0);render();}

function render(){
  renderNav();
  const a=$("#app");
  if(view.t==="home") home(a);
  else if(view.t==="item") item(a);
  else if(view.t==="mine") mineV(a);
  else if(view.t==="inbox") inbox(a);
  else if(view.t==="chat") chat(a);
  else if(view.t==="settings") settings(a);
  else if(view.t==="support") support(a);
  else if(view.t==="profile") profile(a);
  else home(a);
}

function card(x){
  const p=x.photos?.[0], f=FAV.includes(x.id);
  const oldP=x.oldPrice>x.price?x.oldPrice:0;
  const disc=oldP?Math.round((1-x.price/oldP)*100):0;
  return `<div class="card ${x.prem?"pm":""}" data-i="${e(x.id)}">
    ${x.prem?'<span class="tg">PREMIUM</span>':""}
    <button class="hr" data-f="${e(x.id)}">${f?"❤️":"🤍"}</button>
    <div class="im">${p?`<img src="${p}" loading="lazy">`:CI[x.cat]||"📦"}</div>
    <div class="cb">
      <span class="ct">${CI[x.cat]} ${e(CN[x.cat])}</span>
      <span class="nm">${e(x.title)}</span>
      <div class="pr">${rub(x.price)}${oldP?`<span class="old-pr">${rub(oldP)}</span><span class="disc-badge">-${disc}%</span>`:""}</div>
      <div class="published">🕒 ${dt(x.ts)}</div>
    </div>
  </div>`;
}

function bindCards(a){
  a.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>go("item",{id:b.dataset.i}));
  a.querySelectorAll("[data-f]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const id=b.dataset.f;
    FAV=FAV.includes(id)?FAV.filter(i=>i!==id):[...FAV,id];
    saveAll(); render();
  });
}

function home(a){

          `<div class="row">
             <button class="w" id="buyBtn" style="padding:14px">🛒 Купить</button>

      openChat(x, msg);
    };

function openChat(x, initMsg=""){
  const tid=x.id+"_"+uid;
  if(!TH[tid]){
    TH[tid]={id:tid, lid:x.id, title:x.title, buyer:uid, seller:x.seller, sellerName:x.sellerName||"Продавец", last:initMsg||"Начало диалога", lastBy:uid, ts:Date.now(), unread:true};
  }
  if(initMsg){
    if(!MSGS[tid]) MSGS[tid]=[];
    MSGS[tid].push({from:uid, text:initMsg, ts:Date.now()});
    TH[tid].last=initMsg; TH[tid].lastBy=uid; TH[tid].ts=Date.now();
  }
  saveAll();
  go("chat",{tid});
}

function chat(a){
  const tid=view.tid, th=TH[tid];
  if(!th){a.innerHTML=`<div class="emp">Чат не найден<br><br><button onclick="go('inbox')">К чатам</button></div>`;return;}
  const peerName=th.buyer===uid?(th.sellerName||"Продавец"):"Покупатель";

  a.innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <button class="gh sm" onclick="go('inbox')">← Назад</button>
      <div><b>${e(peerName)}</b><div class="mu">${e(th.title)}</div></div>
    </div>
    <div class="pan chat" style="padding:12px">
      <div class="ms" id="ms"></div>
      <form class="cf" id="cf">
        <input id="mt" placeholder="Написать сообщение..." required autocomplete="off">
        <button class="ib">➤</button>
      </form>
    </div>
  `;

  const drawMsgs=()=>{
    const msgs=MSGS[tid]||[];
    $("#ms").innerHTML=msgs.map(m=>`<div class="m ${m.from===uid?"me":""}">${e(m.text)}<small>${dt(m.ts)}</small></div>`).join("")||`<div class="mu" style="text-align:center">Напишите первое сообщение продавцу.</div>`;
    $("#ms").scrollTop=$("#ms").scrollHeight;
  };
  drawMsgs();

  $("#cf").onsubmit=ev=>{
    ev.preventDefault();
    const t=$("#mt").value.trim(); if(!t)return;
    $("#mt").value="";
    if(!MSGS[tid]) MSGS[tid]=[];
    MSGS[tid].push({from:uid, text:t, ts:Date.now()});
    th.last=t; th.lastBy=uid; th.ts=Date.now(); th.unread=true;
    saveAll(); drawMsgs();
  };
}

      <b>${e(h.buyer===uid?(h.sellerName||"Продавец"):"Покупатель")}</b> <span class="mu">· ${e(h.title)}</span>

function fillSel(){

  $("#fh").innerHTML=[
    ["h1","Через обмен в игре"],
    ["h2","Передача аккаунта"],
    ["h3","Код активации / Ключ"],
    ["h4","Договоримся в чате"]
  ].map(h=>`<option value="${h[0]}">${h[1]}</option>`).join("");
}

function openForm(){
  if(!userAuth){toast("Сначала войдите в аккаунт!");$("#authMo").classList.add("o");return;}
  ph=[]; $("#fm").reset(); fillSel(); ups();
  $("#mo").classList.add("o");
}
$("#fx").onclick=()=>$("#mo").classList.remove("o");

async function prep(f){
  return new Promise(ok=>{
    const r=new FileReader();
    r.onload=e=>ok(e.target.result);
    r.readAsDataURL(f);
  });
}

$("#fl").onchange=async ev=>{
  const files=[...ev.target.files].slice(0,5-ph.length);
  ev.target.value="";
  for(let f of files){
    const base64=await prep(f);
    ph.push(base64);
    ups();
  }
};

function ups(){
  $("#up").innerHTML=ph.map((u,i)=>`<div class="p"><img src="${u}"><b onclick="ph.splice(${i},1);ups()">✕</b></div>`).join("")+(ph.length<5?'<label class="add" for="fl">＋</label>':"");
}

$("#fm").onsubmit=async ev=>{
  ev.preventDefault();
  const title=$("#ft").value.trim();
  const price=+("#fp" && $("#fp").value);
  const oldPrice=+("#fOldP" && $("#fOldP").value);
  const cat=$("#fc").value;
  const how=$("#fh").value;
  const desc=$("#fs").value.trim();

  if(!title||!price)return;

  L.unshift({
    id:"item_"+Date.now(),
    title, price, oldPrice, cat, how, desc,
    photos:ph,
    seller:uid,
    sellerName:userAuth.name,
    ts:Date.now(),
    sold:false
  });
  saveAll();
  $("#mo").classList.remove("o");
  toast("Товар успешно опубликован!");
  go("mine");
};

$("#authBtn").onclick=()=>{
  if(userAuth) go("profile",{id:uid});
  else $("#authMo").classList.add("o");
};
$("#authClose").onclick=()=>$("#authMo").classList.remove("o");

$("#toggleRegBtn").onclick=()=>{
  isReg=!isReg;
  $("#authTitle").textContent=isReg?"Регистрация нового аккаунта":"Вход в аккаунт";
  $("#authSubmitBtn").textContent=isReg?"Зарегистрироваться":"Войти";
  $("#toggleRegBtn").textContent=isReg?"Уже есть аккаунт? Войти":"Создать новый аккаунт";
  $("#regNameBox").style.display=isReg?"block":"none";
};

$("#authFm").onsubmit=ev=>{
  ev.preventDefault();
  const val=$("#auVal").value.trim();
  const pass=$("#auPass").value.trim();
  const name=$("#auName").value.trim()||("Игрок "+Math.random().toString(36).slice(2,5));

  let users=JSON.parse(LS("noir_users")||"[]");
  if(isReg){
    if(users.find(u=>u.login===val)){toast("Такой аккаунт уже существует!");return;}
    const u={uid:"usr_"+Date.now(), login:val, pass, name};
    users.push(u); LS("noir_users",JSON.stringify(users));
    userAuth=u; uid=u.uid; LS("noir_user",JSON.stringify(u));
    $("#authMo").classList.remove("o");
    toast("Регистрация успешна!");
    render();
  } else {
    const found=users.find(u=>u.login===val && u.pass===pass);
    if(!found){toast("Неверный логин или пароль!");return;}
    userAuth=found; uid=found.uid; LS("noir_user",JSON.stringify(found));
    $("#authMo").classList.remove("o");
    toast("С возвращением, "+found.name+"!");
    render();
  }
};

$("#bellBtn").onclick=()=>$("#ntfPop").classList.toggle("o");
$("#clrNtf").onclick=()=>{TH=Object.fromEntries(Object.entries(TH).map(([k,v])=>[k,{...v,unread:false}]));saveAll();renderNav();};

});

render();
