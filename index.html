
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Auto Seller</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
 --bg:#080a0d;
 --panel:#101419;
 --panel2:#151a20;
 --line:#272e37;
 --text:#f1f3f5;
 --muted:#89929d;
 --green:#51c878;
 --red:#e15d65;
 --yellow:#d9ad55;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}

button,input{font-family:inherit}

#app{
 width:100vw;
 height:100vh;
 overflow:hidden;
 background:
 linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px),
 #080a0d;
 background-size:50px 50px;
}

.topbar{
 height:62px;
 position:absolute;
 top:0;
 left:0;
 right:0;
 z-index:20;
 background:#090b0f;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 24px;
}

.brand{
 display:flex;
 align-items:center;
 gap:11px;
}

.logo{
 width:35px;
 height:35px;
 border:1px solid #3a424c;
 border-radius:8px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:bold;
 background:#151a20;
}

.brand-name{
 font-weight:bold;
 letter-spacing:.5px;
}

.brand-sub{
 color:var(--muted);
 font-size:10px;
 margin-top:2px;
}

.top-money{
 font-weight:bold;
}

.main{
 position:absolute;
 top:62px;
 left:0;
 right:0;
 bottom:0;
 display:flex;
}

.sidebar{
 width:230px;
 flex-shrink:0;
 background:#0b0e12;
 border-right:1px solid var(--line);
 padding:16px 11px;
}

.profile{
 padding:13px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:9px;
 margin-bottom:15px;
}

.profile small{
 color:var(--muted);
 font-size:10px;
}

.profile strong{
 display:block;
 margin-top:5px;
}

.nav{
 display:flex;
 flex-direction:column;
 gap:4px;
}

.nav button{
 border:0;
 background:transparent;
 color:#929aa4;
 height:45px;
 border-radius:7px;
 text-align:left;
 padding:0 12px;
 cursor:pointer;
}

.nav button:hover,
.nav button.active{
 background:#1a1f26;
 color:white;
}

.nav-icon{
 display:inline-block;
 width:25px;
}

.content{
 flex:1;
 min-width:0;
 overflow:auto;
}

.page{
 max-width:1250px;
 margin:auto;
 padding:28px;
}

.title{
 font-size:27px;
 font-weight:bold;
}

.subtitle{
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
 margin-bottom:24px;
}

.hero{
 border:1px solid var(--line);
 border-radius:11px;
 background:#11161c;
 padding:30px;
 min-height:220px;
 display:flex;
 justify-content:space-between;
 align-items:flex-end;
 margin-bottom:15px;
}

.hero-label{
 color:var(--muted);
 font-size:11px;
 letter-spacing:1.5px;
}

.hero h1{
 margin-top:10px;
 font-size:38px;
}

.hero p{
 color:var(--muted);
 margin-top:12px;
 max-width:600px;
 line-height:1.5;
}

.hero-money{
 font-size:30px;
 font-weight:bold;
}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:11px;
}

.stat{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:9px;
 padding:18px;
}

.stat small{
 color:var(--muted);
}

.stat strong{
 display:block;
 margin-top:8px;
 font-size:22px;
}

.car-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.car-card{
 background:#101419;
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
}

.car-image{
 height:190px;
 background:linear-gradient(145deg,#20262d,#0e1115);
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
}

.car-emoji{
 font-size:82px;
 filter:grayscale(.7);
}

.car-city{
 position:absolute;
 left:10px;
 top:10px;
 background:#080a0dcc;
 border:1px solid #363d46;
 padding:5px 8px;
 border-radius:5px;
 font-size:11px;
}

.car-body{
 padding:15px;
}

.car-name{
 font-size:19px;
 font-weight:bold;
}

.car-year{
 color:var(--muted);
 font-size:12px;
 margin-top:4px;
}

.specs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-top:13px;
}

.spec{
 background:#151a20;
 border:1px solid #20262e;
 padding:8px;
 border-radius:6px;
 color:#aeb6bf;
 font-size:11px;
}

.price-row{
 display:flex;
 justify-content:space-between;
 align-items:end;
 margin-top:15px;
}

.price{
 font-size:22px;
 font-weight:bold;
}

.seller{
 color:var(--muted);
 font-size:11px;
}

.actions{
 display:flex;
 gap:7px;
 margin-top:12px;
}

.btn{
 border:1px solid #303741;
 background:#1a2027;
 color:white;
 border-radius:7px;
 padding:11px 12px;
 cursor:pointer;
 font-size:12px;
}

.btn:hover{
 background:#242b33;
}

.btn-main{
 flex:1;
 background:#e8eaed;
 color:#111;
 border-color:#e8eaed;
 font-weight:bold;
}

.trade-buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:14px;
}

.trade-btn{
 border:1px solid #303741;
 background:#171c22;
 color:white;
 border-radius:7px;
 padding:12px 8px;
 cursor:pointer;
 text-align:left;
}

.trade-btn:hover{
 background:#222930;
}

.trade-btn b{
 display:block;
 font-size:13px;
}

.trade-btn span{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-top:4px;
}

.garage-list{
 display:flex;
 flex-direction:column;
 gap:10px;
}

.garage-car{
 display:flex;
 align-items:center;
 gap:15px;
 padding:14px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:9px;
}

.garage-photo{
 width:120px;
 height:80px;
 border-radius:7px;
 background:#181d23;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:45px;
}

.garage-info{
 flex:1;
}

.garage-info h3{
 font-size:17px;
}

.garage-info p{
 color:var(--muted);
 font-size:12px;
 margin-top:5px;
}

.bank-grid,
.city-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.bank-box,
.city{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:20px;
}

.bank-balance{
 background:#11181a;
 border:1px solid var(--line);
 border-radius:10px;
 padding:24px;
 margin-bottom:14px;
}

.bank-balance small{
 color:var(--muted);
}

.bank-number{
 font-size:34px;
 font-weight:bold;
 margin-top:7px;
}

.bank-value{
 font-size:24px;
 font-weight:bold;
 margin-top:13px;
}

.city h3{
 font-size:18px;
}

.city p{
 color:var(--muted);
 font-size:12px;
 margin-top:6px;
}

.city button{
 width:100%;
 margin-top:15px;
}

.table{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:9px;
 overflow:hidden;
 margin-top:20px;
}

.row{
 display:grid;
 grid-template-columns:1.3fr 2fr 1fr 1.5fr;
 padding:13px 15px;
 border-bottom:1px solid var(--line);
 font-size:12px;
}

.row:last-child{border-bottom:0}

.head{
 color:var(--muted);
 background:#0d1014;
}

.modal-bg{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.75);
 z-index:100;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-bg.show{
 display:flex;
}

.modal{
 width:100%;
 max-width:530px;
 background:#11151b;
 border:1px solid #303741;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 30px 100px #000;
}

.modal-head{
 padding:17px 20px;
 border-bottom:1px solid var(--line);
 display:flex;
 justify-content:space-between;
}

.modal-head h2{
 font-size:18px;
}

.close{
 border:0;
 background:transparent;
 color:#89929d;
 font-size:24px;
 cursor:pointer;
}

.modal-body{
 padding:20px;
}

.modal-car{
 display:flex;
 gap:14px;
 border-bottom:1px solid var(--line);
 padding-bottom:17px;
}

.modal-photo{
 width:115px;
 height:78px;
 background:#181d23;
 border-radius:7px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:43px;
}

.modal-car p{
 color:var(--muted);
 font-size:12px;
 margin-top:5px;
}

.trade-current{
 color:var(--muted);
 font-size:12px;
 margin-top:17px;
}

.trade-price{
 font-size:28px;
 font-weight:bold;
 margin-top:4px;
}

.input{
 width:100%;
 padding:13px;
 margin-top:12px;
 background:#0b0e12;
 border:1px solid #303741;
 border-radius:7px;
 color:white;
 outline:none;
}

.modal-actions{
 display:flex;
 gap:8px;
 margin-top:13px;
}

.modal-actions .btn{
 flex:1;
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 z-index:200;
 background:#151a20;
 border:1px solid #303741;
 border-radius:8px;
 padding:13px 17px;
 opacity:0;
 transform:translateY(15px);
 pointer-events:none;
 transition:.2s;
 font-size:13px;
}

.toast.show{
 opacity:1;
 transform:translateY(0);
}

@media(max-width:800px){

 .topbar{
  height:57px;
  padding:0 13px;
 }

 .brand-sub{display:none}

 .main{top:57px}

 .sidebar{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:64px;
  padding:4px;
  border-right:0;
  border-top:1px solid var(--line);
 }

 .profile{display:none}

 .nav{
  height:100%;
  flex-direction:row;
 }

 .nav button{
  flex:1;
  height:55px;
  padding:0;
  text-align:center;
  font-size:9px;
 }

 .nav-icon{
  display:block;
  width:auto;
  font-size:17px;
 }

 .content{
  padding-bottom:64px;
 }

 .page{
  padding:19px 12px 30px;
 }

 .hero{
  display:block;
  min-height:220px;
  padding:20px;
 }

 .hero h1{
  font-size:28px;
 }

 .hero-money{
  margin-top:25px;
 }

 .cards{
  grid-template-columns:1fr 1fr;
 }

 .car-grid{
  grid-template-columns:1fr;
 }

 .car-image{
  height:205px;
 }

 .bank-grid,
 .city-grid{
  grid-template-columns:1fr;
 }

 .garage-car{
  padding:10px;
 }

 .garage-photo{
  width:90px;
  height:65px;
  font-size:36px;
 }

 .trade-buttons{
  grid-template-columns:1fr;
 }

 .modal-bg{
  align-items:flex-end;
  padding:0;
 }

 .modal{
  max-width:none;
  border-radius:14px 14px 0 0;
 }

 .toast{
  left:12px;
  right:12px;
  bottom:78px;
  text-align:center;
 }
}
</style>
</head>

<body>

<div id="app">

<header class="topbar">

 <div class="brand">

  <div class="logo">AS</div>

  <div>
   <div class="brand-name">AUTO SELLER</div>
   <div class="brand-sub">Автомобильный бизнес</div>
  </div>

 </div>

 <div class="top-money" id="topMoney"></div>

</header>


<main class="main">

<aside class="sidebar">

 <div class="profile">
  <small>ТЕКУЩИЙ ГОРОД</small>
  <strong id="sideCity"></strong>
 </div>

 <nav class="nav">

  <button onclick="openPage('home')" id="nav-home">
   <span class="nav-icon">⌂</span>
   Главная
  </button>

  <button onclick="openPage('market')" id="nav-market">
   <span class="nav-icon">🚗</span>
   Авторынок
  </button>

  <button onclick="openPage('garage')" id="nav-garage">
   <span class="nav-icon">▣</span>
   Гараж
  </button>

  <button onclick="openPage('bank')" id="nav-bank">
   <span class="nav-icon">₽</span>
   Банк
  </button>

  <button onclick="openPage('cities')" id="nav-cities">
   <span class="nav-icon">◎</span>
   Города
  </button>

  <button onclick="openPage('stats')" id="nav-stats">
   <span class="nav-icon">▥</span>
   Статистика
  </button>

  <button onclick="openPage('settings')" id="nav-settings">
   <span class="nav-icon">⚙</span>
   Настройки
  </button>

 </nav>

</aside>

<section class="content" id="content"></section>

</main>

</div>


<div class="modal-bg" id="modalBg">

 <div class="modal">

  <div class="modal-head">
   <h2 id="modalTitle">Торг</h2>

   <button class="close" onclick="closeModal()">×</button>
  </div>

  <div class="modal-body" id="modalBody"></div>

 </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   ИГРОВЫЕ ДАННЫЕ
===================================================== */

const DEFAULT_GAME={

 money:500000,

 city:"Томск",

 bought:0,

 sold:0,

 profit:0,

 garage:[],

 deposit:0,

 credit:0,

 history:[]

};


let game=
 JSON.parse(localStorage.getItem("AUTO_SELLER_SAVE"))
 || JSON.parse(JSON.stringify(DEFAULT_GAME));


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

function save(){

 localStorage.setItem(
  "AUTO_SELLER_SAVE",
  JSON.stringify(game)
 );

 updateHeader();
}


function updateHeader(){

 document.getElementById("topMoney").textContent=
  money(game.money);

 document.getElementById("sideCity").textContent=
  game.city;

}


/* =====================================================
   ДЕНЬГИ
===================================================== */

function money(value){

 if(!Number.isFinite(value)){
  return "0 ₽";
 }

 return Math.floor(value)
  .toLocaleString("ru-RU")+" ₽";
}


/*
 Максимально безопасная сумма для JS.

 Это позволяет писать:
 19 000 000
 19 000 000 000
 19 000 000 000 000

 но не бесконечность и не NaN.
*/

const MAX_MONEY=Number.MAX_SAFE_INTEGER;


/* =====================================================
   УВЕДОМЛЕНИЯ
===================================================== */

function toast(text){

 const el=document.getElementById("toast");

 el.textContent=text;

 el.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.classList.remove("show");
 },2400);

}


/* =====================================================
   АВТОМОБИЛИ
===================================================== */

const cars=[

 {
  id:1,
  name:"Lada Priora",
  year:2012,
  mileage:164000,
  power:98,
  condition:"Хорошее",
  city:"Томск",
  price:195000,
  seller:"Алексей",
  emoji:"🚘"
 },

 {
  id:2,
  name:"Lada 2114",
  year:2010,
  mileage:198000,
  power:81,
  condition:"Среднее",
  city:"Москва",
  price:145000,
  seller:"Сергей",
  emoji:"🚗"
 },

 {
  id:3,
  name:"Lada Granta",
  year:2017,
  mileage:97000,
  power:106,
  condition:"Отличное",
  city:"Санкт-Петербург",
  price:395000,
  seller:"Илья",
  emoji:"🚙"
 },

 {
  id:4,
  name:"Lada Vesta",
  year:2019,
  mileage:82000,
  power:106,
  condition:"Хорошее",
  city:"Новосибирск",
  price:620000,
  seller:"Максим",
  emoji:"🚘"
 },

 {
  id:5,
  name:"Toyota Camry",
  year:2011,
  mileage:205000,
  power:181,
  condition:"Среднее",
  city:"Москва",
  price:790000,
  seller:"Роман",
  emoji:"🚗"
 },

 {
  id:6,
  name:"BMW 3 Series",
  year:2008,
  mileage:230000,
  power:218,
  condition:"Требует ремонта",
  city:"Томск",
  price:530000,
  seller:"Дмитрий",
  emoji:"🚙"
 },

 {
  id:7,
  name:"Lada Kalina",
  year:2013,
  mileage:174000,
  power:87,
  condition:"Среднее",
  city:"Казань",
  price:210000,
  seller:"Влад",
  emoji:"🚘"
 },

 {
  id:8,
  name:"Hyundai Solaris",
  year:2015,
  mileage:142000,
  power:123,
  condition:"Хорошее",
  city:"Екатеринбург",
  price:680000,
  seller:"Антон",
  emoji:"🚗"
 },

 {
  id:9,
  name:"Kia Rio",
  year:2016,
  mileage:128000,
  power:123,
  condition:"Хорошее",
  city:"Москва",
  price:720000,
  seller:"Никита",
  emoji:"🚙"
 },

 {
  id:10,
  name:"VAZ 2107",
  year:2007,
  mileage:260000,
  power:75,
  condition:"Плохое",
  city:"Томск",
  price:95000,
  seller:"Виктор",
  emoji:"🚘"
 }

];


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

function openPage(page){

 document.querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 const nav=document.getElementById("nav-"+page);

 if(nav) nav.classList.add("active");

 if(page==="home")renderHome();
 if(page==="market")renderMarket();
 if(page==="garage")renderGarage();
 if(page==="bank")renderBank();
 if(page==="cities")renderCities();
 if(page==="stats")renderStats();
 if(page==="settings")renderSettings();

 updateHeader();

}


/* =====================================================
   ГЛАВНАЯ
===================================================== */

function renderHome(){

 document.getElementById("content").innerHTML=`

 <div class="page">

  <div class="title">Главная</div>

  <div class="subtitle">
   Ваш автомобильный бизнес
  </div>

  <div class="hero">

   <div>

    <div class="hero-label">
     AUTO SELLER
    </div>

    <h1>
     Покупай дешевле.<br>
     Продавай дороже.
    </h1>

    <p>
     Ищи автомобили по низкой цене,
     торгуйся с владельцами,
     ремонтируй и перепродавай их
     с прибылью.
    </p>

   </div>

   <div>

    <div style="color:#89929d;font-size:12px">
     Доступный капитал
    </div>

    <div class="hero-money">
     ${money(game.money)}
    </div>

   </div>

  </div>

  <div class="cards">

   <div class="stat">
    <small>Куплено</small>
    <strong>${game.bought}</strong>
   </div>

   <div class="stat">
    <small>Продано</small>
    <strong>${game.sold}</strong>
   </div>

   <div class="stat">
    <small>Прибыль</small>
    <strong>${money(game.profit)}</strong>
   </div>

   <div class="stat">
    <small>Машин в гараже</small>
    <strong>${game.garage.length}</strong>
   </div>

  </div>

 </div>

 `;

}


/* =====================================================
   АВТОРЫНОК
===================================================== */

function renderMarket(){

 let html=`

 <div class="page">

  <div class="title">
   Авторынок
  </div>

  <div class="subtitle">
   Объявления частных продавцов
  </div>

  <div class="car-grid">
 `;


 cars.forEach(car=>{

  html+=`

  <article class="car-card">

   <div class="car-image">

    <div class="car-city">
     📍 ${car.city}
    </div>

    <div class="car-emoji">
     ${car.emoji}
    </div>

   </div>

   <div class="car-body">

    <div class="car-name">
     ${car.name}
    </div>

    <div class="car-year">
     ${car.year} год · ${car.seller}
    </div>

    <div class="specs">

     <div class="spec">
      Пробег<br>
      <b>${car.mileage.toLocaleString("ru-RU")} км</b>
     </div>

     <div class="spec">
      Мощность<br>
      <b>${car.power} л.с.</b>
     </div>

     <div class="spec">
      Состояние<br>
      <b>${car.condition}</b>
     </div>

     <div class="spec">
      Продавец<br>
      <b>Частник</b>
     </div>

    </div>

    <div class="price-row">

     <div class="price">
      ${money(car.price)}
     </div>

     <div class="seller">
      ${car.seller}

/* =====================================================

===================================================== */

function makeOffer(id,offer){

 const car=cars.find(x=>x.id===id);

 if(!car)return;

 if(offer>=car.price){

  closeModal();

  purchaseCar(car,car.price);

  return;
 }


 const ratio=offer/car.price;


 /*
  95%+:
  продавец почти всегда делает
  небольшую уступку.

  85-95%:
  может принять/ответить.

  75-85%:
  встречное предложение.

  <75%:
  почти всегда отказ.
 */


 if(ratio>=.95){

  const counter=Math.floor(
   (offer+car.price)/2/1000
  )*1000;

  closeModal();

  showCounterOffer(car,offer,counter);

  return;

 }


 if(ratio>=.85){

  if(Math.random()<.75){

   const counter=Math.floor(
    (offer+car.price)/2/1000
   )*1000;

   closeModal();

   showCounterOffer(car,offer,counter);

  }else{

   closeModal();

   toast(
    "Продавец отказался от предложения."
   );

  }

  return;
 }


 if(ratio>=.75){

  const counter=Math.floor(
   (offer+car.price*.9)/2/1000
  )*1000;

  closeModal();

  showCounterOffer(car,offer,counter);

  return;
 }


 closeModal();

 toast(
  "Продавец: «За такие деньги не отдам.»"
 );

}

function secondOffer(id,counter){

 const car=cars.find(x=>x.id===id);

 const offer=Number(
  document.getElementById("tradeInput2").value
 );

 if(!Number.isFinite(offer)||
    offer<=0||
    offer>MAX_MONEY){

 if(offer>=counter){

  acceptOffer(id,counter);

  return;

 const ratio=offer/counter;


 if(ratio>=.96){

  purchaseCar(car,offer);

  return;
 }


 if(ratio>=.90){

  const newCounter=Math.floor(
   (offer+counter)/2/1000
  )*1000;

   car,
   offer,
   newCounter
  );

 }

 toast(
