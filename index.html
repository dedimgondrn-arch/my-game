<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 select-none antialiased">
  <div id="root" class="w-full max-w-xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SOUND SYNTHESIS ENGINE (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      playClick() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playCash() {
        if (this.muted) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const time = this.ctx.currentTime + idx * 0.05;
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.15, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(time);
          osc.stop(time + 0.12);
        });
      }
      playHorn() {
        if (this.muted) return;
        this.init();
        [440, 554.37].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        });
      }
      playGavel() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
    }
    const sound = new SoundEngine();

    // --- CAR TEMPLATES & CATALOG ---
    const CAR_TEMPLATES = [
      {

        year: 2011,

      {

      }

    const DEFECTS_DATABASE = [
      { id: 'paint_hood', name: 'Капот в шпатлёвке (вторичный окрас)', type: 'paint', discDiscount: 25000, repairCost: 14000, discovered: false },
      { id: 'paint_door', name: 'Дверь водителя крашена (слой 380 мкм)', type: 'paint', discDiscount: 18000, repairCost: 10000, discovered: false },

    const TUNING_OPTIONS = [
      { id: 'torus_wheels', name: 'Диски «Торусы R16»', category: 'wheels', cost: 32000, valueBoost: 55000, installed: false, desc: 'Легендарные катки для суеты. Студенты и пацаны с района в восторге!' },
      { id: 'tint_bunker', name: 'Тонировка «Вкруг 5% Бункер»', category: 'tint', cost: 9000, valueBoost: 18000, installed: false, desc: 'Глухой бункер. Скрывает салон от лишних глаз.' },
      { id: 'lowering_springs', name: 'Занижение -70 мм (Короткоходки)', category: 'suspension', cost: 18000, valueBoost: 28000, installed: false, desc: 'Вид имеет! Чёткая посадка по заветам стиля.' },
      { id: 'stinger_exhaust', name: 'Прямоток Stinger Sport 4-2-1', category: 'exhaust', cost: 24000, valueBoost: 38000, installed: false, desc: 'Басистый спортивный звук с приятными отстрелами.' },
      { id: 'stage1_chip', name: 'Чип-Тюнинг Stage 1 + Попкорн', category: 'stage', cost: 15000, valueBoost: 26000, installed: false, desc: 'Отзывчивая педаль газа и лёгкий прирост мощности.' },
      { id: 'pride_sub', name: 'Автозвук Pride 15" + Усилитель', category: 'audio', cost: 45000, valueBoost: 70000, installed: false, desc: 'Шевелит лобовое стекло и привлекает молодёжь.' },
      { id: 'detailing_polish', name: 'Глубокая полировка + Керамика', category: 'body', cost: 16000, valueBoost: 30000, installed: false, desc: 'Зеркальный блеск кузова, ускоряет продажу в 2 раза.' }
    ];

    function generateCar(cityId = 'msk') {
      const template = CAR_TEMPLATES[Math.floor(Math.random() * CAR_TEMPLATES.length)];
      const numDefects = Math.floor(Math.random() * 3) + 1;
      const defects = [];
      const shuffledDefects = [...DEFECTS_DATABASE].sort(() => 0.5 - Math.random());
      for (let i = 0; i < numDefects; i++) {
        defects.push({ ...shuffledDefects[i] });
      }

      const sellerPersonalities = ['greedy', 'urgent', 'naive', 'crafty'];
      const personality = sellerPersonalities[Math.floor(Math.random() * sellerPersonalities.length)];
      const names = ['Руслан', 'Михаил Сергеевич', 'Денис', 'Василий', 'Артур', 'Владлен'];

      const mileageReal = Math.floor(Math.random() * 120000) + 70000;
      const isRolled = Math.random() > 0.5;
      const mileageShown = isRolled ? Math.max(45000, mileageReal - (Math.floor(Math.random() * 60000) + 30000)) : mileageReal;

      const randomDiscountFactor = personality === 'urgent' ? 0.88 : (personality === 'greedy' ? 1.08 : 1.0);
      const askingPrice = Math.round((template.basePrice * randomDiscountFactor) / 5000) * 5000;

      return {
        id: 'car_' + Math.random().toString(36).substr(2, 9),
        model: template.model,
        year: template.year,
        tier: template.tier,
        engine: template.engine,
        transmission: template.transmission,
        drive: template.drive,
        image: template.image,
        baseMarketPrice: template.basePrice,
        askingPrice: askingPrice,
        purchasePrice: null,
        myListingPrice: null,
        investedCost: 0,
        cityId: cityId,
        seller: {
          name: names[Math.floor(Math.random() * names.length)],
          personality: personality,
          patience: 100,
          minPriceLimit: Math.round(askingPrice * (personality === 'urgent' ? 0.78 : (personality === 'greedy' ? 0.94 : 0.85)) / 5000) * 5000
        },
        mileage: {
          shown: mileageShown,
          real: mileageReal,
          isRolled: isRolled
        },
        bodyParts: {
          hood: { paintThickness: defects.some(d => d.id === 'paint_hood') ? 480 : 120, hasBondo: defects.some(d => d.id === 'paint_hood'), inspected: false },
          roof: { paintThickness: 110, hasBondo: false, inspected: false },
          doorFL: { paintThickness: defects.some(d => d.id === 'paint_door') ? 380 : 115, hasBondo: false, inspected: false },
          doorFR: { paintThickness: 125, hasBondo: false, inspected: false },
          fenderFL: { paintThickness: 130, hasBondo: false, inspected: false },
          fenderFR: { paintThickness: 120, hasBondo: false, inspected: false }
        },
        defects: defects,
        tuning: TUNING_OPTIONS.map(t => ({ ...t })),
        overallCondition: Math.max(30, 95 - defects.length * 15),
        testDrived: false,
        obdScanned: false,
        autotekaChecked: false,
        isForSale: false,
        isOwned: false
      };
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [cash, setCash] = useState(() => {
        const saved = localStorage.getItem('sim_cash');
        return saved ? Number(saved) : 350000;
      });
      const [bankDeposit, setBankDeposit] = useState(0);
      const [day, setDay] = useState(1);
      const [activeApp, setActiveApp] = useState('market'); // market | garage | chat | auction | bank
      const [marketCars, setMarketCars] = useState(() => [generateCar(), generateCar(), generateCar(), generateCar()]);
      const [garageCars, setGarageCars] = useState([]);
      const [buyerLeads, setBuyerLeads] = useState([]);
      const [activeAuction, setActiveAuction] = useState(null);
      const [isMuted, setIsMuted] = useState(false);

      // Active Modals
      const [inspectingCar, setInspectingCar] = useState(null);
      const [testDrivingCar, setTestDrivingCar] = useState(null);
      const [bargainingCar, setBargainingCar] = useState(null);
      const [tuningCar, setTuningCar] = useState(null);
      const [sellingCar, setSellingCar] = useState(null);

      useEffect(() => {
        localStorage.setItem('sim_cash', cash.toString());
      }, [cash]);

      // ADVANCE NEXT DAY
      const handleNextDay = () => {
        sound.playClick();
        sound.playCash();
        const nextDay = day + 1;
        setDay(nextDay);

        const interest = Math.round(bankDeposit * 0.01);
        setBankDeposit(prev => prev + interest);

        const rent = 2500;
        setCash(prev => prev - rent);

        const forSale = garageCars.filter(c => c.isForSale);
        if (forSale.length > 0 && Math.random() > 0.25) {
          const target = forSale[Math.floor(Math.random() * forSale.length)];
          const tuningBoost = target.tuning.filter(t => t.installed).reduce((s, t) => s + t.valueBoost, 0);
          const isPriora = target.model.includes('Priora');
          const hasTorus = target.tuning.find(t => t.id === 'torus_wheels')?.installed;
          
          let buyerName = 'Артём (Студент)';
          let buyerMsg = `Салам! Заберу ${target.model}. Сколько окончательно скинешь?`;
          let offerRatio = 0.9;

          if (isPriora && hasTorus) {
            buyerName = 'Мага «Борода»';
            buyerMsg = `Вах, на Торусах и в бункере — чисто яд! Забираю прямо сегодня без лишних слов!`;
            offerRatio = 1.05;
          }

          const estValue = (target.myListingPrice || target.baseMarketPrice) + tuningBoost;
          const offer = Math.round((estValue * offerRatio) / 5000) * 5000;

          const lead = {
            id: 'lead_' + Date.now(),
            carId: target.id,
            carModel: target.model,
            buyerName: buyerName,
            message: buyerMsg,
            offerPrice: offer,
            askingPrice: target.myListingPrice || estValue
          };

          setBuyerLeads(prev => [lead, ...prev]);
        }

        setMarketCars(prev => [generateCar(), ...prev.slice(0, 4)]);
      };

      const handleBuyCar = (car, finalPrice) => {
        if (garageCars.length >= 4) {
          alert('Гараж заполнен (макс 4 авто)! Продайте машину, чтобы освободить место.');
          return;
        }
        sound.playCash();
        setCash(prev => prev - finalPrice);
        const bought = {
          ...car,
          isOwned: true,
          purchasePrice: finalPrice,
          investedCost: 0,
          isForSale: false
        };
        setGarageCars(prev => [...prev, bought]);
        setMarketCars(prev => prev.filter(c => c.id !== car.id));
        setBargainingCar(null);
        setActiveApp('garage');
      };

      const handleSellLead = (lead) => {
        const car = garageCars.find(c => c.id === lead.carId);
        if (!car) return;
        sound.playCash();
        setCash(prev => prev + lead.offerPrice);
        setGarageCars(prev => prev.filter(c => c.id !== car.id));
        setBuyerLeads(prev => prev.filter(l => l.id !== lead.id));
        alert(`🎉 Успешно! ${car.model} продана за ${lead.offerPrice.toLocaleString()} ₽!`);
      };

      const handleRepair = (car, defect) => {
        if (cash < defect.repairCost) {
          alert('Недостаточно средств на ремонт!');
          return;
        }
        sound.playClick();
        setCash(prev => prev - defect.repairCost);
        setGarageCars(prev => prev.map(c => {
          if (c.id === car.id) {
            return {
              ...c,
              investedCost: c.investedCost + defect.repairCost,
              defects: c.defects.filter(d => d.id !== defect.id),
              overallCondition: Math.min(100, c.overallCondition + 15)
            };
          }
          return c;
        }));
      };

      return (
        <div className="w-full bg-slate-900 border-2 border-slate-700/80 rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden relative h-[95vh] max-h-[920px]">
          
          {/* Status Bar */}
          <div className="bg-slate-950 px-5 pt-3 pb-2 flex items-center justify-between border-b border-slate-800 text-[11px] text-slate-400 shrink-0">
            <div className="flex items-center space-x-2 font-bold font-mono text-white">
              <span>12:40</span>
              <span className="text-amber-400">День {day}</span>
            </div>

            <div className="w-20 h-3 bg-slate-900 rounded-full border border-slate-800 flex items-center justify-center">
              <div className="w-6 h-1 bg-slate-700 rounded-full" />
            </div>

            <button 
              onClick={() => setIsMuted(sound.toggleMute())} 
              className="text-slate-400 hover:text-amber-400 font-mono text-[10px]"
            >
              {isMuted ? '🔇 Звук ВЫКЛ' : '🔊 Звук ВКЛ'}
            </button>
          </div>

          {/* Balance Header */}
          <div className="bg-slate-950/90 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between shrink-0">
            <div>
              <span className="text-[9px] text-slate-500 uppercase font-bold block">Баланс:</span>
              <span className="text-sm font-black font-mono text-amber-400">
                {cash.toLocaleString()} ₽
              </span>
            </div>

            <button
              onClick={handleNextDay}
              className="py-1 px-3 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition-all shadow-md shadow-amber-500/20"
            >
              След. день ▶
            </button>
          </div>

          {/* Screen Content */}
          <div className="flex-1 overflow-y-auto p-3 space-y-4">
            
            {/* APP 1: MARKET */}
            {activeApp === 'market' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-black font-display uppercase tracking-wider text-slate-200">
                    🚗 Авторынок (Доступно: {marketCars.length})
                  </h2>
                  <button 
                    onClick={() => {
                      sound.playClick();
                      setMarketCars([generateCar(), generateCar(), generateCar(), generateCar()]);
                    }}
                    className="text-[11px] text-amber-400 hover:underline font-bold"
                  >
                    🔄 Обновить
                  </button>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {marketCars.map(car => (
                    <div key={car.id} className="bg-slate-950/80 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition-all p-3 space-y-2">
                      <div className="flex items-start space-x-3">
                        <img src={car.image} alt={car.model} className="w-24 h-18 object-cover rounded-xl border border-slate-800 shrink-0" />
                        <div className="flex-1 min-w-0">
                          <h3 className="text-xs font-bold text-white truncate">{car.model}</h3>
                          <div className="text-[10px] text-slate-400">{car.year} г. • {car.engine}</div>
                          <div className="text-[10px] text-slate-400">Пробег: <span className="text-slate-200 font-mono">{car.mileage.shown.toLocaleString()} км</span></div>
                          <div className="text-xs font-black font-mono text-emerald-400 mt-1">
                            {car.askingPrice.toLocaleString()} ₽
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center space-x-1.5 pt-1 border-t border-slate-900">
                        <button
                          onClick={() => { sound.playClick(); setInspectingCar(car); }}
                          className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-200 rounded-lg text-center"
                        >
                          🔍 Осмотр / ЛКП
                        </button>
                        <button
                          onClick={() => { sound.playClick(); setTestDrivingCar(car); }}
                          className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-200 rounded-lg text-center"
                        >
                          ⏱️ Тест-Драйв
                        </button>
                        <button
                          onClick={() => { sound.playClick(); setBargainingCar(car); }}
                          className="flex-1 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-[10px] font-black rounded-lg text-center shadow-md shadow-amber-500/20"
                        >
                          💬 Торг / Купить
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* APP 2: GARAGE */}
            {activeApp === 'garage' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-black font-display uppercase tracking-wider text-slate-200">
                    🏠 Мой Гараж ({garageCars.length} / 4 авто)
                  </h2>
                </div>

                {garageCars.length === 0 ? (
                  <div className="text-center py-12 bg-slate-950/40 rounded-2xl border border-dashed border-slate-800 p-6 space-y-3">
                    <div className="text-3xl">🚗💨</div>
                    <div className="text-xs text-slate-400">Гараж пуст. Купите первый автомобиль на Авторынке!</div>
                    <button

              </button>
            </div>
          )}

          {/* SELL LISTING MODAL */}
          {sellingCar && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-sm z-50 p-4 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <h3 className="text-xs font-black font-display text-white">📢 Выставить: {sellingCar.model}</h3>
                  <button onClick={() => setSellingCar(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>

                <div className="space-y-3 mt-4 text-xs">
                  <div>
                    <label className="text-slate-400 text-[10px] block mb-1">Укажите цену продажи (₽):</label>
                    <input
                      type="number"
                      defaultValue={Math.round(((sellingCar.purchasePrice || sellingCar.baseMarketPrice) + sellingCar.investedCost) * 1.25 / 5000) * 5000}
                      id="sellPriceInput"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold text-sm outline-none"
                    />
                  </div>
                </div>
              </div>

              <button
                onClick={() => {
                  const inputVal = Number(document.getElementById('sellPriceInput').value);
                  if (!inputVal || inputVal <= 0) return;
                  sound.playClick();
                  setGarageCars(prev => prev.map(c => c.id === sellingCar.id ? { ...c, isForSale: true, myListingPrice: inputVal } : c));
                  setSellingCar(null);
                  alert(`✅ Объявление опубликовано! Ожидайте сообщений в Чате.`);
                }}
                className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase"
              >
                Опубликовать
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
