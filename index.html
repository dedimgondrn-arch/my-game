
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone OS: P2P Ecosystem</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --purple: #a855f7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        /* Корпус смартфона */
        .phone {
            width: 380px; height: 750px; background: #000;
            border: 12px solid #1e293b; border-radius: 40px;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        }

        .notch { width: 140px; height: 25px; background: #1e293b; position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 15px 15px; z-index: 100; }
        
        .status-bar { height: 35px; background: #000; padding: 10px 20px 0; display: flex; justify-content: space-between; font-size: 0.75rem; color: #fff; z-index: 90; }

        /* Рабочий стол OS */
        .desktop {
            flex: 1; background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
            padding: 50px 20px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-content: start;
        }

        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
        }
        .icon-box {
            width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        .app-icon:active .icon-box { transform: scale(0.9); }
        .app-label { font-size: 0.75rem; color: #fff; text-align: center; }

        /* Окна приложений */
        .app-window {
            position: absolute; top: 35px; left: 0; width: 100%; height: calc(100% - 35px);
            background: var(--bg-color); display: none; flex-direction: column; z-index: 80;
        }
        .app-window.active { display: flex; }

        .app-header { background: var(--card-bg); padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .app-content { flex: 1; padding: 12px; overflow-y: auto; }

        /* Элементы приложений */
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
        .btn { padding: 6px 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-warning { background: var(--yellow); color: black; }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }

        /* Навигация смарта */
        .home-bar { height: 25px; background: #000; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 90; }
        .home-indicator { width: 120px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.6; }

        /* Чат торга */
        .chat-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; padding: 15px; z-index: 120; }
        .chat-modal.active { display: flex; }
        .chat-box { background: var(--card-bg); border-radius: 12px; padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .chat-history { flex: 1; background: #0f172a; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .msg { padding: 8px; border-radius: 6px; font-size: 0.8rem; max-width: 85%; }
        .msg-them { background: #334155; align-self: flex-start; }
        .msg-me { background: var(--accent); align-self: flex-end; }
    </style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
        <span>09:41</span>
        <span>5G 🔋 100%</span>
    </div>

    <!-- РАБОЧИЙ СТОЛ СМАРТФОНА -->
    <div class="desktop">
        <div class="app-icon" onclick="openApp('app-resell')">
            <div class="icon-box" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">🛍️</div>
            <span class="app-label">P2P Resell</span>
        </div>
        <div class="app-icon" onclick="openApp('app-crypto')">
            <div class="icon-box" style="background: linear-gradient(135deg, #22c55e, #15803d);">💎</div>
            <span class="app-label">Crypto Ex</span>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ 1: P2P RESELL -->
    <div class="app-window" id="app-resell">
        <div class="app-header">
            <span style="font-weight:bold;">P2P Market</span>
            <span style="color:var(--green); font-weight:bold;" id="balance-resell">1 000 ₽</span>
        </div>
        <div class="app-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:0.8rem; color:var(--text-muted);">Лента лотов:</span>
                <button class="btn btn-primary" onclick="generateMarket()">Обновить</button>
            </div>
            <div id="market-list"></div>
            
            <hr style="border-color:var(--border); margin:15px 0;">
            <div style="font-weight:bold; margin-bottom:10px;">🎒 Мои Лоты (Инвентарь)</div>
            <div id="inventory-list"></div>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ 2: CRYPTO EXCHANGE -->
    <div class="app-window" id="app-crypto">
        <div class="app-header">
            <span style="font-weight:bold;">P2P Криптобиржа</span>
            <span style="color:var(--yellow);" id="usdt-balance">0 USDT</span>
        </div>
        <div class="app-content">
            <div class="item-card">
                <div style="font-size:0.8rem; color:var(--text-muted);">Курс USDT/RUB:</div>
                <div style="font-size:1.5rem; font-weight:bold; color:var(--green);" id="usdt-rate">92.50 ₽</div>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-success" style="flex:1;" onclick="tradeCrypto('buy')">Купить 10 USDT</button>
                <button class="btn btn-danger" style="flex:1;" onclick="tradeCrypto('sell')">Продать 10 USDT</button>
            </div>
        </div>
    </div>

    <!-- ЧАТ ТОРГА (Модальное окно) -->
    <div class="chat-modal" id="chat-modal">
        <div class="chat-box">
            <div style="font-weight:bold; margin-bottom:8px;" id="chat-title">Чат с продавцом</div>
            <div class="chat-history" id="chat-history"></div>
            <div style="display:flex; gap:6px;">
                <button class="btn btn-warning" style="flex:1;" onclick="haggle('discount')">Сбить 15%</button>
                <button class="btn btn-success" style="flex:1;" onclick="haggle('buy')">Забрать</button>
                <button class="btn btn-danger" onclick="closeChat()">X</button>
            </div>
        </div>
    </div>

    <div class="home-bar" onclick="closeApps()">
        <div class="home-indicator"></div>
    </div>
</div>

<script>
    let state = {
        balance: 1000,
        usdt: 0,
        usdtRate: 92.50,
        inventory: [],
        activeHaggle: null
    };

    const itemTemplates = [
        { title: 'Brawl Stars | 28k кубков', category: 'Brawl Stars', min: 300, max: 600, real: 900 },
        { title: 'Ключ Minecraft Java', category: 'Ключи', min: 200, max: 400, real: 650 },
        { title: 'PSN Turkey | FC 24', category: 'PSN', min: 1000, max: 1700, real: 2700 }
    ];

    function openApp(id) {
        document.querySelectorAll('.app-window').forEach(app => app.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function closeApps() {
        document.querySelectorAll('.app-window').forEach(app => app.classList.remove('active'));
    }

    function updateUI() {
        document.getElementById('balance-resell').innerText = state.balance.toLocaleString() + ' ₽';
        document.getElementById('usdt-balance').innerText = state.usdt.toFixed(1) + ' USDT';
        renderInventory();
    }

    /* --- РЫНОК И ТОРГ --- */
    function generateMarket() {
        const list = document.getElementById('market-list');
        list.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            const t = itemTemplates[Math.floor(Math.random() * itemTemplates.length)];
            const price = Math.floor(Math.random() * (t.max - t.min + 1)) + t.min;
            const item = { id: Date.now() + i, title: t.title, price, realValue: t.real };

            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div style="font-weight:bold; font-size:0.85rem;">${item.title}</div>
                <div style="font-size:0.9rem; margin:4px 0;"><b>${item.price} ₽</b> <span style="font-size:0.7rem; color:var(--text-muted);">(Рынок: ~${item.realValue} ₽)</span></div>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-primary" style="flex:1;" onclick="buyItem(${item.price}, '${item.title}', ${item.realValue})">Купить</button>
                    <button class="btn btn-warning" style="flex:1;" onclick="openChat('${item.title}', ${item.price}, ${item.realValue})">💬 Торг</button>
                </div>
            `;
            list.appendChild(card);
        }
    }

    function openChat(title, price, realValue) {
        state.activeHaggle = { title, price, realValue };
        document.getElementById('chat-title').innerText = `Торг: ${title}`;
        document.getElementById('chat-history').innerHTML = `<div class="msg msg-them">Привет! Отдаю за ${price} ₽. Твоя цена?</div>`;
        document.getElementById('chat-modal').classList.add('active');
    }

    function closeChat() { document.getElementById('chat-modal').classList.remove('active'); }

    function haggle(action) {
        const h = state.activeHaggle;
        const history = document.getElementById('chat-history');

        if (action === 'discount') {
            const newPrice = Math.floor(h.price * 0.85);
            history.innerHTML += `<div class="msg msg-me">Скинь до ${newPrice} ₽, забрал прямо сейчас.</div>`;
            if (Math.random() > 0.3) {
                history.innerHTML += `<div class="msg msg-them">По рукам! Забирай за ${newPrice} ₽.</div>`;
                h.price = newPrice;
            } else {
                history.innerHTML += `<div class="msg msg-them">Не, это слишком дёшево.</div>`;
            }
        } else if (action === 'buy') {
            buyItem(h.price, h.title, h.realValue);
            closeChat();
        }
    }

    function buyItem(price, title, realValue) {
        if (state.balance < price) return alert('❌ Недостаточно средств!');
        state.balance -= price;
        state.inventory.push({ title, buyPrice: price, realValue, sellPrice: Math.floor(realValue * 1.1) });
        updateUI();
        generateMarket();
    }

    function renderInventory() {
        const inv = document.getElementById('inventory-list');
        inv.innerHTML = '';
        state.inventory.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div style="font-weight:bold; font-size:0.85rem;">${item.title}</div>
                <div style="display:flex; gap:6px; margin-top:6px; align-items:center;">
                    <input type="number" id="sell-price-${index}" value="${item.sellPrice}" style="width:70px; padding:4px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:4px;">
                    <button class="btn btn-success" style="flex:1;" onclick="sellItem(${index})">Выставить</button>
                </div>
            `;
            inv.appendChild(card);
        });
    }

    function sellItem(index) {
        const item = state.inventory[index];
        const setPrice = parseInt(document.getElementById(`sell-price-${index}`).value);
        if (Math.random() < 0.7) {
            state.balance += setPrice;
            alert(`💰 Продано за ${setPrice} ₽!`);
            state.inventory.splice(index, 1);
            updateUI();
        } else {
            alert('⏳ Цена слишком высока, пока нет покупателей.');
        }
    }

    /* --- КРИПТОБИРЖА --- */
    function tradeCrypto(type) {
        const cost = state.usdtRate * 10;
        if (type === 'buy') {
            if (state.balance < cost) return alert('❌ Недостаточно рублей!');
            state.balance -= cost;
            state.usdt += 10;
        } else {
            if (state.usdt < 10) return alert('❌ Недостаточно USDT!');
            state.usdt -= 10;
            state.balance += cost;
        }
        updateUI();
    }

    generateMarket();
    updateUI();
</script>
</body>
</html>
