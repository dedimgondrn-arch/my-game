<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P RESELLER: Симулятор Перекупа</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app {
            width: 100%;
            max-width: 480px;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }

        /* Шапка с балансом и профилем */
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .stats {
            text-align: right;
        }

        .balance {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--green);
        }

        .rating {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Навигация */
        .nav {
            display: flex;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Контентная область */
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Карточки товаров */
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #334155;
            color: #cbd5e1;
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
        }

        .item-seller {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        /* Кнопки */
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }

        /* Лог событий */
        .log-item {
            font-size: 0.8rem;
            padding: 8px;
            background: var(--card-bg);
            border-left: 3px solid var(--accent);
            margin-bottom: 8px;
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Шапка -->
    <div class="header">
        <div class="user-info">
            <div class="avatar">SS</div>
            <div>
                <div style="font-weight: bold; font-size: 0.9rem;">SSSTY1 (Перекуп)</div>
                <div class="rating">⭐ 5.0 (0 отзывов)</div>
            </div>
        </div>
        <div class="stats">
            <div class="balance" id="balance">1 000 ₽</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Баланс</div>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('market')">🛒 Рынок</button>
        <button class="nav-btn" onclick="switchTab('inventory')">🎒 Мои Лоты</button>
        <button class="nav-btn" onclick="switchTab('logs')">🔔 Уведомления</button>
    </div>

    <!-- Контент -->
    <div class="content">
        <!-- Секция: Рынок -->
        <div id="market" class="section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-size: 0.85rem; color: var(--text-muted);">Лента предложений:</span>
                <button class="btn btn-primary" style="flex: none; padding: 4px 10px; font-size: 0.75rem;" onclick="generateMarketItem()">Обновить рынок</button>
            </div>
            <div id="market-list"></div>
        </div>

        <!-- Секция: Инвентарь -->
        <div id="inventory" class="section">
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Купленные товары на перепродажу:</div>
            <div id="inventory-list"></div>
        </div>

        <!-- Секция: Уведомления -->
        <div id="logs" class="section">
            <div id="log-list">
                <div class="log-item">🚀 Добро пожаловать на биржу! Покупай дешевле, продавай дороже.</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Игровое состояние
    let state = {
        balance: 1000,
        rating: 5.0,
        reviews: 0,
        inventory: [],
        logs: []
    };

    // База категорий и товаров для генерации
    const categories = ['PSN Турция', 'Steam Аккаунты', 'Brawl Stars', 'Ключи Игр'];
    
    const itemTemplates = [
        { title: 'PSN Turkey | FC 24 + GTA V', category: 'PSN Турция', minPrice: 400, maxPrice: 900, realValue: 1200 },
        { title: 'Steam | CS2 Prime (1,200 hrs)', category: 'Steam Аккаунты', minPrice: 800, maxPrice: 1500, realValue: 2100 },
        { title: 'Brawl Stars | 28к кубков + 45 скин', category: 'Brawl Stars', minPrice: 300, maxPrice: 700, realValue: 1000 },
        { title: 'Ключ Minecraft Java + Bedrock', category: 'Ключи Игр', minPrice: 200, maxPrice: 500, realValue: 750 }
    ];

    const fakeSellers = ['NoobMaster', 'FastSell_99', 'Gamer77', 'ProTrader', 'DarkSeller'];

    // Переключение вкладок
    function switchTab(tabId) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // Обновление UI
    function updateUI() {
        document.getElementById('balance').innerText = state.balance.toLocaleString() + ' ₽';
        renderInventory();
    }

    function addLog(msg) {
        const logList = document.getElementById('log-list');
        const log = document.createElement('div');
        log.className = 'log-item';
        log.innerText = msg;
        logList.prepend(log);
    }

    // Генерация случайного лота на рынке
    function generateMarketItem() {
        const marketList = document.getElementById('market-list');
        marketList.innerHTML = '';

        for (let i = 0; i < 3; i++) {
            const template = itemTemplates[Math.floor(Math.random() * itemTemplates.length)];
            const seller = fakeSellers[Math.floor(Math.random() * fakeSellers.length)];
            
            // Расчет случайной цены (бывают оверпрайс и сочные сливы)
            const price = Math.floor(Math.random() * (template.maxPrice - template.minPrice + 1)) + template.minPrice;
            const item = {
                id: Date.now() + i,
                title: template.title,
                category: template.category,
                price: price,
                realValue: template.realValue,
                seller: seller
            };

            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-header">
                    <span class="item-title">${item.title}</span>
                    <span class="item-badge">${item.category}</span>
                </div>
                <div class="item-seller">Продавец: ${item.seller}</div>
                <div class="item-price">${item.price.toLocaleString()} ₽</div>
                <div class="item-actions">
                    <button class="btn btn-primary" onclick="buyItem(${item.id}, '${item.title}', ${item.price}, ${item.realValue})">Купить</button>
                </div>
            `;
            marketList.appendChild(card);
        }
    }

    // Покупка товара
    function buyItem(id, title, price, realValue) {
        if (state.balance < price) {
            alert('❌ Недостаточно средств на балансе!');
            return;
        }

        state.balance -= price;
        state.inventory.push({
            id: Date.now(),
            title: title,
            buyPrice: price,
            realValue: realValue,
            sellPrice: Math.floor(realValue * 1.1) // Дефолтная цена наценки
        });

        addLog(`🛍️ Вы купили "${title}" за ${price} ₽`);
        updateUI();
        generateMarketItem();
    }

    // Рендер инвентаря
    function renderInventory() {
        const invList = document.getElementById('inventory-list');
        invList.innerHTML = '';

        if (state.inventory.length === 0) {
            invList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">Инвентарь пуст. Купите товары на рынке!</div>';
            return;
        }

        state.inventory.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-header">
                    <span class="item-title">${item.title}</span>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">Куплено за: ${item.buyPrice} ₽ | Рыночная стоимость: ~${item.realValue} ₽</div>
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                    <label style="font-size: 0.8rem;">Ваша цена:</label>
                    <input type="number" id="price-input-${index}" value="${item.sellPrice}" style="width: 100px; padding: 4px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 4px;">
                    <button class="btn btn-success" onclick="sellItem(${index})">Выставить</button>
                </div>
            `;
            invList.appendChild(card);
        });
    }

    // Продажа товара (Симуляция ИИ-покупателя)
    function sellItem(index) {
        const item = state.inventory[index];
        const inputPrice = parseInt(document.getElementById(`price-input-${index}`).value);

        if (!inputPrice || inputPrice <= 0) {
            alert('Введите корректную цену!');
            return;
        }

        // Логика согласия ИИ-покупателя
        // Чем выше цена от realValue, тем ниже шанс быстро выкупить
        const ratio = inputPrice / item.realValue;
        let chance = 0.8; // Шанс при адекватной цене

        if (ratio > 1.3) chance = 0.2; // Сильный оверпрайс
        if (ratio > 1.6) chance = 0.05;

        if (Math.random() < chance) {
            state.balance += inputPrice;
            const profit = inputPrice - item.buyPrice;
            addLog(`💰 ТОВАР ПРОДАН! "${item.title}" за ${inputPrice} ₽ (Профит: +${profit} ₽)`);
            state.inventory.splice(index, 1);
            updateUI();
        } else {
            addLog(`⏳ Покупатели считают цену ${inputPrice} ₽ за "${item.title}" слишком высокой. Снизьте цену или подождите.`);
        }
    }

    // Старт
    generateMarketItem();
    updateUI();
</script>
</body>
</html>
