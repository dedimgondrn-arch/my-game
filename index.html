.gr{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,122,0,0.08) 1px,transparent 1.3px);background-size:28px 28px;opacity:.4}

button,input,textarea,select{font:inherit;color:inherit}
button,.bt{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-weight:700;background:#16161e;color:#fff;transition:transform .15s,border-color .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:var(--a)}button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:not-allowed}

.orange-btn{background:linear-gradient(135deg,#ff7a00 0%,#ff9500 100%)!important;color:#fff!important;border:none!important;box-shadow:0 0 18px rgba(255,122,0,0.35)}
.gh{background:#16161e!important;border:1px solid var(--line)!important;color:#fff!important}
.gh.on{border-color:var(--a)!important;background:rgba(255,122,0,0.08)!important;color:var(--a)!important}
.dg{background:rgba(255,69,58,0.12)!important;border-color:rgba(255,69,58,0.3)!important;color:var(--dg)!important}
.sm{padding:6px 12px;font-size:13px;border-radius:10px}.w{width:100%}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,textarea,select{width:100%;background:#16161e;border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:#fff;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,122,0,0.2)}
select option{background:#16161e}textarea{resize:vertical}
label.l{display:block;color:var(--mu);font-size:13px;font-weight:600;margin:12px 0 5px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

header{position:sticky;top:0;z-index:30;padding:12px 16px;background:rgba(11,11,14,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-b:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mk{width:42px;height:42px;flex:none;border-radius:99px;display:grid;place-items:center;font:800 20px var(--d);color:var(--a);background:#0b0b0e;border:2px solid var(--a);box-shadow:0 0 16px rgba(255,122,0,0.3);cursor:pointer}
.br-box{flex:1;min-width:0}.br-name{font-weight:800;font-size:15px;line-height:1.1}.br-sub{font-size:11px;color:var(--mu)}

.sr{position:relative;margin:10px 16px 4px}
.sr input{border-radius:16px;padding:12px 14px 12px 42px;background:#16161e;border:1px solid var(--line);font-size:14px}
.sr i.fa-search{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:15px}

.ntf-box{position:relative;flex:none}
.ntf-pop{position:absolute;right:0;top:calc(100% + 10px);background:#16161e;border:1px solid var(--line);border-radius:18px;padding:12px;display:none;min-width:260px;box-shadow:0 10px 40px rgba(0,0,0,0.8);z-index:40}.ntf-pop.o{display:block}

main{max-width:768px;margin:auto;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}

/* Promo Banner (со скриншота) */
.promo-banner{position:relative;border-radius:20px;overflow:hidden;margin:16px 0;padding:20px;border:1px solid var(--line);background:linear-gradient(135deg, #1c0f08 0%, #0e0e14 100%)}
.promo-title{font-size:22px;font-weight:900;line-height:1.1;margin:4px 0 8px;color:#fff}
.promo-sub{color:var(--mu);font-size:12px;margin-bottom:14px}
.promo-bag{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:120px;height:120px;display:grid;place-items:center}
.promo-bag-ic{width:80px;height:80px;background:linear-gradient(135deg,#ff7a00,#ff9500);border-radius:20px;transform:rotate(12deg);display:grid;place-items:center;font:900 42px var(--d);color:#000;box-shadow:0 0 30px rgba(255,122,0,0.4)}

/* Horizontal Categories Grid */
.cat-scroll{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.cat-item{flex:0 0 100px;height:90px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px;text-align:center;transition:all .2s}
.cat-item i{font-size:22px;color:var(--mu)}
.cat-item span{font-size:11px;font-weight:600;line-height:1.2;color:var(--tx)}
.cat-item.on{border:1.5px solid var(--a);background:rgba(255,122,0,0.06)}
.cat-item.on i{color:var(--a)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.chips button{white-space:nowrap;flex:none}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}.bar h2{font:700 18px var(--f);margin:0;flex:1}

.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3, 1fr)}}

.card{position:relative;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,border-color .2s}
.card:hover{border-color:rgba(255,122,0,0.4);transform:translateY(-2px)}
.im{aspect-ratio:1;border-radius:14px;background:#0b0b0e;display:grid;place-items:center;font-size:42px;overflow:hidden;position:relative}
.im img{width:100%;height:100%;object-fit:cover}
.cb{padding:8px 4px 4px;display:flex;flex-direction:column;gap:2px}
.ct{font-size:11px;color:var(--a);font-weight:700}
.nm{font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.pr{font:800 16px var(--f);color:var(--a);display:flex;align-items:center;gap:6px;margin-top:6px}
.old-pr{font-size:12px;color:var(--mu);text-decoration:line-through}
.disc-badge{background:var(--a);color:#000;font:800 10px var(--f);padding:1px 5px;border-radius:4px}
.tg{position:absolute;top:8px;left:8px;z-index:2;background:linear-gradient(90deg,var(--a),var(--b));color:#000;font:800 10px var(--f);padding:3px 8px;border-radius:6px}
.hr{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;padding:0;border-radius:99px;background:rgba(0,0,0,0.5)!important;border:0;backdrop-filter:blur(4px);font-size:13px;color:#fff}

/* Perks Footer Box */
.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.pk-item{display:flex;align-items:center;gap:10px;padding:6px}
.pk-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,122,0,0.1);display:grid;place-items:center;color:var(--a);font-size:16px}
.pk-tx b{display:block;font-size:12px}.pk-tx span{font-size:10px;color:var(--mu)}

.emp{text-align:center;color:var(--mu);padding:40px 10px;border:1px dashed var(--line);border-radius:18px}
.pan{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}

/* Nav Bar (со скриншота) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,11,14,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-t:1px solid var(--line)}
nav button{position:relative;flex:1;flex-direction:column;gap:2px;padding:4px 0;font-size:10px;border:0;background:none;box-shadow:none;color:var(--mu);font-weight:600}
nav button i{font-size:18px}
nav button.on{color:var(--a)}
nav button.sl{flex:none;width:52px;height:52px;margin:-22px 6px 0;border-radius:99px;font-size:24px;color:#fff;background:linear-gradient(135deg,#ff7a00,#ff9500);box-shadow:0 0 24px rgba(255,122,0,0.4);border:4px solid #0b0b0e}

.nb{position:absolute;top:2px;right:22%;min-width:16px;height:16px;border-radius:99px;background:var(--a);color:#000;font:800 9px var(--f);display:grid;place-items:center;padding:0 3px}

.mo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}.mo.o{display:flex}
.sheet{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#16161e;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 18px var(--f);margin:0 0 10px}
.ty{position:fixed;left:50%;bottom:calc(85px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1f1f2a;border:1px solid var(--line);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;font-size:13px}.ty.o{opacity:1;transform:translate(-50%,0)}

function playBeep(freq=600, dur=0.08){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = freq; osc.type = "sine";
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e){}
}

function createLocalDB() {
  const store = (k, val) => val !== undefined ? LS('db_' + k, JSON.stringify(val)) : JSON.parse(LS('db_' + k) || '[]');
  const listenMap = {};
  const notify = (col) => { if(listenMap[col]) listenMap[col].forEach(cb => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) })); };
  return {
    collection: function(col) {
      return {
        onSnapshot: (cb) => {
          if(!listenMap[col]) listenMap[col] = [];
          listenMap[col].push(cb);
          setTimeout(() => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) }), 0);
          return () => { listenMap[col] = listenMap[col].filter(x => x !== cb); };
        },
        where: function(field, op, val) {
          return {
            onSnapshot: (cb) => {
              const filterDocs = () => store(col).filter(d => op === '==' ? d[field] === val : true);
              setTimeout(() => cb({ docs: filterDocs().map(d => ({ id: d.id, data: () => d })) }), 0);
              return () => {};
            }
          };
        },
        doc: function(id) {
          return {
            set: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) arr[idx] = { ...arr[idx], ...data, id };
              else arr.push({ ...data, id });
              store(col, arr); notify(col);
            },
            update: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) { arr[idx] = { ...arr[idx], ...data }; store(col, arr); notify(col); }
            },
            delete: async () => {
              let arr = store(col).filter(x => x.id !== id);
              store(col, arr); notify(col);
            },
            onSnapshot: (cb) => {
              const d = store(col).find(x => x.id === id);
              cb({ exists: !!d, data: () => d });
              return () => {};
            }
          };
        }
      };
    }
  };
}

  const act = L.filter(x => !x.sold && !BAN[x.seller] && !expired(x));
  let r = act.filter(x => (cat === "all" || (cat === "fav" ? FAV.includes(x.id) : x.cat === cat)) && (x.title + " " + (x.desc||"")).toLowerCase().includes(q.toLowerCase()));
  r = r.filter(x => (!F.min || x.price >= +F.min) && (!F.max || x.price <= +F.max) && (!F.ph || (x.photos || []).some(img)) && (!F.tr || (() => { const z = stats(x.seller); return z.n && z.avg >= 4.5; })()));
  r.sort((x, y) => pm(y) - pm(x) || (srt === "asc" ? x.price - y.price : srt === "desc" ? y.price - x.price : srt === "rate" ? stats(y.seller).avg - stats(x.seller).avg : key(y) - key(x)));

  a.innerHTML = `
 <div class="sr"><i class="fa-solid fa-search"></i><input id="q" placeholder="${t("search")}" autocomplete="off" value="${e(q)}"></div>

 <div class="cat-scroll">
   ${[["all", "fa-border-all", t("all")], ...CATS.map(c => [c[0], c[1], c[2][LI]])].map(([c, icon, l]) => `
     <div class="cat-item ${cat === c ? "on" : ""}" data-c="${c}">
       <i class="fa-solid ${icon}"></i>
       <span>${e(l)}</span>
     </div>
   `).join("")}
 </div>

 <div class="promo-banner">
   <div style="max-width:60%">
     <div style="font-size:10px;font-weight:800;color:var(--a);letter-spacing:1px;text-transform:uppercase">НАЙКРАЩІ ТОВАРИ</div>
     <div class="promo-title">ЯКІСТЬ<br><span style="color:var(--a)">ГАРАНТОВАНА</span></div>
     <div class="promo-sub">Швидка доставка • Безпечна угода</div>
     <button class="orange-btn sm" onclick="go('mine')">Перейти до каталогу →</button>
   </div>
   <div class="promo-bag">
     <div class="promo-bag-ic">N</div>
   </div>
 </div>

 <div class="bar"><h2>${t("fresh")}</h2><select class="sort gh sm" id="so"><option value="new">${t("sNew")}</option><option value="asc">${t("sAsc")}</option><option value="desc">${t("sDesc")}</option></select></div>
 <div class="grid">${r.map(card).join("")}</div>${r.length ? "" : `<div class="emp">${t("empty")}</div>`}

 <div class="perks">
   <div class="pk-item"><div class="pk-ic"><i class="fa-solid fa-shield-halved"></i></div><div class="pk-tx"><b>Безпечно</b><span>Гарантія угоди</span></div></div>
   <div class="pk-item"><div class="pk-ic"><i class="fa-solid fa-bolt"></i></div><div class="pk-tx"><b>Швидко</b><span>Миттєвий зв'язок</span></div></div>
   <div class="pk-item"><div class="pk-ic"><i class="fa-solid fa-truck-fast"></i></div><div class="pk-tx"><b>Надійно</b><span>Перевірені продавці</span></div></div>
   <div class="pk-item"><div class="pk-ic"><i class="fa-solid fa-headset"></i></div><div class="pk-tx"><b>Підтримка</b><span>24/7 оперативність</span></div></div>
 </div>`;

  $("#q").oninput = x => { q = x.target.value; render(); };
  $("#so").value = srt; $("#so").onchange = x => { srt = x.target.value; render(); };
  a.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cat = b.dataset.c; render(); }); bindCards(a);
}

function item(a) {
  const x = L.find(y => y.id === view.id); if(!x) { a.innerHTML = `<div class="emp">—<br><br><button id="bk">${t("back")}</button></div>`; $("#bk").onclick = () => go("home"); return; }
  const ps = (x.photos || []).map(img).filter(Boolean), k = view.k || 0, my = x.seller === uid;

  a.innerHTML = `<button class="gh sm" id="bk">← ${t("back")}</button>
 <div class="pan" style="margin-top:14px">
   <div class="im" style="aspect-ratio:1.4">${ps[k] ? `<img src="${ps[k]}" alt="">` : `<i class="fa-solid ${ci(x.cat)}" style="color:var(--a)"></i>`}</div>
   <h1 style="font:700 20px var(--f);margin:12px 0 6px">${e(x.title)}</h1>
   <div class="pr" style="font-size:24px">${rub(x.price)}</div>
   <div style="margin:12px 0;color:var(--mu);font-size:13px">${e(x.desc || t("noDesc"))}</div>
   <div class="pan" style="background:#0b0b0e">
     <div class="mu">${t("seller")}</div>
     <div id="sp" style="cursor:pointer;display:flex;gap:8px;align-items:center;margin-top:4px"><b>${e(nm(x.seller))}</b> ${rate(x.seller)}</div>
   </div>
   ${my ? `<div class="pan">${t("own")}</div>` : `<button class="orange-btn w" id="wr" style="padding:14px">💬 ${t("write")}</button>`}
   <div style="display:flex;gap:8px;margin-top:10px">${my || isS() ? `<button class="gh sm" id="sd">${x.sold ? t("relist") : t("soldB")}</button><button class="dg sm" id="dl">${t("del")}</button>` : `<button class="gh sm" id="rp">${t("report")}</button>`}</div>
 </div>`;
  $("#bk").onclick = () => go("home"); $("#sp").onclick = () => go("profile", { id: x.seller });
  const w = $("#wr"); if(w) w.onclick = () => go("chat", { tid: x.id + "_" + uid, lid: x.id, title: x.title, buyer: uid, seller: x.seller });
  const rp = $("#rp"); if(rp) rp.onclick = () => reportSheet({ target: x.seller, lid: x.id, title: x.title });
  const sd = $("#sd"); if(sd) sd.onclick = async () => { await db.collection("listings").doc(x.id).update({ sold: !x.sold }); go("mine"); };
  const dl = $("#dl"); if(dl) dl.onclick = async () => { if(await ask(t("conf"))) { await db.collection("listings").doc(x.id).delete(); go("mine"); } };
}

function mineV(a) {
  const r = L.filter(x => x.seller === uid).sort((x, y) => y.ts - x.ts);
  a.innerHTML = `<div class="bar"><h2>${t("mine")}</h2><button class="orange-btn sm" id="nw">＋ ${t("sell")}</button></div>
 ${r.map(x => `<div class="pan" style="display:flex;justify-content:space-between;align-items:center"><div><b>${e(x.title)}</b><div class="pr">${rub(x.price)}</div></div><button class="dg sm" data-dl="${e(x.id)}">✕</button></div>`).join("") || `<div class="emp">${t("mineE")}</div>`}`;
  $("#nw").onclick = openForm;
  a.querySelectorAll("[data-dl]").forEach(b => b.onclick = async () => { if(await ask(t("conf"))) db.collection("listings").doc(b.dataset.dl).delete(); });
}

function chat(a) {
  const v = view, peer = uid === v.buyer ? v.seller : v.buyer; need([peer]);
  a.innerHTML = `<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><button class="gh sm" id="bk">←</button><div><b>${e(nm(peer))}</b><div class="mu" style="font-size:11px">${e(v.title)}</div></div></div>
 <div class="pan" style="height:calc(100vh - 240px);display:flex;flex-direction:column"><div id="ms" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div>
 <form id="cf" style="display:flex;gap:6px;margin-top:8px"><input id="mt" placeholder="${t("msgPh")}"><button class="orange-btn sm">➤</button></form></div>`;
  $("#bk").onclick = () => go("inbox");
  unsub = db.collection("msgs").where("tid", "==", v.tid).onSnapshot(s => {
    const m = s.docs.map(d => d.data()).sort((x, y) => x.ts - y.ts), b = $("#ms"); if(!b) return;
    b.innerHTML = m.map(x => `<div style="align-self:${x.from === uid ? "flex-end" : "flex-start"};background:${x.from === uid ? "var(--a)" : "var(--line)"};color:${x.from === uid ? "#000" : "#fff"};padding:8px 12px;border-radius:12px;max-width:80%">${e(x.text)}</div>`).join("");
    b.scrollTop = b.scrollHeight;
  });
  $("#cf").onsubmit = async ev => { ev.preventDefault(); const i = $("#mt"), x = i.value.trim(); if(!x) return; i.value = ""; await db.collection("msgs").doc(uidn()).set({ tid: v.tid, from: uid, text: x, ts: Date.now() }); };
}

function inbox(a) {
  const r = Object.values(TH).sort((x, y) => y.ts - x.ts);
  a.innerHTML = `<div class="bar"><h2>${t("chats")}</h2></div>${r.map(h => { const p = uid === h.buyer ? h.seller : h.buyer; return `<div class="pan" style="cursor:pointer" data-t="${e(h.id)}"><b>${e(nm(p))}</b><div class="mu">${e(h.last)}</div></div>`; }).join("") || `<div class="emp">${t("noDlg")}</div>`}`;
  a.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const h = TH[b.dataset.t]; go("chat", { tid: h.id, lid: h.lid, title: h.title, buyer: h.buyer, seller: h.seller }); });
}

function profile(a) {
  a.innerHTML = `<div class="pan" style="text-align:center"><div class="mk" style="margin:auto;width:60px;height:60px;font-size:28px">${e((nm(uid)[0]||"U").toUpperCase())}</div><h2 style="margin:10px 0 4px">@${e(nm(uid))}</h2><div class="mu">Баланс: 0 грн</div><div style="display:flex;gap:8px;margin-top:14px"><button class="orange-btn sm w" onclick="toast('Пополнение пока недоступно')">Пополнить</button><button class="gh sm w" id="lo">Выйти</button></div></div>
 <div class="pan"><button class="gh w" id="sg">🛡 ${t("staffIn")}</button></div>`;
  const lo = $("#logoutBtn") || $("#lo"); if(lo) lo.onclick = () => { LS("noir_user", ""); userAuth = null; uid = "usr_" + Date.now().toString(36); LS("noir_uid", uid); render(); toast("Вы вышли из системы"); };
  const sg = $("#sg"); if(sg) sg.onclick = staffGate;
}

function stats(id) { const rv = R.filter(r => r.seller === id), n = rv.length, avg = n ? rv.reduce((z, r) => z + r.rating, 0) / n : 0; return { n, avg, deals: Object.values(DEALS).filter(d => d.seller === id && d.status === "confirmed").length }; }
function rate(id) { const z = stats(id); return z.n ? `<span style="color:var(--a);font-weight:700">★ ${z.avg.toFixed(1)}</span>` : `<span class="mu">${t("newbie")}</span>`; }
function sheet(h) { $("#gb").innerHTML = h; $("#gm").classList.add("o"); }
function unsheet() { $("#gm").classList.remove("o"); }
$("#gm").onclick = ev => { if(ev.target.id === "gm") unsheet(); };
document.addEventListener("click", ev => { 
  if(!ev.target.closest(".lg")) $("#lp").classList.remove("o"); 
  if(!ev.target.closest(".ntf-box")) $("#ntfPop").classList.remove("o");
});

function ask(m) { return new Promise(res => { sheet(`<p style="font-size:16px;margin:6px 0 16px">${e(m)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="gh" id="gn">${t("cancel")}</button><button class="dg" id="gy">${t("yes")}</button></div>`); $("#gy").onclick = () => { unsheet(); res(true); }; $("#gn").onclick = () => { unsheet(); res(false); }; }); }

const CODE_H = "e700cd1d4d864992e889c7e6d0176842a53b158c2a1bd5685eb4e7a4c8a6b5ee";
async function sha(x) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("noir-market:" + x)); return [...new Uint8Array(b)].map(z => z.toString(16).padStart(2, "0")).join(""); }
function staffGate() {
  sheet(`<h3>🛡 ${t("staffIn")}</h3><input id="cd" placeholder="${t("codePh")}" style="margin:14px 0"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="gh" id="cn">${t("cancel")}</button><button class="orange-btn" id="cy">${t("enter")}</button></div>`);
  $("#cy").onclick = async () => {
    const v = $("#cd").value.toUpperCase(); let h = ""; try { h = await sha(v); } catch(x) {}
    if(h === CODE_H) { await db.collection("staff").doc(uid).set({ name: "Admin", ts: Date.now() }); unsheet(); toast(t("unlocked")); go("support"); }
    else toast(t("badCode"));
  };
  $("#cn").onclick = unsheet;
}

function openForm() { if(!db || !uid) return; ph = []; $("#fm").reset(); fillSel(); $("#mo").classList.add("o"); }
$("#fx").onclick = () => $("#mo").classList.remove("o");
$("#fm").onsubmit = async ev => {
  ev.preventDefault();
  try {
    await db.collection("listings").doc(uidn()).set({ title: $("#ft").value.trim(), cat: $("#fc").value, price: +$("#fp").value, oldPrice: +$("#fOldP").value || 0, desc: $("#fs").value.trim(), how: $("#fh").value, photos: ph, seller: uid, premium: $("#fpm").checked ? "on" : "", sold: false, ts: Date.now() });
    $("#mo").classList.remove("o"); toast(t("done")); go("mine");
  } catch(x) { toast("!"); }
};

let isRegMode = false;
$("#authBtn").onclick = () => userAuth ? go("profile") : $("#authMo").classList.add("o");
$("#authClose").onclick = () => $("#authMo").classList.remove("o");
$("#toggleRegBtn").onclick = (ev) => {
  ev.preventDefault(); isRegMode = !isRegMode;
  $("#authTitle").textContent = isRegMode ? "Регистрация" : "Вход";
  $("#auNameLbl").style.display = isRegMode ? "block" : "none";
  $("#auName").style.display = isRegMode ? "block" : "none";
};

$("#authFm").onsubmit = async (ev) => {
  ev.preventDefault();
  const val = $("#auVal").value.trim().toLowerCase(), pass = $("#auPass").value.trim(), name = $("#auName").value.trim();
  if(!val || !pass) return;
  const newUid = "usr_" + Date.now().toString(36);
  userAuth = { uid: newUid, name: name || val }; uid = newUid;
  LS("noir_user", JSON.stringify(userAuth)); LS("noir_uid", uid); names[uid] = userAuth.name;
  $("#authMo").classList.remove("o"); toast("Успешно!"); render();
};

$("#bellBtn").onclick = () => $("#ntfPop").classList.toggle("o");
$("#clrNtf").onclick = () => { NOTIFICATIONS = []; LS("noir_ntfs", "[]"); renderNtfs(); };
$("#lb").onclick = () => $("#lp").classList.toggle("o");
$("#lgo").onclick = $("#lgb").onclick = () => go("home");

fillSel(); render(); boot();
</script></body></html>
