<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗОНА 0: Терминал Выживания</title>
    <style>
        :root {
            --bg-color: #0a0d0e;
            --card-bg: #12181b;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-yellow: #f1c40f;
            --accent-blue: #3498db;
            --text-color: #dcdde1;
            --text-dim: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid #2c3e50;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed #2c3e50;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent-green);
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            background: #00000040;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #2c3e50;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        .bar-container {
            width: 100%;
            background: #1e272e;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        .log-box {
            background: #000;
            border: 1px solid #2c3e50;
            border-radius: 6px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 8px;
            border-bottom: 1px dotted #1e272e;
            padding-bottom: 4px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: #1e272e;
            color: var(--text-color);
            border: 1px solid #354b60;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #2c3e50;
            border-color: var(--accent-green);
        }

        .btn-danger {
            border-color: var(--accent-red);
        }

        .btn-danger:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <h1>☣ ЗОНА 0: БУНКЕР</h1>
        <span style="font-size: 0.8rem; color: var(--text-dim);">ДЕНЬ <span id="day-val">1</span> | 12:00</span>
    </div>

    <!-- Индикаторы состояния -->
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-label">❤️ ZDOROV'YE <span id="hp-val">100%</span></div>
            <div class="bar-container">
                <div class="bar" id="hp-bar" style="width: 100%; background: var(--accent-red);"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-label">⚡ ENERGIYA <span id="energy-val">100%</span></div>
            <div class="bar-container">
                <div class="bar" id="energy-bar" style="width: 100%; background: var(--accent-yellow);"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-label">🍗 GOLOD <span id="hunger-val">100%</span></div>
            <div class="bar-container">
                <div class="bar" id="hunger-bar" style="width: 100%; background: var(--accent-green);"></div>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-label">💧 ZHAZHDA <span id="thirst-val">100%</span></div>
            <div class="bar-container">
                <div class="bar" id="thirst-bar" style="width: 100%; background: var(--accent-blue);"></div>
            </div>
        </div>
    </div>

    <!-- Лог текстовых событий -->
    <div class="log-box" id="log">
        <div class="log-entry">🌲 Вы очнулись в закрытом бункере. Связи нет.</div>
    </div>

    <!-- Кнопки управления -->
    <div class="actions-grid">
        <button class="btn" onclick="action('raid')">🏃 ВЫЛАЗКА</button>
        <button class="btn" onclick="action('rest')">💤 ОТДЫХ</button>
        <button class="btn" onclick="action('eat')">🍗 ЕДА (<span id="food-count">2</span>)</button>
        <button class="btn" onclick="action('drink')">💧 ВОДА (<span id="water-count">2</span>)</button>
    </div>
</div>

<script>
    // Состояние игры
    let state = {
        day: 1,
        hp: 100,
        energy: 100,
        hunger: 100,
        thirst: 100,
        food: 2,
        water: 2
    };

    function updateUI() {
        document.getElementById('day-val').innerText = state.day;
        document.getElementById('hp-val').innerText = state.hp + '%';
        document.getElementById('hp-bar').style.width = state.hp + '%';
        
        document.getElementById('energy-val').innerText = state.energy + '%';
        document.getElementById('energy-bar').style.width = state.energy + '%';

        document.getElementById('hunger-val').innerText = state.hunger + '%';
        document.getElementById('hunger-bar').style.width = state.hunger + '%';

        document.getElementById('thirst-val').innerText = state.thirst + '%';
        document.getElementById('thirst-bar').style.width = state.thirst + '%';

        document.getElementById('food-count').innerText = state.food;
        document.getElementById('water-count').innerText = state.water;
    }

    function logMessage(msg) {
        const log = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = msg;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
    }

    function action(type) {
        if (state.hp <= 0) {
            logMessage("☠ Вы мертвы. Перезагрузите страницу для новой игры.");
            return;
        }

        if (type === 'raid') {
            if (state.energy < 20) {
                logMessage("❌ Слишком мало энергии для вылазки!");
                return;
            }
            state.energy -= 20;
            state.hunger = Math.max(0, state.hunger - 10);
            state.thirst = Math.max(0, state.thirst - 15);

            let chance = Math.random();
            if (chance > 0.5) {
                let foodFound = Math.floor(Math.random() * 2) + 1;
                state.food += foodFound;
                logMessage(`✅ Рейд успешен! Найдено еды: ${foodFound} шт.`);
            } else if (chance > 0.2) {
                let waterFound = Math.floor(Math.random() * 2) + 1;
                state.water += waterFound;
                logMessage(`✅ Вы нашли чистую воду: ${waterFound} шт.`);
            } else {
                state.hp = Math.max(0, state.hp - 25);
                logMessage("⚠️ На вас напали мутанты! -25% Zdorov'ya.");
            }
        } 
        else if (type === 'rest') {
            state.day += 1;
            state.energy = 100;
            state.hunger = Math.max(0, state.hunger - 20);
            state.thirst = Math.max(0, state.thirst - 25);
            logMessage(`🌙 Наступил день ${state.day}. Энергия восстановлена.`);
        }
        else if (type === 'eat') {
            if (state.food > 0) {
                state.food--;
                state.hunger = Math.min(100, state.hunger + 35);
                logMessage("🍗 Вы поели и восполнили сытость.");
            } else {
                logMessage("❌ У вас нет еды!");
            }
        }
        else if (type === 'drink') {
            if (state.water > 0) {
                state.water--;
                state.thirst = Math.min(100, state.thirst + 40);
                logMessage("💧 Вы утолили жажду.");
            } else {
                logMessage("❌ У вас нет воды!");
            }
        }

        // Проверка критического состояния
        if (state.hunger === 0 || state.thirst === 0) {
            state.hp = Math.max(0, state.hp - 15);
            logMessage("💔 Вы страдаете от голода или обезвоживания!");
        }

        updateUI();
    }
</script>
</body>
</html>
