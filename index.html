<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Auto Seller</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #172554 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #312e81 0%, transparent 35%),
        #050816;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* =========================
   ТЕЛЕФОН
========================= */

.phone {
    width: 390px;
    height: 820px;
    max-width: 100vw;
    max-height: 100vh;
    background: #080b14;
    border: 8px solid #171b27;

        0 0 0 2px #303644,

}

/* Верхняя часть */

.status-bar {
    height: 34px;

}

.status-right {
    display: flex;

}

/* Экран */

.screen {
    height: calc(100% - 94px);

    scrollbar-width: none;

}

.screen::-webkit-scrollbar {

}

/* Верх приложения */

    justify-content: space-between;

.app-header h1 {
    font-size: 25px;
}

/* =========================
   РАБОЧИЙ СТОЛ
========================= */

.home {

}

.welcome {
    background: linear-gradient(135deg, #111827, #172554);

.welcome small {
    color: #94a3b8;

.app-emoji {

}

.app-name {
    margin-top: 8px;

}

/* =========================
   КНОПКА НАЗАД
========================= */

.back-button {
    border: none;
    background: #172033;

    border-radius: 12px;

}

   АВТОРЫНОК
========================= */

}

.car-card {

}

.car-price {

.buy-button {

}

/* =========================
   БАНК
========================= */

.bank-card {
    margin: 0 18px 15px;
    padding: 22px;
    border-radius: 22px;
    background: linear-gradient(135deg, #064e3b, #065f46);
    border: 1px solid #08785a;
}

.bank-card small {

}

.bank-money {

}

.bank-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;

}

.bank-action {
    background: #111827;
    border: 1px solid #253047;

    border-radius: 17px;

}

.bank-action strong {
    display: block;
    font-size: 16px;
    margin-bottom: 5px;
}

.bank-action span {
    color: #94a3b8;
    font-size: 12px;
}

/* =========================
   СТАТИСТИКА
========================= */

.stats-grid {
    padding: 0 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat-card {
    background: #111827;
    border: 1px solid #222e44;
    border-radius: 18px;
    padding: 18px;
}

.stat-card small {
    color: #94a3b8;
}

.stat-card strong {
    display: block;
    font-size: 24px;
    margin-top: 7px;
}

/* =========================
   ГОРОДА
========================= */

.city-list {
    padding: 0 18px;
}

.city-card {
    background: #111827;
    border: 1px solid #202c42;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.city-card h3 {
    font-size: 17px;
}

.city-card p {
    margin-top: 4px;
    color: #94a3b8;

}

.city-button {
    border: none;
    background: #1d4ed8;
    color: white;
    padding: 10px 13px;
    border-radius: 10px;
    cursor: pointer;
}

/* =========================
   НАСТРОЙКИ
========================= */

.settings {
    padding: 0 18px;
}

.setting {
    background: #111827;
    border: 1px solid #202c42;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.setting span {
    color: #94a3b8;
    font-size: 13px;
}

.danger {
    background: #7f1d1d;
    border-color: #991b1b;
}

/* =========================
   НИЖНЯЯ ПАНЕЛЬ
========================= */

.bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: rgba(9,13,23,.96);
    border-top: 1px solid #20283a;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: center;
}

.nav-button {
    border: none;
    background: transparent;
    color: #64748b;
    cursor: pointer;
    font-size: 11px;
}

.nav-button.active {
    color: #60a5fa;
}

.nav-icon {
    display: block;
    font-size: 20px;

}

/* =========================
   УВЕДОМЛЕНИЕ
========================= */

.toast {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 72px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 13px 15px;
    border-radius: 13px;
    transform: translateY(120px);
    opacity: 0;
    transition: .25s;
    z-index: 100;
    text-align: center;
    font-size: 13px;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* =========================
   МОДАЛЬНОЕ ОКНО
========================= */

.modal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: none;
    align-items: flex-end;
    z-index: 50;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    background: #0d1320;
    border-radius: 25px 25px 0 0;
    padding: 22px;
    border-top: 1px solid #27334a;
}

.modal-box h2 {
    margin-bottom: 10px;
}

.modal-box p {
    color: #94a3b8;
    line-height: 1.5;

}

.modal-buttons {
    display: flex;

    margin-top: 18px;
}

.modal-buttons button {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 12px;
    color: white;
    cursor: pointer;
}

.cancel {
    background: #1e293b;
}

.confirm {
    background: #2563eb;
}

/* ПК */

@media (min-width: 600px) {
    .phone {
        transform: scale(.9);
    }
}
</style>
</head>

<body>

<div class="phone">

    <div class="status-bar">
        <span id="clock">15:50</span>

        <div class="status-right">
            <span>▮▮▮</span>
            <span>Wi-Fi</span>
            <span>🔋</span>
        </div>
    </div>

    <main id="screen" class="screen"></main>

    <div class="bottom-bar">
        <button class="nav-button active" onclick="openApp('home')">
            <span class="nav-icon">⌂</span>
            Главная
        </button>

        <button class="nav-button" onclick="openApp('market')">
            <span class="nav-icon">🚗</span>
            Рынок
        </button>

        <button class="nav-button" onclick="openApp('bank')">
            <span class="nav-icon">₽</span>
            Банк
        </button>
    </div>

    <div id="toast" class="toast"></div>

    <div id="modal" class="modal">
        <div class="modal-box">
            <h2 id="modalTitle">Подтверждение</h2>
            <p id="modalText"></p>

            <div class="modal-buttons">
                <button class="cancel" onclick="closeModal()">Отмена</button>
                <button class="confirm" id="modalConfirm">Подтвердить</button>
            </div>
        </div>
    </div>

</div>

<script>

/* =====================================================
   AUTO SELLER
   ОСНОВНАЯ ЛОГИКА ИГРЫ
===================================================== */

/* ---------- СОХРАНЕНИЕ ---------- */

const defaultGame = {
    money: 500000,

    currentCity: "Томск",

    carsBought: 0,
    carsSold: 0,
    totalProfit: 0,

    garage: [],

    deposit: {
        amount: 0,
        rate: 0.08
    },

    credit: {
        amount: 0,
        rate: 0.15
    }
};

let game = JSON.parse(localStorage.getItem("autoSellerSave"));

if (!game) {
    game = structuredClone(defaultGame);
    saveGame();
}

function saveGame() {
    localStorage.setItem("autoSellerSave", JSON.stringify(game));
}


/* ---------- АВТОМОБИЛИ ---------- */

/*
    Пока только 3 машины.
    Позже добавим 20+.
*/

const cars = [

    {
        id: 1,
        name: "Lada Priora",
        year: 2012,
        mileage: 164000,
        power: 98,
        condition: "Хорошее",
        city: "Томск",
        price: 185000,
        emoji: "🚘"
    },

    {
        id: 2,
        name: "VAZ 2114",
        year: 2010,
        mileage: 198000,
        power: 81,
        condition: "Среднее",
        city: "Москва",
        price: 145000,
        emoji: "🚗"
    },

    {
        id: 3,
        name: "Lada Granta",
        year: 2017,
        mileage: 97000,
        power: 106,
        condition: "Отличное",
        city: "Санкт-Петербург",
        price: 395000,
        emoji: "🚙"
    }

];


/* ---------- УТИЛИТЫ ---------- */

function money(value) {
    return Math.floor(value).toLocaleString("ru-RU") + " ₽";
}

function showToast(text) {

    const toast = document.getElementById("toast");

    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}


/* ---------- ЧАСЫ ---------- */

function updateClock() {

    const now = new Date();

    let h = String(now.getHours()).padStart(2, "0");
    let m = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").textContent = h + ":" + m;
}

setInterval(updateClock, 1000);
updateClock();


/* ---------- ЭКРАН ---------- */

function openApp(app) {

    const screen = document.getElementById("screen");

    if (app === "home") {
        renderHome();
    }

    if (app === "market") {
        renderMarket();
    }

    if (app === "bank") {
        renderBank();
    }

    if (app === "stats") {
        renderStats();
    }

    if (app === "cities") {
        renderCities();
    }

    if (app === "settings") {
        renderSettings();
    }

    document.querySelectorAll(".nav-button").forEach(btn => {
        btn.classList.remove("active");
    });

    if (app === "home") {
        document.querySelectorAll(".nav-button")[0].classList.add("active");
    }

    if (app === "market") {
        document.querySelectorAll(".nav-button")[1].classList.add("active");
    }

    if (app === "bank") {
        document.querySelectorAll(".nav-button")[2].classList.add("active");
    }

    screen.scrollTop = 0;
}


/* =====================================================
   ГЛАВНЫЙ ЭКРАН
===================================================== */

function renderHome() {

    document.getElementById("screen").innerHTML = `

        <div class="home">

            <div class="welcome">

                <small>AUTO SELLER</small>

                <h2>Добро пожаловать 👋</h2>

                <div class="balance">
                    ${money(game.money)}
                </div>

                <div class="balance-label">
                    Доступные деньги
                </div>

            </div>

            <div class="apps">

                <button class="app-icon" onclick="openApp('market')">
                    <div class="app-emoji">🚗</div>
                    <div class="app-name">Авторынок</div>
                </button>

                <button class="app-icon" onclick="openApp('bank')">
                    <div class="app-emoji">🏦</div>
                    <div class="app-name">Банк</div>
                </button>

                <button class="app-icon" onclick="openApp('stats')">
                    <div class="app-emoji">📊</div>
                    <div class="app-name">Статистика</div>
                </button>

                <button class="app-icon" onclick="openApp('cities')">
                    <div class="app-emoji">🗺️</div>
                    <div class="app-name">Города</div>
                </button>

                <button class="app-icon" onclick="showGarage()">
                    <div class="app-emoji">🔧</div>
                    <div class="app-name">Гараж</div>
                </button>

                <button class="app-icon" onclick="openApp('settings')">
                    <div class="app-emoji">⚙️</div>
                    <div class="app-name">Настройки</div>
                </button>

            </div>

        </div>
    `;
}


/* =====================================================
   АВТОРЫНОК
===================================================== */

function renderMarket() {

    let html = `

        <div class="app-header">
            <div>
                <h1>Авторынок</h1>
                <span>Объявления автомобилей</span>
            </div>
        </div>

        <div class="market-list">
    `;

    cars.forEach(car => {

        html += `

            <div class="car-card">

                <div class="car-photo">
                    ${car.emoji}
                </div>

                <div class="car-info">

                    <div class="car-title">
                        ${car.name}
                    </div>

                    <div class="car-city">
                        📍 ${car.city}
                    </div>

                    <div class="car-specs">

                        <div class="spec">
                            📅 ${car.year} год
                        </div>

                        <div class="spec">
                            🛣️ ${car.mileage.toLocaleString("ru-RU")} км
                        </div>

                        <div class="spec">
                            ⚡ ${car.power} л.с.
                        </div>

                        <div class="spec">
                            🔧 ${car.condition}
                        </div>

                    </div>

                    <div class="car-price">
                        ${money(car.price)}
                    </div>

                    <button class="buy-button"
                        onclick="buyCar(${car.id})">
                        Купить
                    </button>

                </div>

            </div>

        `;
    });

    html += `
        </div>
    `;

    document.getElementById("screen").innerHTML = html;
}


/* =====================================================
   ПОКУПКА
===================================================== */

function buyCar(id) {

    const car = cars.find(c => c.id === id);

    if (!car) return;

    if (game.currentCity !== car.city) {

        showToast(
            `Машина находится в городе ${car.city}`
        );

        return;
    }

    if (game.money < car.price) {

        showToast("Недостаточно денег");

        return;
    }

    showModal(
        "Покупка автомобиля",
        `Купить ${car.name} за ${money(car.price)}?`,
        () => {

            if (game.money < car.price) {
                showToast("Недостаточно денег");
                return;
            }

            game.money -= car.price;

            game.carsBought++;

            game.garage.push({
                ...car,
                purchasePrice: car.price
            });

            saveGame();

            closeModal();

            showToast(`${car.name} куплена!`);

            setTimeout(() => {
                renderMarket();
            }, 500);

        }
    );
}


/* =====================================================
   БАНК
===================================================== */

function renderBank() {

    document.getElementById("screen").innerHTML = `

        <div class="app-header">

            <div>
                <h1>Банк</h1>
                <span>AutoBank</span>
            </div>

        </div>

        <div class="bank-card">

            <small>Текущий баланс</small>

            <div class="bank-money">
                ${money(game.money)}
            </div>

        </div>

        <div class="bank-actions">

            <button class="bank-action"
                onclick="depositMoney()">

                <strong>💰 Депозит</strong>

                <span>
                    На депозите:
                    ${money(game.deposit.amount)}
                </span>

            </button>

            <button class="bank-action"
                onclick="takeCredit()">

                <strong>💳 Кредит</strong>

                <span>
                    Долг:
                    ${money(game.credit.amount)}
                </span>

            </button>

            <button class="bank-action"
                onclick="repayCredit()">

                <strong>↩️ Погасить</strong>

                <span>
                    Кредит:
                    ${money(game.credit.amount)}
                </span>

            </button>

            <button class="bank-action"
                onclick="withdrawDeposit()">

                <strong>💵 Снять</strong>

                <span>
                    Депозит:
                    ${money(game.deposit.amount)}
                </span>

            </button>

        </div>
    `;
}


/* ---------- ДЕПОЗИТ ---------- */

function depositMoney() {

    const amount = Number(
        prompt("Введите сумму для депозита:")
    );

    if (!Number.isFinite(amount) || amount <= 0) {
        return;
    }

    if (amount > game.money) {

        showToast("Недостаточно денег");

        return;
    }

    game.money -= amount;

    game.deposit.amount += amount;

    saveGame();

    showToast(
        `На депозит внесено ${money(amount)}`
    );

    renderBank();
}


/* ---------- СНЯТИЕ ДЕПОЗИТА ---------- */

function withdrawDeposit() {

    if (game.deposit.amount <= 0) {

        showToast("Депозит пуст");

        return;
    }

    const amount = Number(
        prompt(
            `Доступно: ${money(game.deposit.amount)}\n\nСколько снять?`
        )
    );

    if (!Number.isFinite(amount) || amount <= 0) {
        return;
    }

    if (amount > game.deposit.amount) {

        showToast("На депозите недостаточно денег");

        return;
    }

    game.deposit.amount -= amount;

    game.money += amount;

    saveGame();

    showToast(`Снято ${money(amount)}`);

    renderBank();
}


/* ---------- КРЕДИТ ---------- */

function takeCredit() {

    if (game.credit.amount > 0) {

        showToast(
            "Сначала погасите текущий кредит"
        );

        return;
    }

    const amount = Number(
        prompt("Введите сумму кредита:")
    );

    if (!Number.isFinite(amount) || amount <= 0) {
        return;
    }

    const MAX_CREDIT = 1000000;

    if (amount > MAX_CREDIT) {

        showToast(
            `Максимальный кредит: ${money(MAX_CREDIT)}`
        );

        return;
    }

    game.credit.amount = amount;

    game.money += amount;

    saveGame();

    showToast(
        `Вы получили кредит ${money(amount)}`
    );

    renderBank();
}


/* ---------- ПОГАШЕНИЕ ---------- */

function repayCredit() {

    if (game.credit.amount <= 0) {

        showToast("У вас нет кредита");

        return;
    }

    const amount = Number(
        prompt(
            `Долг: ${money(game.credit.amount)}\n\nСколько погасить?`
        )
    );

    if (!Number.isFinite(amount) || amount <= 0) {
        return;
    }

    if (amount > game.money) {

        showToast("Недостаточно денег");

        return;
    }

    if (amount > game.credit.amount) {

        showToast(
            "Нельзя погасить больше суммы долга"
        );

        return;
    }

    game.money -= amount;

    game.credit.amount -= amount;

    saveGame();

    showToast(
        `Погашено ${money(amount)}`
    );

    renderBank();
}

/* =====================================================
   ГОРОДА

const cities = [
    {
        name: "Томск",
        travel: 0
    },

    {
        name: "Москва",
        travel: 15000
    },

    {
        name: "Санкт-Петербург",
        travel: 18000
    },

    {
        name: "Новосибирск",
        travel: 7000
    }
];


function renderCities() {

    let html = `

        <div class="app-header">

            <div>
                <h1>Города</h1>
                <span>
                    Сейчас вы в: ${game.currentCity}
                </span>
            </div>

        </div>

        <div class="city-list">
    `;

    cities.forEach(city => {

        const isCurrent =
            city.name === game.currentCity;

        html += `

            <div class="city-card">

                <div>

                    <h3>
                        ${city.name}
                        ${isCurrent ? " 📍" : ""}
                    </h3>

                    <p>
                        ${isCurrent
                            ? "Текущее местоположение"
                            : "Стоимость поездки: " +
                              money(city.travel)}
                    </p>

                </div>

                ${
                    isCurrent
                    ? `<button
                        class="city-button"
                        disabled>
                        Здесь
                      </button>`
                    : `<button
                        class="city-button"
                        onclick="travelTo('${city.name}', ${city.travel})">
                        Поехать
                      </button>`
                }

            </div>
        `;
    });

    html += `</div>`;

    document.getElementById("screen").innerHTML = html;
}


/* ---------- ПОЕЗДКА ---------- */

function travelTo(city, price) {

    if (game.money < price) {

        showToast(
            "Недостаточно денег на поездку"
        );

        return;
    }

    showModal(
        "Поездка",
        `Поехать в ${city} за ${money(price)}?`,
        () => {

            game.money -= price;

            game.currentCity = city;

            saveGame();

            closeModal();

            showToast(
                `Вы приехали в ${city}!`
            );

            renderCities();
        }
    );
}

function showGarage() {

    let html = `

        <div class="app-header">

            <div>
                <h1>Гараж</h1>
                <span>
                    Автомобили в собственности
                </span>
            </div>

        </div>

        <div class="market-list">
    `;

    if (game.garage.length === 0) {

        html += `

            <div style="
                text-align:center;
                color:#94a3b8;
                padding:50px 20px;
            ">

                🚗

                <br><br>

                В гараже пока пусто.

                <br>

                Купите первую машину
                на авторынке.

            </div>

        `;

    } else {

        game.garage.forEach((car, index) => {

            html += `

                <div class="car-card">

                    <div class="car-photo">
                        ${car.emoji}
                    </div>

                    <div class="car-info">

                        <div class="car-title">
                            ${car.name}
                        </div>

                        <div class="car-city">
                            📍 Куплена в ${car.city}
                        </div>

                        <div class="car-price">
                            ${money(car.purchasePrice)}
                        </div>

                        <button
                            class="buy-button"
                            onclick="sellCar(${index})">

                            Продать

                        </button>

                    </div>

                </div>

            `;
        });
    }

    html += `</div>`;

    document.getElementById("screen").innerHTML = html;
}


/* ---------- ПРОДАЖА ---------- */

function sellCar(index) {

    const car = game.garage[index];

    if (!car) return;

    /*
        Пока продажная цена равна
        покупной.
        
        Позже сделаем:
        - торг
        - рынок
        - спрос
        - состояние
        - случайную цену
        - прибыль/убыток
    */

    const salePrice = Math.floor(
        car.purchasePrice * 1.10
    );

    showModal(
        "Продажа автомобиля",
        `Продать ${car.name} за ${money(salePrice)}?`,
        () => {

            game.money += salePrice;

            game.carsSold++;

            game.totalProfit +=
                salePrice - car.purchasePrice;

            game.garage.splice(index, 1);

            saveGame();

            closeModal();

            showToast(
                `Машина продана за ${money(salePrice)}`
            );

            showGarage();
        }
    );
}

/* =====================================================

===================================================== */

let modalAction = null;

function showModal(title, text, action) {

    document.getElementById("modalTitle").textContent = title;

    document.getElementById("modalText").textContent = text;

    modalAction = action;

    document.getElementById("modalConfirm").onclick = () => {

        if (modalAction) {
            modalAction();
        }
    };

    document.getElementById("modal").classList.add("show");
}


function closeModal() {

    document.getElementById("modal").classList.remove("show");

    modalAction = null;
}

===================================================== */

function resetGame() {

    showModal(
        "Сброс игры",
        "Весь прогресс будет удалён. Продолжить?",
        () => {

            game = structuredClone(defaultGame);

            saveGame();

            closeModal();

            showToast("Игра сброшена");

            renderHome();
        }
    );
}
