/*
 Важно:
 offer может принимать multiplier либо абсолютную цену.
*/

function offer(id,value){

 const car=cars.find(x=>x.id===id);
 if(!car)return;

 let proposed=value;

 if(value>0&&value<=1)
  proposed=car.price*value;

 proposed=Math.floor(proposed);

 if(proposed>=car.price){

  if(game.money>=car.price){
   closeModal();
   buyCar(car,car.price);
  }else toast("Недостаточно денег");

  return;
 }

 const ratio=proposed/car.price;

 if(ratio>=.94){

  const counter=Math.floor(
   ((proposed+car.price)/2)/1000
  )*1000;

  counterOffer(car,proposed,counter);
  return;
 }

 if(ratio>=.80){

  const counter=Math.floor(
   ((proposed+car.price*.92)/2)/1000
  )*1000;

  counterOffer(car,proposed,counter);
  return;
 }

 toast("Продавец отказался от такой цены");
 game.reputation=Math.max(0,game.reputation-1);
 save();
}

function counterOffer(car,your,counter){

 modal("Встречное предложение",`

 <div class="card">

  <p class="small muted">Вы предложили</p>
  <h2>${money(your)}</h2>

  <p class="small muted" style="margin-top:13px">
   Продавец готов отдать за
  </p>

  <h2>${money(counter)}</h2>

 </div>

 <button class="btn main"
 style="width:100%"
 onclick="acceptCounter(${car.id},${counter})">
 Купить за ${money(counter)}
 </button>

 <button class="btn"
 style="width:100%;margin-top:7px"
 onclick="trade(${car.id})">
 Продолжить торг
 </button>
 `);
}

function acceptCounter(id,price){

 const car=cars.find(x=>x.id===id);

 if(game.money<price){
  toast("Недостаточно денег");
  return;
 }

 closeModal();
 buyCar(car,price);
}

function buyCar(car,price){

 if(car.city!==game.city){
  toast("Сначала нужно приехать в "+car.city);
  return;
 }

 if(!Number.isFinite(price)||price<=0){
  toast("Ошибка цены");
  return;
 }

 if(game.money<price){
  toast("Недостаточно денег");
  return;
 }

 game.money-=price;
 game.bought++;

 const owned={
  uid:Date.now()+Math.random(),
  baseId:car.id,
  name:car.name,
  year:car.year,
  mileage:car.mileage,
  power:car.power,
  city:car.city,
  emoji:car.emoji,

  purchasePrice:Math.floor(price),

  condition:car.condition,
  engine:car.engine,
  body:car.body,
  suspension:car.suspension,
  electric:car.electric,
  interior:car.interior,

  vin:car.vin,
  owners:car.owners,
  accidents:car.accidents
 };

 game.garage.push(owned);

 game.history.unshift({
  type:"Покупка",
  car:car.name,
  amount:price,
  profit:0,
  day:game.day
 });

 game.reputation=Math.min(100,game.reputation+1);

 save();

 garage();
}

function confirmSell(i){

 const car=game.garage[i];

 const input=document.getElementById("sellInput");

 /*
  Number() + Number.isFinite() защищают
  от NaN / Infinity.

  Ограничение проверяется ещё раз здесь,
  даже если пользователь изменит HTML
  через консоль.
 */

 const price=Number(input.value);

 const maxPrice=Math.floor(
  car.purchasePrice*MAX_SELL_MULTIPLIER
 );

 if(!Number.isFinite(price)){
  toast("Некорректная цена");
  return;
 }

 if(price<=0){
  toast("Цена должна быть больше нуля");
  return;
 }

 if(price>maxPrice){
  toast(
   "Нельзя! Максимум "+
   money(maxPrice)+
   " (+30% от покупки)"
  );
  return;
 }

 const profit=price-car.purchasePrice;

 game.money+=price;
 game.sold++;
 game.profit+=profit;

 game.history.unshift({
  type:"Продажа",
  car:car.name,
  amount:price,
  profit:profit,
  day:game.day
 });

 game.garage.splice(i,1);

 if(profit>0)
  game.reputation=Math.min(100,game.reputation+1);
 else
  game.reputation=Math.max(0,game.reputation-1);

 save();
 closeModal();

 toast(
  profit>=0
   ?"Продано! Прибыль "+money(profit)
   :"Продано. Убыток "+money(Math.abs(profit))
 );

 garage();
}

 }

 game.city=name;
 game.day++;

 /*

  const interest=game.deposit*0.08/365;

  game.deposit+=interest;

  const interest=game.credit*0.15/365;

  game.credit+=interest;
 }
}
