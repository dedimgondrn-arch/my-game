<html lang="ru">

<title>Auto Seller</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#08090b;color:#eee;
 font-family:Arial,Helvetica,sans-serif
}
button,input{font:inherit}
button{cursor:pointer}

body{
 display:flex;
 align-items:center;
 justify-content:center;
}

/* ===== РАБОЧИЙ СТОЛ ===== */

#desktop{
 position:relative;
 width:100vw;height:100vh;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% 30%,#222933 0,#0d1116 38%,#07090b 100%);
}

#desktop:before{
 content:"";
 position:absolute;inset:0;
 background:
 linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
 linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
 background-size:45px 45px;
 pointer-events:none;
}

.top{
 position:absolute;left:0;right:0;top:0;height:48px;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;
 background:rgba(7,9,11,.88);
 border-bottom:1px solid #252b32;
 z-index:5;
}

.top b{letter-spacing:.8px}
.top span{color:#8e969f;font-size:12px}

.desktop-center{
 position:absolute;
 inset:48px 0 0;
 display:flex;
 align-items:center;
 justify-content:center;
}

/* ===== ТЕЛЕФОН ===== */

.phone{
 position:relative;
 width:min(390px,100vw);
 height:min(820px,calc(100vh - 58px));
 min-height:550px;
 border:8px solid #191d22;
 border-radius:34px;
 background:#080a0d;
 box-shadow:0 25px 80px #000;
 overflow:hidden;
}

.phone-screen{
 position:absolute;inset:0;
 overflow:hidden;
 background:#0b0d10;
}

.notch{
 position:absolute;z-index:30;
 top:0;left:50%;transform:translateX(-50%);
 width:115px;height:25px;
 background:#050607;
 border-radius:0 0 15px 15px;
}

.status{
 height:40px;padding:10px 17px 0;
 display:flex;justify-content:space-between;
 font-size:11px;color:#c7ccd1;
}

.app{
 position:absolute;
 top:40px;left:0;right:0;bottom:58px;
 overflow:auto;
 padding:15px;
}

.bottom{
 position:absolute;bottom:0;left:0;right:0;height:58px;
 background:#101318;
 border-top:1px solid #252b32;
 display:flex;
 align-items:center;
 justify-content:space-around;
 z-index:20;
}

.bottom button{
 border:0;background:none;color:#737b84;
 font-size:10px;
 width:20%;
}
.bottom button b{
 display:block;font-size:19px;margin-bottom:2px;
}
.bottom button.active{color:#fff}

/* ===== ОБЩИЕ ===== */

h1,h2,h3,p{margin:0}
h1{font-size:25px}
h2{font-size:20px}
h3{font-size:15px}

.muted{color:#89919a}
.small{font-size:11px}
.green{color:#55c87a}
.red{color:#df626c}
.yellow{color:#d7b15e}

.card{
 background:#12161b;
 border:1px solid #252c34;
 border-radius:12px;
 padding:14px;
 margin-bottom:10px;
}

.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.btn{
 border:1px solid #303841;
 background:#1a2026;
 color:#fff;
 border-radius:8px;
 padding:10px 12px;
}
.btn:active{transform:scale(.98)}
.btn.main{
 background:#e8eaed;color:#090a0c;
 border-color:#e8eaed;font-weight:bold;
}
.btn.greenBtn{background:#183523;border-color:#285c3a}
.btn.redBtn{background:#35181b;border-color:#603035}

input,select{
 width:100%;
 padding:11px;
 margin-top:8px;
 border:1px solid #303841;
 background:#090b0e;
 color:white;
 border-radius:8px;
 outline:none;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.app-title{
 margin-bottom:15px;
}
.app-title p{margin-top:4px;font-size:11px;color:#858e98}

/* ===== РАБОЧИЙ СТОЛ ===== */

.desktop-widget{
 text-align:center;
 color:#adb5be;
}

.desktop-widget .big{
 font-size:60px;
 margin-bottom:12px;
}

.desktop-widget h1{
 font-size:34px;
 letter-spacing:3px;

.desktop-widget p{
 margin-top:8px;color:#777f88;font-size:12px;

 border:1px solid #293039;
 border-radius:13px;

.quick{

 gap:8px;

.quick button{

 border:1px solid #292f37;
 background:#12161b;
 color:#fff;
 border-radius:11px;

 overflow:hidden;
 padding:0;
}

.car-pic{
 height:145px;
 background:
 linear-gradient(135deg,#20262d,#0c0f13);

 align-items:center;
 justify-content:center;
 position:relative;
 font-size:65px;
}

.car-pic .city{
 position:absolute;
 left:9px;top:9px;
 padding:5px 7px;
 border-radius:5px;
 background:#050607c9;
 border:1px solid #30363e;
 font-size:10px;
}

.car-info{padding:13px}

.specgrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 margin:10px 0;
}

.spec{
 background:#181d22;
 border:1px solid #242a31;
 border-radius:6px;
 padding:7px;
 font-size:10px;
 color:#929aa3;
}
.spec b{display:block;color:#e5e7e9;margin-top:2px}

.price{
 font-size:20px;font-weight:bold;
}

.car-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:10px;
}

/* ===== ГАРАЖ ===== */

.garage-car{
 display:grid;
 grid-template-columns:70px 1fr;
 gap:11px;
}

.garage-pic{
 width:70px;height:55px;
 display:flex;align-items:center;justify-content:center;
 background:#191e24;border-radius:7px;font-size:32px;
}

.progress{
 height:6px;background:#22282f;border-radius:4px;
 overflow:hidden;margin-top:5px;
}
.progress i{
 display:block;height:100%;
 background:#58c77a;
}

.repair{
 margin-top:9px;
}

/* ===== ТОРГ ===== */

.trade-option{
 width:100%;
 text-align:left;
 margin-top:7px;
 padding:11px;
 background:#151a1f;
 border:1px solid #2a3139;
 color:#fff;
 border-radius:8px;
}

.trade-option b{display:block}
.trade-option span{
 display:block;margin-top:3px;

/* ===== МОДАЛЬНОЕ ОКНО ===== */

.modal-bg{
 position:fixed;inset:0;
 z-index:100;
 background:#000b;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal-bg.show{display:flex}

.modal{
 width:min(430px,100%);
 max-height:90vh;
 overflow:auto;
 background:#11151a;
 border:1px solid #333b44;
 border-radius:14px;
 padding:17px;
 box-shadow:0 20px 80px #000;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
}

.close{
 border:0;background:none;color:#89919a;
 font-size:25px;

/* ===== УВЕДОМЛЕНИЕ ===== */

#toast{
 position:fixed;
 z-index:200;
 left:50%;bottom:20px;
 transform:translateX(-50%) translateY(15px);
 background:#181d23;
 border:1px solid #363e47;
 padding:11px 15px;
 border-radius:8px;
 font-size:12px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 max-width:90%;
 text-align:center;
}
#toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

/* ===== АДАПТАЦИЯ ===== */

@media(max-width:600px){

 .desktop-center{inset:48px 0 0}
 .phone{

  min-height:0;border:0;border-radius:0;
 }
 .notch{display:none}
 .desktop-widget{display:none}
}

@media(min-width:601px){
 .phone{transform:scale(.94)}
}

@media(max-height:650px){
 .phone{height:100vh}
}

========================================================= */

const SAVE_KEY="AUTO_SELLER_V04";

/*
 Главное ограничение экономики:

 МАКСИМАЛЬНАЯ ЦЕНА ПРОДАЖИ =
 ФАКТИЧЕСКАЯ ЦЕНА ПОКУПКИ × 1.30

 Это проверяется непосредственно перед продажей.
*/

const MAX_SELL_MULTIPLIER=1.30;
const MAX_SAFE=Number.MAX_SAFE_INTEGER;


/* =========================================================

========================================================= */

 money:500000,
 city:"Томск",
 reputation:50,
 bought:0,
 sold:0,
 profit:0,
 garage:[],
 deposit:0,
 credit:0,
 creditInterest:0,
 history:[],
 day:1,
 salesLimit:0
};

let game=load();


function load(){
 try{
  const x=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(x)return {...defaultGame,...x};
 }catch(e){}
 return JSON.parse(JSON.stringify(defaultGame));
}

function save(){
 localStorage.setItem(SAVE_KEY,JSON.stringify(game));
 updateMoney();
}

function money(n){
 if(!Number.isFinite(n))return "0 ₽";
 return Math.floor(n).toLocaleString("ru-RU")+" ₽";
}

function numberInput(n){
 return Math.floor(n).toLocaleString("ru-RU");
}

function toast(t){
 const el=document.getElementById("toast");
 el.textContent=t;
 el.classList.add("show");
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}

function updateMoney(){
 document.getElementById("desktopMoney").textContent=money(game.money);
}

function closeModal(){
 document.getElementById("modalBg").classList.remove("show");
}

function modal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modalBg").classList.add("show");
}

function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function setActive(id){
 document.querySelectorAll(".bottom button")
 .forEach(x=>x.classList.remove("active"));
 const b=document.getElementById("b"+id);
 if(b)b.classList.add("active");
}

function openApp(name){

}

}


/*
 Важно:
 offer может принимать multiplier либо абсолютную цену.
*/

function offer(id,value){

 const car=cars.find(x=>x.id===id);
 if(!car)return;

 let proposed=value;

 if(value>0&&value<=1)
  proposed=car.price*value;

 proposed=Math.floor(proposed);

 if(proposed>=car.price){

  if(game.money>=car.price){
   closeModal();
   buyCar(car,car.price);
  }else toast("Недостаточно денег");

  return;
 }

 const ratio=proposed/car.price;

 if(ratio>=.94){

  const counter=Math.floor(
   ((proposed+car.price)/2)/1000
  )*1000;

  counterOffer(car,proposed,counter);
  return;
 }

 if(ratio>=.80){

  const counter=Math.floor(
   ((proposed+car.price*.92)/2)/1000
  )*1000;

  counterOffer(car,proposed,counter);
  return;
 }

 toast("Продавец отказался от такой цены");
 game.reputation=Math.max(0,game.reputation-1);
 save();
}

function counterOffer(car,your,counter){

 modal("Встречное предложение",`

 <div class="card">

  <p class="small muted">Вы предложили</p>
  <h2>${money(your)}</h2>

  <p class="small muted" style="margin-top:13px">
   Продавец готов отдать за
  </p>

  <h2>${money(counter)}</h2>

 </div>

 <button class="btn main"
 style="width:100%"
 onclick="acceptCounter(${car.id},${counter})">
 Купить за ${money(counter)}
 </button>

 <button class="btn"
 style="width:100%;margin-top:7px"
 onclick="trade(${car.id})">
 Продолжить торг
 </button>
 `);
}

function acceptCounter(id,price){

 const car=cars.find(x=>x.id===id);

 if(game.money<price){
  toast("Недостаточно денег");
  return;
 }

 closeModal();
 buyCar(car,price);
}

 game.money-=price;
 game.bought++;

 const owned={
  uid:Date.now()+Math.random(),
  baseId:car.id,
  name:car.name,
  year:car.year,
  mileage:car.mileage,
  power:car.power,
  city:car.city,
  emoji:car.emoji,

  purchasePrice:Math.floor(price),

  condition:car.condition,
  engine:car.engine,
  body:car.body,
  suspension:car.suspension,
  electric:car.electric,
  interior:car.interior,

  vin:car.vin,
  owners:car.owners,
  accidents:car.accidents
 };

 game.garage.push(owned);

 game.history.unshift({
  type:"Покупка",
  car:car.name,
  amount:price,
  profit:0,
  day:game.day
 });

function confirmSell(i){

 const car=game.garage[i];

 const input=document.getElementById("sellInput");

 /*
  Number() + Number.isFinite() защищают
  от NaN / Infinity.

  Ограничение проверяется ещё раз здесь,
  даже если пользователь изменит HTML
  через консоль.

 const price=Number(input.value);

  car.purchasePrice*MAX_SELL_MULTIPLIER
 );

 if(!Number.isFinite(price)){
  toast("Некорректная цена");
  return;
 }

 if(price<=0){
  toast("Цена должна быть больше нуля");
  return;
 }

 if(price>maxPrice){
  toast(
   "Нельзя! Максимум "+
   money(maxPrice)+
   " (+30% от покупки)"
  );
  return;
 }

 const profit=price-car.purchasePrice;

 game.money+=price;
 game.sold++;
 game.profit+=profit;

 game.history.unshift({
  type:"Продажа",
  car:car.name,
  amount:price,
  profit:profit,
  day:game.day
 });

 game.garage.splice(i,1);

 if(profit>0)
  game.reputation=Math.min(100,game.reputation+1);
 else
  game.reputation=Math.max(0,game.reputation-1);

 save();
 closeModal();

 toast(
  profit>=0
   ?"Продано! Прибыль "+money(profit)
   :"Продано. Убыток "+money(Math.abs(profit))
 );

 garage();
}
