<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Симулятор Перекупа Авто</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel для запуска React прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Web Audio Synthesizer
    class SoundEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
        if (!this.enabled) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playTap() { this.playTone(800, 'sine', 0.05, 0.05); }
      playCash() { 
        this.playTone(523, 'triangle', 0.1, 0.1);
        setTimeout(() => this.playTone(659, 'triangle', 0.1, 0.1), 80);
        setTimeout(() => this.playTone(784, 'triangle', 0.2, 0.15), 160);
      }
      playEngine() { this.playTone(110, 'sawtooth', 0.3, 0.15); }
      playGavel() { this.playTone(220, 'square', 0.15, 0.2); }
      playWrench() { this.playTone(400, 'triangle', 0.1, 0.1); }
      playAlert() { this.playTone(330, 'square', 0.2, 0.15); }
    }
    const sound = new SoundEngine();

    const CAR_MODELS = [
      { brand: 'ВАЗ', model: '2107 «Семёрка»', year: 2005, basePrice: 450, class: 'economy', color: '#991b1b', colorName: 'Бордовый' },
      { brand: 'Lada', model: 'Priora Хэтчбек', year: 2011, basePrice: 1200, class: 'economy', color: '#1e293b', colorName: 'Космос' },
      { brand: 'Hyundai', model: 'Solaris 1.6', year: 2014, basePrice: 3800, class: 'comfort', color: '#f8fafc', colorName: 'Белый' },
      { brand: 'Volkswagen', model: 'Passat B6', year: 2008, basePrice: 4200, class: 'comfort', color: '#334155', colorName: 'Серый металлик' },
      { brand: 'Toyota', model: 'Camry 3.5 V50', year: 2013, basePrice: 8500, class: 'comfort', color: '#0f172a', colorName: 'Черный' },
      { brand: 'BMW', model: '5-Series E39 M', year: 2001, basePrice: 5200, class: 'sports', color: '#1e1b4b', colorName: 'Синий' },
      { brand: 'Mercedes-Benz', model: 'E-Class W211', year: 2005, basePrice: 6100, class: 'comfort', color: '#475569', colorName: 'Серебро' },
      { brand: 'BMW', model: 'M5 F90 Comp', year: 2019, basePrice: 42000, class: 'sports', color: '#4c1d95', colorName: 'Фиолетовый' },
      { brand: 'Porsche', model: 'Cayenne GTS', year: 2016, basePrice: 28000, class: 'suv', color: '#831843', colorName: 'Малиновый' },
      { brand: 'Toyota', model: 'Land Cruiser 200', year: 2015, basePrice: 34000, class: 'suv', color: '#020617', colorName: 'Черный' },
      { brand: 'ГАЗ', model: '24 «Волга» Раритет', year: 1982, basePrice: 2900, class: 'retro', color: '#3f6212', colorName: 'Оливковый' }
    ];

    const SELLERS = [
      { name: 'Дядя Витя (дедушка)', type: 'grandpa', phrase: 'Дедушка только по выходным ездил!' },
      { name: 'Арсен Срочный', type: 'hasty', phrase: 'Брат, срочно нужны деньги, отдаю с торгом!' },
      { name: 'Максим Мажор', type: 'greedy', phrase: 'Машина идеал, торга нет и не будет.' },
      { name: 'Серый Перекуп', type: 'scammer', phrase: 'Не бит, не крашен, один хозяин.' }
    ];

    function generateCar(id) {
      const template = CAR_MODELS[Math.floor(Math.random() * CAR_MODELS.length)];
      const seller = SELLERS[Math.floor(Math.random() * SELLERS.length)];
      const mileage = Math.floor(Math.random() * 220000) + 40000;
      const isScam = seller.type === 'scammer' && Math.random() < 0.6;
      
      const defects = {
        engine: Math.floor(Math.random() * 40) + 60,
        gearbox: Math.floor(Math.random() * 40) + 60,
        bodywork: Math.floor(Math.random() * 40) + 60,
        hasEngineKnock: Math.random() < 0.25,
        hasGearboxSlip: Math.random() < 0.25,
        paintThickness: isScam ? 450 : Math.floor(Math.random() * 60) + 110,
        legalIssue: isScam ? 'Залог в банке' : 'Чистая'
      };

      const marketAvg = template.basePrice;
      const askingPrice = Math.round((marketAvg * (0.85 + Math.random() * 0.3)) / 50) * 50;

      return {
        id: 'car_' + id + '_' + Date.now(),
        brand: template.brand,
        model: template.model,
        year: template.year,
        color: template.color,
        colorName: template.colorName,
        mileage: mileage,
        price: askingPrice,
        marketPrice: marketAvg,
        seller: seller,
        defects: defects,
        inspection: { vin: false, paint: false },
        spentRepairs: 0,
        spentTuning: 0,
        customPrice: askingPrice,
        isListed: false
      };
    }

    function CarGraphic({ car }) {
      return (
        <div className="relative w-full h-28 bg-slate-950 flex items-center justify-center rounded-2xl border border-slate-800 overflow-hidden shadow-inner">
          <svg viewBox="0 0 320 140" className="w-56 h-24 drop-shadow-xl">
            <ellipse cx="160" cy="118" rx="130" ry="12" fill="#000" opacity="0.6" />
            <path d="M 45 92 Q 40 75 60 70 L 95 68 L 130 38 Q 145 32 185 32 L 230 36 Q 255 42 275 70 L 290 75 Q 300 85 295 95 L 25 95 Q 20 92 45 92 Z" fill={car.color} stroke="#000" strokeWidth="2" />
            <path d="M 132 40 L 102 66 L 155 66 L 155 40 Z" fill="#38bdf8" opacity="0.8" />
            <path d="M 163 40 L 163 66 L 225 66 L 215 42 Q 195 40 163 40 Z" fill="#38bdf8" opacity="0.8" />
            <circle cx="85" cy="98" r="20" fill="#1e293b" stroke="#64748b" strokeWidth="3" />
            <circle cx="240" cy="98" r="20" fill="#1e293b" stroke="#64748b" strokeWidth="3" />
          </svg>
          <div className="absolute top-2 left-2 px-2 py-0.5 rounded-md bg-black/60 text-[10px] font-mono text-slate-300">
            {car.colorName} • {car.year} г.
          </div>
        </div>
      );
    }

    function App() {
      const [money, setMoney] = useState(1500);
      const [day, setDay] = useState(1);
      const [reputation, setReputation] = useState(20);
      const [activeTab, setActiveTab] = useState('market');
      const [marketCars, setMarketCars] = useState([]);
      const [myCars, setMyCars] = useState([]);
      const [activeChatCar, setActiveChatCar] = useState(null);
      const [testDriveCar, setTestDriveCar] = useState(null);
      const [testDriveSpeed, setTestDriveSpeed] = useState(0);
      const [testDriveTime, setTestDriveTime] = useState(10);
      const [testGasPressed, setTestGasPressed] = useState(false);
      const [auctionCar, setAuctionCar] = useState(null);
      const [auctionBid, setAuctionBid] = useState(0);
      const [auctionTime, setAuctionTime] = useState(10);
      const [auctionActive, setAuctionActive] = useState(false);
      const [auctionLeader, setAuctionLeader] = useState('');
      const [stats, setStats] = useState({ bought: 0, sold: 0, profit: 0 });

      useEffect(() => {
        setMarketCars([generateCar(1), generateCar(2), generateCar(3), generateCar(4)]);
      }, []);

      const handleNextDay = () => {
        setDay(d => d + 1);
        sound.playCash();
        setMarketCars([generateCar(Date.now() + 1), generateCar(Date.now() + 2), generateCar(Date.now() + 3), generateCar(Date.now() + 4)]);
        
        const listed = myCars.filter(c => c.isListed);
        if (listed.length > 0) {
          const target = listed[Math.floor(Math.random() * listed.length)];
          const offer = Math.round(target.customPrice * (0.88 + Math.random() * 0.15));
          if (confirm(`📞 Покупатель предлагает купить ваш ${target.brand} ${target.model} за $${offer}! Продать?`)) {
            const cost = target.price + target.spentRepairs + target.spentTuning;
            const profit = offer - cost;
            setMoney(m => m + offer);
            setMyCars(cars => cars.filter(c => c.id !== target.id));
            setReputation(r => r + (profit > 0 ? 15 : 5));
            setStats(s => ({ bought: s.bought, sold: s.sold + 1, profit: s.profit + profit }));
            alert(`🎉 Продано! Прибыль: +$${profit}`);
          }
        }
      };

      const buyCar = (car, price) => {
        if (money < price) { alert('Недостаточно денег!'); return; }
        if (myCars.length >= 6) { alert('Гараж полон (макс 6)!'); return; }
        sound.playCash();
        setMoney(m => m - price);
        setMyCars(prev => [...prev, { ...car, price: price, isListed: false }]);
        setMarketCars(prev => prev.filter(c => c.id !== car.id));
        setStats(s => ({ ...s, bought: s.bought + 1 }));
        setActiveChatCar(null);
        setActiveTab('garage');
      };

      const repairCar = (carId, type, cost) => {
        if (money < cost) { alert('Не хватает денег на ремонт!'); return; }
        sound.playWrench();
        setMoney(m => m - cost);
        setMyCars(prev => prev.map(c => {
          if (c.id !== carId) return c;
          const def = { ...c.defects };
          if (type === 'engine') def.engine = 100;
          if (type === 'gearbox') def.gearbox = 100;
          if (type === 'body') def.bodywork = 100;
          return { ...c, defects: def, spentRepairs: c.spentRepairs + cost };
        }));
      };

      // Test Drive
      useEffect(() => {
        if (!testDriveCar) return;
        const interval = setInterval(() => {
          setTestDriveTime(t => t <= 1 ? 0 : t - 1);
        }, 1000);
        return () => clearInterval(interval);
      }, [testDriveCar]);

      useEffect(() => {
        if (!testDriveCar) return;
        const phys = setInterval(() => {
          setTestDriveSpeed(s => testGasPressed ? Math.min(140, s + 8) : Math.max(0, s - 5));
        }, 100);
        return () => clearInterval(phys);
      }, [testDriveCar, testGasPressed]);

      // Auction
      useEffect(() => {
        if (!auctionActive || !auctionCar || auctionTime <= 0) return;
        const timer = setInterval(() => {
          setAuctionTime(t => {
            if (t <= 1) { setAuctionActive(false); return 0; }
            if (Math.random() < 0.45 && auctionBid < auctionCar.marketPrice * 0.85) {
              setAuctionBid(b => b + 100);
              setAuctionLeader(['Илья Автоподбор', 'Артур Перекуп', 'Марат СТО'][Math.floor(Math.random() * 3)]);
              sound.playTap();
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [auctionActive, auctionCar, auctionTime, auctionBid]);

      return (
        <div className="w-full max-w-md bg-slate-900 border-2 border-slate-700 rounded-[38px] overflow-hidden shadow-2xl flex flex-col h-[94vh] relative">
          
          <div className="bg-slate-950 px-5 py-2.5 flex items-center justify-between text-xs font-mono border-b border-slate-800">
            <span className="font-bold text-amber-400">ДЕНЬ {day}</span>
            <span className="text-emerald-400 font-bold font-mono">${money.toLocaleString()}</span>
          </div>

          <div className="flex-1 overflow-y-auto p-3 space-y-3 pb-20">
            
            {activeTab === 'market' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="font-extrabold text-sm text-white">🚗 АвтоБазар</h2>
                  <button onClick={handleNextDay} className="px-3 py-1 rounded-xl bg-amber-600 text-white font-bold text-xs">
                    След. день ❯
                  </button>
                </div>

                {marketCars.map(car => (
                  <div key={car.id} className="p-3 rounded-2xl bg-slate-800 border border-slate-700 space-y-2">
                    <CarGraphic car={car} />
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="font-bold text-sm text-white">{car.brand} {car.model}</h3>
                        <p className="text-[11px] text-slate-400">{car.mileage.toLocaleString()} км • {car.seller.name}</p>
                      </div>
                      <div className="text-right">
                        <div className="text-sm font-black text-emerald-400 font-mono">${car.price}</div>
                        <span className="text-[10px] text-slate-400">Рынок: ~${car.marketPrice}</span>
                      </div>
                    </div>

                    <div className="flex gap-2 text-[10px]">
                      <button onClick={() => {
                        setTestDriveCar(car);
                        setTestDriveSpeed(0);
                        setTestDriveTime(10);
                      }} className="flex-1 py-1 rounded bg-indigo-950 border border-indigo-500/50 text-indigo-300">
                        ⏱️ Тест-драйв 10с
                      </button>
                      <button onClick={() => buyCar(car, car.price)} className="flex-1 py-1 rounded bg-emerald-600 text-white font-bold">
                        Купить за ${car.price}
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'garage' && (
              <div className="space-y-3">
                <h2 className="font-extrabold text-sm text-white">🏢 Гараж ({myCars.length}/6)</h2>
                {myCars.map(car => (
                  <div key={car.id} className="p-3 rounded-2xl bg-slate-800 border border-slate-700 space-y-2">
                    <CarGraphic car={car} />
                    <div className="flex justify-between items-start">
                      <h3 className="font-bold text-sm text-white">{car.brand} {car.model}</h3>
                      <span className="text-xs font-bold text-emerald-400">${car.customPrice}</span>
                    </div>

                    <div className="flex gap-1 text-[10px]">
                      {car.defects.engine < 100 && (
                        <button onClick={() => repairCar(car.id, 'engine', 150)} className="px-2 py-1 rounded bg-indigo-900 text-indigo-200">
                          Починить ДВС ($150)
                        </button>
                      )}
                      {car.defects.bodywork < 100 && (
                        <button onClick={() => repairCar(car.id, 'body', 200)} className="px-2 py-1 rounded bg-indigo-900 text-indigo-200">
                          Покрасить ($200)
                        </button>
                      )}
                    </div>

                    <button onClick={() => {
                      setMyCars(cars => cars.map(c => c.id === car.id ? { ...c, isListed: !c.isListed } : c));
                    }} className={`w-full py-1.5 rounded-xl text-xs font-bold ${car.isListed ? 'bg-amber-600' : 'bg-emerald-600'} text-white`}>
                      {car.isListed ? 'Снять с продажи' : 'Выставить на продажу'}
                    </button>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'auction' && (
              <div className="space-y-3">
                <h2 className="font-extrabold text-sm text-white">🔨 Аукцион</h2>
                {!auctionActive ? (
                  <button onClick={() => {
                    const car = generateCar(Date.now());
                    setAuctionCar(car);
                    setAuctionBid(Math.round(car.marketPrice * 0.4));
                    setAuctionTime(10);
                    setAuctionLeader('Старт');
                    setAuctionActive(true);
                  }} className="w-full py-3 rounded-xl bg-purple-600 font-bold text-xs text-white">
                    Запустить торги
                  </button>
                ) : (
                  <div className="p-3 bg-slate-800 rounded-xl space-y-2">
                    <CarGraphic car={auctionCar} />
                    <div className="text-center">
                      <div className="text-xl font-bold text-emerald-400 font-mono">${auctionBid}</div>
                      <span className="text-xs text-slate-400">Лидер: {auctionLeader} ({auctionTime}с)</span>
                    </div>
                    <button onClick={() => {
                      setAuctionBid(b => b + 100);
                      setAuctionLeader('Вы');
                      setAuctionTime(t => t + 3);
                    }} className="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">
                      Поднять ставку +$100
                    </button>
                    {auctionLeader === 'Вы' && (
                      <button onClick={() => { buyCar(auctionCar, auctionBid); setAuctionActive(false); }} className="w-full py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl">
                        Забрать за ${auctionBid}
                      </button>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'bank' && (
              <div className="space-y-3">
                <h2 className="font-extrabold text-sm text-white">💳 Банк</h2>
                <div className="p-4 rounded-xl bg-emerald-700 text-white font-mono text-2xl font-bold">
                  ${money.toLocaleString()}
                </div>
                <button onClick={() => { sound.playCash(); setMoney(m => m + 500); }} className="w-full py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl">
                  Взять микрозайм +$500
                </button>
              </div>
            )}
          </div>

          {/* Test Drive Modal */}
          {testDriveCar && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-700 p-4 rounded-2xl space-y-3">
                <h3 className="font-bold text-sm text-white">Тест-драйв: {testDriveTime} сек</h3>
                <div className="bg-black p-4 rounded-xl text-center">
                  <div className="text-3xl font-black text-emerald-400 font-mono">{Math.round(testDriveSpeed)} км/ч</div>
                </div>
                {testDriveTime > 0 ? (
                  <button onMouseDown={() => { setTestGasPressed(true); sound.playEngine(); }} onMouseUp={() => setTestGasPressed(false)} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">
                    ГАЗ В ПОЛ
                  </button>
                ) : (
                  <button onClick={() => setTestDriveCar(null)} className="w-full py-2 bg-emerald-600 text-white font-bold rounded-xl">
                    Завершить
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Bottom Nav */}
          <div className="absolute bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 p-2 flex justify-around text-xs font-bold">
            <button onClick={() => setActiveTab('market')} className="text-indigo-400">🚗 Базар</button>
            <button onClick={() => setActiveTab('garage')} className="text-slate-400">🏢 Гараж</button>
            <button onClick={() => setActiveTab('auction')} className="text-slate-400">🔨 Аукцион</button>
            <button onClick={() => setActiveTab('bank')} className="text-slate-400">💳 Банк</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
