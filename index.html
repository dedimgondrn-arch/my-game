
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Auto Seller</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#090b0f;
    --panel:#11151b;
    --panel2:#171c23;
    --line:#252c35;
    --text:#f1f3f5;
    --muted:#89929d;
    --accent:#e6e9ed;
    --green:#55c878;
    --red:#e45d63;
    --yellow:#d9ad55;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px),
        #090b0f;
    background-size:50px 50px;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:64px;
    position:absolute;
    left:0;
    right:0;
    top:0;
    z-index:20;
    background:rgba(9,11,15,.96);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:36px;
    height:36px;
    border:1px solid #3b424c;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    background:#151a20;
}

.brand-name{
    font-weight:700;
    letter-spacing:.5px;
}

.brand-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
}

.top-money{
    font-weight:700;
    font-size:15px;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    position:absolute;
    top:64px;
    bottom:0;
    left:0;
    right:0;
    display:flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:235px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    background:#0c0f14;
    padding:18px 12px;
}

.profile{
    padding:14px;
    margin-bottom:16px;
    border:1px solid var(--line);
    background:#11151b;
    border-radius:10px;
}

.profile-title{
    font-size:12px;
    color:var(--muted);
}

.profile-city{
    font-weight:700;
    margin-top:5px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav button{
    width:100%;
    height:46px;
    border:0;
    background:transparent;
    color:#929aa4;
    text-align:left;
    border-radius:8px;
    padding:0 13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
}

.nav button:hover{
    background:#151a20;
    color:white;
}

.nav button.active{
    background:#1b2027;
    color:white;
    border:1px solid #2c333c;
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:17px;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    flex:1;
    min-width:0;
    overflow:auto;
    scrollbar-width:thin;
}

.page{
    width:100%;
    max-width:1250px;
    margin:0 auto;
    padding:30px;
}

.page-title{
    font-size:27px;
    font-weight:700;
    letter-spacing:-.5px;
}

.page-sub{
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
    margin-bottom:25px;
}

/* =====================================================
   DASHBOARD
===================================================== */

.hero{
    min-height:240px;
    border:1px solid var(--line);
    background:
        linear-gradient(100deg,#11161d 0%,#0d1117 55%,#121820 100%);
    border-radius:12px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:18px;
}

.hero-left{
    max-width:600px;
}

.hero-label{
    color:#8e98a4;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.hero h1{
    font-size:38px;
    margin-top:10px;
    letter-spacing:-1.5px;
}

.hero p{
    color:#8c96a2;
    margin-top:12px;
    line-height:1.5;
    max-width:520px;
}

.hero-stat{
    text-align:right;
}

.hero-stat small{
    color:var(--muted);
}

.hero-money{
    font-size:31px;
    font-weight:bold;
    margin-top:5px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    border:1px solid var(--line);
    background:var(--panel);
    padding:18px;
    border-radius:10px;
}

.stat small{
    color:var(--muted);
    font-size:12px;
}

.stat strong{
    display:block;
    margin-top:9px;
    font-size:23px;
}

/* =====================================================
   MARKET
===================================================== */

.market-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.filter{
    border:1px solid var(--line);
    background:var(--panel);
    color:#aeb5bd;
    padding:10px 13px;
    border-radius:7px;
    font-size:12px;
}

.car-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.car-card{
    border:1px solid var(--line);
    background:#101419;
    border-radius:11px;
    overflow:hidden;
    transition:.15s;
}

.car-card:hover{
    border-color:#3a424d;
    transform:translateY(-2px);
}

.car-image{
    height:190px;
    background:
        linear-gradient(145deg,#20262e,#0e1115);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.car-image::after{
    content:"";
    position:absolute;
    width:180px;
    height:70px;
    background:rgba(255,255,255,.025);
    filter:blur(25px);
    transform:rotate(-15deg);
}

.car-emoji{
    font-size:85px;
    filter:grayscale(.8);
    position:relative;
    z-index:2;
}

.car-city{
    position:absolute;
    left:12px;
    top:12px;
    z-index:3;
    background:rgba(0,0,0,.55);
    border:1px solid #363d46;
    border-radius:5px;
    padding:5px 8px;
    font-size:11px;
}

.car-body{
    padding:16px;
}

.car-name{
    font-size:19px;
    font-weight:bold;
}

.car-year{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:14px;
}

.spec{
    background:#151a20;
    border:1px solid #20262e;
    padding:8px;
    border-radius:6px;
    font-size:11px;
    color:#adb5be;
}

.price-row{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:end;
}

.price{
    font-size:22px;
    font-weight:bold;
}

.seller{
    color:var(--muted);
    font-size:11px;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:13px;
}

.btn{
    border:1px solid #303741;
    background:#1a2027;
    color:white;
    border-radius:7px;
    padding:11px 12px;
    cursor:pointer;
    font-size:12px;
}

.btn:hover{
    background:#222932;
}

.btn-main{
    flex:1;
    background:#e8eaed;
    border-color:#e8eaed;
    color:#111;
    font-weight:bold;
}

.btn-main:hover{
    background:white;
}

/* =====================================================
   GARAGE
===================================================== */

.garage-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.garage-car{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:18px;
}

.garage-photo{
    width:130px;
    height:85px;
    background:#171c22;
    border:1px solid #282f38;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
}

.garage-info{
    flex:1;
}

.garage-info h3{
    font-size:17px;
}

.garage-info p{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

/* =====================================================
   BANK
===================================================== */

.bank-balance{
    border:1px solid var(--line);
    background:linear-gradient(120deg,#11181a,#0f1515);
    border-radius:11px;
    padding:25px;
    margin-bottom:15px;
}

.bank-balance small{
    color:var(--muted);
}

.bank-number{
    font-size:35px;
    font-weight:bold;
    margin-top:8px;
}

.bank-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.bank-box{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:20px;
}

.bank-box h3{
    font-size:15px;
}

.bank-box p{
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}

.bank-value{
    font-size:23px;
    font-weight:bold;
    margin-top:15px;
}

/* =====================================================
   CITY
===================================================== */

.city-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.city{
    border:1px solid var(--line);
    background:var(--panel);
    padding:20px;
    border-radius:10px;
}

.city h3{
    font-size:18px;
}

.city p{
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}

.city button{
    width:100%;
    margin-top:17px;
}

/* =====================================================
   TABLE
===================================================== */

.table{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    overflow:hidden;
}

.table-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    font-size:12px;
}

.table-row:last-child{
    border-bottom:0;
}

.table-head{
    color:var(--muted);
    background:#0d1116;
}

/* =====================================================
   MODAL
===================================================== */

.modal-bg{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:520px;
    background:#11151b;
    border:1px solid #303741;
    border-radius:12px;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    overflow:hidden;
}

.modal-head{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
}

.modal-head h2{
    font-size:18px;
}

.close{
    border:0;
    background:transparent;
    color:#89929d;
    font-size:22px;
    cursor:pointer;
}

.modal-body{
    padding:20px;
}

.modal-car{
    display:flex;
    gap:15px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
}

.modal-photo{
    width:120px;
    height:80px;
    border-radius:7px;
    background:#181e25;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.modal-car h3{
    margin-top:5px;
}

.modal-car p{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.trade-current{
    margin-top:20px;
    color:var(--muted);
    font-size:12px;
}

.trade-price{
    font-size:27px;
    font-weight:bold;
    margin-top:5px;
}

.input{
    width:100%;
    margin-top:15px;
    background:#0b0e12;
    border:1px solid #303741;
    color:white;
    border-radius:7px;
    padding:13px;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#69727d;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions .btn{
    flex:1;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    z-index:200;
    right:22px;
    bottom:22px;
    background:#151a20;
    border:1px solid #303741;
    color:white;
    padding:13px 16px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .topbar{
        height:58px;
        padding:0 14px;
    }

    .brand-sub{
        display:none;
    }

    .top-money{
        font-size:13px;
    }

    .main{
        top:58px;
    }

    .sidebar{
        position:absolute;
        left:0;
        right:0;
        bottom:0;
        height:65px;
        width:100%;
        z-index:30;
        padding:5px;
        border-right:0;
        border-top:1px solid var(--line);
        background:#0b0e12;
    }

    .profile{
        display:none;
    }

    .nav{
        height:100%;
        flex-direction:row;
        justify-content:space-around;
    }

    .nav button{
        height:54px;
        width:auto;
        flex:1;
        padding:0;
        justify-content:center;
        flex-direction:column;
        gap:1px;
        font-size:9px;
        border-radius:6px;
    }

    .nav-icon{
        font-size:18px;
    }

    .content{
        padding-bottom:65px;
    }

    .page{
        padding:20px 13px 30px;
    }

    .page-title{
        font-size:24px;
    }

    .hero{
        min-height:210px;
        padding:20px;
        display:block;
    }

    .hero h1{
        font-size:29px;
    }

    .hero-stat{
        text-align:left;
        margin-top:25px;
    }

    .hero-money{
        font-size:26px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .car-grid{
        grid-template-columns:1fr;
    }

    .car-image{
        height:205px;
    }

    .city-grid{
        grid-template-columns:1fr;
    }

    .bank-grid{
        grid-template-columns:1fr;
    }

    .garage-car{
        padding:10px;
        gap:10px;
    }

    .garage-photo{
        width:95px;
        height:70px;
        font-size:38px;
    }

    .table-row{
        grid-template-columns:1.5fr 1fr 1fr;
    }

    .table-row div:nth-child(4){
        display:none;
    }

    .modal-bg{
        align-items:flex-end;
        padding:0;
    }

    .modal{
        max-width:none;
        border-radius:15px 15px 0 0;
    }

    .toast{
        left:12px;
        right:12px;
        bottom:80px;
        text-align:center;
    }
}
</style>
</head>

<body>

<div id="app">

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                AS
            </div>

            <div>
                <div class="brand-name">
                    AUTO SELLER
                </div>

                <div class="brand-sub">
                    Симулятор автомобильного бизнеса
                </div>
            </div>

        </div>

        <div class="top-money" id="topMoney">
            500 000 ₽
        </div>

    </header>


    <main class="main">

        <aside class="sidebar">

            <div class="profile">

                <div class="profile-title">
                    ТЕКУЩЕЕ МЕСТОПОЛОЖЕНИЕ
                </div>

                <div class="profile-city" id="sideCity">
                    Томск
                </div>

            </div>


            <nav class="nav">

                <button onclick="openPage('home')" id="nav-home">
                    <span class="nav-icon">⌂</span>
                    Главная
                </button>

                <button onclick="openPage('market')" id="nav-market">
                    <span class="nav-icon">🚗</span>
                    Авторынок
                </button>

                <button onclick="openPage('garage')" id="nav-garage">
                    <span class="nav-icon">▣</span>
                    Гараж
                </button>

                <button onclick="openPage('bank')" id="nav-bank">
                    <span class="nav-icon">₽</span>
                    Банк
                </button>

                <button onclick="openPage('cities')" id="nav-cities">
                    <span class="nav-icon">◎</span>
                    Города
                </button>

                <button onclick="openPage('stats')" id="nav-stats">
                    <span class="nav-icon">▥</span>
                    Статистика
                </button>

                <button onclick="openPage('settings')" id="nav-settings">
                    <span class="nav-icon">⚙</span>
                    Настройки
                </button>

            </nav>

        </aside>


        <section class="content" id="content"></section>

    </main>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modalBg">

    <div class="modal">

        <div class="modal-head">

            <h2 id="modalTitle">
                Торг
            </h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <div class="modal-body" id="modalBody"></div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

const DEFAULT_GAME = {

    money:500000,

    city:"Томск",

    bought:0,

    sold:0,

    profit:0,

    garage:[],

    deposit:0,

    credit:0,

    creditInterest:0,

    history:[]

};

let game =
    JSON.parse(localStorage.getItem("AUTO_SELLER_SAVE"))
    || JSON.parse(JSON.stringify(DEFAULT_GAME));


function save(){

    localStorage.setItem(
        "AUTO_SELLER_SAVE",
        JSON.stringify(game)
    );

    updateHeader();
}


/* =====================================================
   УТИЛИТЫ
===================================================== */

function money(n){

    return Math.floor(n).toLocaleString("ru-RU")+" ₽";

}


function toast(text){

    const el=document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{

        el.classList.remove("show");

    },2300);

}


function updateHeader(){

    document.getElementById("topMoney").textContent=money(game.money);

    document.getElementById("sideCity").textContent=game.city;

}


/* =====================================================
   МАШИНЫ
===================================================== */

const cars=[

    {
        id:1,
        name:"Lada Priora",
        year:2012,
        mileage:164000,
        power:98,
        condition:"Хорошее",
        city:"Томск",
        price:185000,
        seller:"Алексей",
        emoji:"🚘"
    },

    {
        id:2,
        name:"Lada 2114",
        year:2010,
        mileage:198000,
        power:81,
        condition:"Среднее",
        city:"Москва",
        price:145000,
        seller:"Сергей",
        emoji:"🚗"
    },

    {
        id:3,
        name:"Lada Granta",
        year:2017,
        mileage:97000,
        power:106,
        condition:"Отличное",
        city:"Санкт-Петербург",
        price:395000,
        seller:"Илья",
        emoji:"🚙"
    },

    {
        id:4,
        name:"Lada Vesta",
        year:2019,
        mileage:82000,
        power:106,
        condition:"Хорошее",
        city:"Новосибирск",
        price:620000,
        seller:"Максим",
        emoji:"🚘"
    },

    {
        id:5,
        name:"Toyota Camry",
        year:2011,
        mileage:205000,
        power:181,
        condition:"Среднее",
        city:"Москва",
        price:790000,
        seller:"Роман",
        emoji:"🚗"
    },

    {
        id:6,
        name:"BMW 3 Series",
        year:2008,
        mileage:230000,
        power:218,
        condition:"Требует ремонта",
        city:"Томск",
        price:530000,
        seller:"Дмитрий",
        emoji:"🚙"
    }

];


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

function openPage(page){

    document.querySelectorAll(".nav button")
        .forEach(x=>x.classList.remove("active"));

    const nav=document.getElementById("nav-"+page);

    if(nav) nav.classList.add("active");


    if(page==="home") renderHome();

    if(page==="market") renderMarket();

    if(page==="garage") renderGarage();

    if(page==="bank") renderBank();

    if(page==="cities") renderCities();

    if(page==="stats") renderStats();

    if(page==="settings") renderSettings();


    updateHeader();

}


/* =====================================================
   ГЛАВНАЯ
===================================================== */

function renderHome(){

    document.getElementById("content").innerHTML=`

        <div class="page">

    `;


    document.getElementById("modalBg")

/* =====================================================
   ПРЕДЛОЖЕНИЕ
===================================================== */

function makeOffer(id){

    const car=cars.find(x=>x.id===id);

    if(!car) return;


    const input=document.getElementById("tradeInput");

    const offer=Number(input.value);


    if(!Number.isFinite(offer)||offer<=0){

        toast("Введите корректную сумму");

        return;

    }


    if(offer>=car.price){

        closeModal();

        purchaseCar(car,car.price);

        return;

    }


    /*
        Логика переговоров.

        Чем ближе предложение к цене продавца,
        тем выше шанс согласия.
    */

    const ratio=offer/car.price;


    if(ratio>=.95){

        closeModal();

        showCounterOffer(car,offer);

        return;

    }


    if(ratio>=.85){

        const roll=Math.random();

        if(roll<.65){

            closeModal();

            showCounterOffer(car,offer);

        }else{

            closeModal();

            toast(
                "Продавец отказался. Слишком низкая цена."
            );

        }

        return;

    }


    if(ratio>=.75){

        closeModal();

        toast(
            "Продавец: «Нет, за такие деньги не отдам»"
        );

        return;

    }


    closeModal();

    toast(
        "Продавец отказался от переговоров."
    );

}


/* =====================================================
   ВСТРЕЧНОЕ ПРЕДЛОЖЕНИЕ
===================================================== */

function showCounterOffer(car,offer){

    /*
        Продавец делает встречную цену.
        Чем ниже предложение игрока,
        тем выше встречная цена.
    */

    let counter=Math.round(
        (offer+car.price)/2/1000
    )*1000;


    if(counter>=car.price){
        counter=car.price-1000;
    }


    document.getElementById("modalTitle")
        .textContent="Встречное предложение";


    document.getElementById("modalBody").innerHTML=`

        <div class="modal-car">

            <div class="modal-photo">
                ${car.emoji}
            </div>

            <div>

                <div style="color:#89929d;font-size:11px">
                    ${car.seller}
                </div>

                <h3>
                    ${car.name}
                </h3>

                <p>
                    «Могу немного уступить»
                </p>

            </div>

        </div>


        <div class="trade-current">
            Ваше предложение
        </div>

        <div style="font-size:18px;margin-top:4px">
            ${money(offer)}
        </div>


        <div class="trade-current"
             style="margin-top:18px">

            Встречное предложение продавца

        </div>

        <div class="trade-price">
            ${money(counter)}
        </div>


        <div class="modal-actions">

            <button
                class="btn"
                onclick="continueTrade(${car.id},${offer},${counter})">

                Ещё торг

            </button>

            <button
                class="btn btn-main"
                onclick="acceptOffer(${car.id},${counter})">

                Согласиться

            </button>

        </div>

    `;


    document.getElementById("modalBg")
        .classList.add("show");

}

   ПРОДОЛЖИТЬ ТОРГ
===================================================== */

function continueTrade(id,oldOffer,counter){

    const car=cars.find(x=>x.id===id);

    document.getElementById("modalTitle")
        .textContent="Продолжаем торг";


    document.getElementById("modalBody").innerHTML=`

        <div style="color:#89929d;font-size:13px">
            Продавец предлагает:
        </div>

        <div style="
            font-size:28px;
            font-weight:bold;
            margin-top:6px;
        ">
            ${money(counter)}
        </div>

        <input
            class="input"
            id="tradeInput2"
            type="number"
            placeholder="Новая цена"
            value="${Math.floor((oldOffer+counter)/2/1000)*1000}"
        >

        <div class="modal-actions">

            <button
                class="btn"
                onclick="closeModal()">

                Уйти

            </button>

            <button
                class="btn btn-main"
                onclick="secondOffer(${car.id},${counter})">

                Предложить

            </button>

        </div>

    `;

}


function secondOffer(id,counter){

    const car=cars.find(x=>x.id===id);

    const offer=Number(
        document.getElementById("tradeInput2").value
    );


    if(!Number.isFinite(offer)||offer<=0){

        toast("Введите цену");

        return;

    }


    if(offer>=counter){

        acceptOffer(id,counter);

        return;

    }


    const difference=counter-offer;


    if(difference<=counter*.05){

        closeModal();

        showCounterOffer(car,offer);

    }else{

        closeModal();

        toast(
            "Продавец: «Ниже уже не получится»"
        );

    }

}

function purchaseCar(car,price){

    if(car.city!==game.city){

        toast(
            "Сначала нужно приехать в "+car.city
        );

        return;

    }


    if(game.money<price){

        toast("Недостаточно денег");

        return;

    }


    game.money-=price;

    game.bought++;


    game.garage.push({

        ...car,

        purchasePrice:price,

        purchaseCity:game.city,

        idOwned:Date.now()+Math.random()

    });


    game.history.unshift({

        type:"Покупка",

        car:car.name,

        amount:price,

        date:new Date().toLocaleString("ru-RU")

    });


    save();


    toast(
        car.name+" куплена за "+money(price)
    );


    openPage("garage");

}

    const price=Number(

    if(!Number.isFinite(price)||price<=0){

    game.money+=price;

    game.history.unshift({

        car:car.name,

function deposit(){

    const amount=Number(
        prompt("Сколько внести на депозит?")
    );


    if(!Number.isFinite(amount)||amount<=0)
        return;


    if(amount>game.money){

        toast("Недостаточно денег");

        return;

    }


    game.money-=amount;

    game.deposit+=amount;

    save();

    toast(
        "Внесено "+money(amount)
    );

    renderBank();

}


function withdrawDeposit(){

    if(game.deposit<=0){

        toast("Депозит пуст");

        return;

    }


    const amount=Number(
        prompt(
            "Доступно: "+money(game.deposit)+
            "\nСколько снять?"
        )
    );


    if(!Number.isFinite(amount)||amount<=0)
        return;


    if(amount>game.deposit){

        toast("Недостаточно средств");

        return;

    }


    game.deposit-=amount;

    game.money+=amount;

    save();

    toast(
        "Получено "+money(amount)
    );

    renderBank();

}


function takeCredit(){

    if(game.credit>0){

        toast(
            "Сначала погасите текущий кредит"
        );

        return;

    }


    const amount=Number(
        prompt("Сколько взять в кредит? Максимум 1 000 000 ₽")
    );


    if(!Number.isFinite(amount)||amount<=0)
        return;


    if(amount>1000000){

        toast("Лимит кредита: 1 000 000 ₽");

        return;

    }


    game.credit=amount;

    game.money+=amount;

    save();

    toast(
        "Кредит получен: "+money(amount)
    );

    renderBank();

}


function repayCredit(){

    if(game.credit<=0){

        toast("Кредита нет");

        return;

    }


    const amount=Number(
        prompt(
            "Долг: "+money(game.credit)+
            "\nСколько погасить?"
        )
    );


    if(!Number.isFinite(amount)||amount<=0)
        return;


    if(amount>game.money){

        toast("Недостаточно денег");

        return;

    }


    if(amount>game.credit){

        toast("Сумма больше долга");

        return;

    }


    game.money-=amount;

    game.credit-=amount;

    save();

    toast(
        "Погашено "+money(amount)
    );

    renderBank();

}
