<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Жизни + Криптобиржа</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; color: #94a3b8; font-size: 1.2rem; text-transform: uppercase; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }

        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #334155;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .item-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background-color: #000;
        }

        .item-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Виджет Криптобиржи */
        .crypto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-badge {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .trend-up { color: var(--green); }
        .trend-down { color: var(--red); }
        
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin-top: 15px;
        }

        .crypto-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .crypto-controls input {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 8px;
            border-radius: 6px;
            width: 100px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Левая колонка: Профиль и Состояние -->
    <div>
        <div class="card">
            <h2>Профиль</h2>
            <p>Баланс: <b id="money">$10,000</b></p>
            <p>Биткоины: <b id="btc-balance">0 BTC</b></p>
        </div>

        <!-- Биржа Биткоин -->
        <div class="card">
            <div class="crypto-header">
                <h2>Криптобиржа (BTC)</h2>
                <div id="trend-indicator" class="price-badge trend-up">▲</div>
            </div>
            <div>Текущая цена: <span id="btc-price" class="price-badge">$30,000</span></div>
            <small id="btc-change" style="color: var(--green);">+0.00% (за 30 сек)</small>

            <div class="chart-container">
                <canvas id="btcChart"></canvas>
            </div>

            <div class="crypto-controls">
                <input type="number" id="btc-amount" value="0.1" step="0.01" min="0.01">
                <button class="btn btn-green" onclick="buyCrypto()">Купить</button>
                <button class="btn btn-red" onclick="sellCrypto()">Продать</button>
            </div>
        </div>
    </div>

    <!-- Правая колонка: Магазины и Имущество -->
    <div>
        <div class="card">
            <h2>Автосалон</h2>
            <div class="grid" id="cars-list"></div>
        </div>

        <div class="card">
            <h2>Недвижимость</h2>
            <div class="grid" id="houses-list"></div>
        </div>

        <div class="card">
            <h2>Бизнес</h2>
            <div class="grid" id="business-list"></div>
        </div>
    </div>
</div>

<script>
    // --- ДАННЫЕ ИГРОКА ---
    let player = {
        money: 10000,
        btc: 0
    };

    // --- БАЗА ДАННЫХ ТОВАРОВ (Исправлены URL картинок) ---
    const CARS = [
        { id: 1, name: "Седан", price: 3000, img: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=400" },
        { id: 2, name: "Спорткар", price: 25000, img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=400" }
    ];

    const HOUSES = [
        { id: 1, name: "Квартира", price: 15000, img: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400" },
        { id: 2, name: "Вилла", price: 80000, img: "https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400" }
    ];

    const BUSINESSES = [
        { id: 1, name: "Кофейня", price: 5000, img: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=400" },
        { id: 2, name: "IT-Стартап", price: 40000, img: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=400" }
    ];

    // --- ОТРЕСОВКА ТОВАРОВ ---
    function renderMarket(items, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = items.map(item => `
            <div class="item-card">
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/200x120?text=No+Image'">
                <div class="item-info">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>$${item.price.toLocaleString()}</small>
                    </div>
                    <button class="btn" style="margin-top:8px;" onclick="buyItem(${item.price})">Купить</button>
                </div>
            </div>
        `).join('');
    }

    function buyItem(price) {
        if (player.money >= price) {
            player.money -= price;
            updateUI();
            alert("Успешная покупка!");
        } else {
            alert("Недостаточно денег!");
        }
    }

    function updateUI() {
        document.getElementById('money').innerText = '$' + player.money.toLocaleString();
        document.getElementById('btc-balance').innerText = player.btc.toFixed(4) + ' BTC';
    }

    // --- ЛОГИКА КРИПТОБИРЖИ (БИТКОИН) ---
    let btcPrice = 30000;
    let priceHistory = [29500, 29800, 30000];
    let labelHistory = ['-1.5m', '-1m', 'Сейчас'];

    // Инициализация Chart.js
    const ctx = document.getElementById('btcChart').getContext('2d');
    const btcChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labelHistory,
            datasets: [{
                label: 'Курс BTC ($)',
                data: priceHistory,
                borderColor: '#22c55e',
                borderWidth: 2,
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
            }
        }
    });

    // Таймер обновления биткоина каждые 30 секунд
    setInterval(updateCryptoPrice, 30000);

    function updateCryptoPrice() {
        let oldPrice = btcPrice;
        // Колебание от -15% до +15%
        let changePercent = (Math.random() * 30 - 15); 
        btcPrice = Math.max(1000, Math.round(btcPrice * (1 + changePercent / 100)));

        // Обновление UI
        document.getElementById('btc-price').innerText = '$' + btcPrice.toLocaleString();
        
        let changeElem = document.getElementById('btc-change');
        let trendElem = document.getElementById('trend-indicator');

        if (btcPrice >= oldPrice) {
            trendElem.innerText = '▲';
            trendElem.className = 'price-badge trend-up';
            changeElem.style.color = 'var(--green)';
            changeElem.innerText = `+${changePercent.toFixed(2)}% (за 30 сек)`;
            btcChart.data.datasets[0].borderColor = '#22c55e';
        } else {
            trendElem.innerText = '▼';
            trendElem.className = 'price-badge trend-down';
            changeElem.style.color = 'var(--red)';
            changeElem.innerText = `${changePercent.toFixed(2)}% (за 30 сек)`;
            btcChart.data.datasets[0].borderColor = '#ef4444';
        }

        // Обновление графика
        priceHistory.push(btcPrice);
        labelHistory.push('');
        if (priceHistory.length > 10) {
            priceHistory.shift();
            labelHistory.shift();
        }
        btcChart.update();
    }

    function buyCrypto() {
        let amount = parseFloat(document.getElementById('btc-amount').value);
        let cost = amount * btcPrice;
        if (isNaN(amount) || amount <= 0) return;

        if (player.money >= cost) {
            player.money -= cost;
            player.btc += amount;
            updateUI();
        } else {
            alert("Недостаточно средств для покупки!");
        }
    }

    function sellCrypto() {
        let amount = parseFloat(document.getElementById('btc-amount').value);
        if (isNaN(amount) || amount <= 0) return;

        if (player.btc >= amount) {
            player.btc -= amount;
            player.money += amount * btcPrice;
            updateUI();
        } else {
            alert("У вас нет столько BTC!");
        }
    }

    // Старт
    renderMarket(CARS, 'cars-list');
    renderMarket(HOUSES, 'houses-list');
    renderMarket(BUSINESSES, 'business-list');
    updateUI();
</script>

</body>
</html>
