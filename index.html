.br-box{flex:1;min-width:0}.br-name{font-weight:800;font-size:15px;line-height:1.1}.br-sub{font-size:11px;color:var(--mu)}

.sr{position:relative;margin:10px 0 4px}

.ntf-box,.lg{position:relative;flex:none}
.ntf-pop,.lp{position:absolute;right:0;top:calc(100% + 10px);background:#16161e;border:1px solid var(--line);border-radius:18px;padding:12px;display:none;min-width:260px;box-shadow:0 10px 40px rgba(0,0,0,0.8);z-index:40}.ntf-pop.o,.lp.o{display:block}

main{max-width:768px;margin:auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}

.promo-banner{position:relative;border-radius:20px;overflow:hidden;margin:16px 0;padding:20px;border:1px solid var(--line);background:linear-gradient(135deg, #1c0f08 0%, #0e0e14 100%)}

.promo-bag-ic{width:80px;height:80px;background:linear-gradient(135deg,#ff7a00,#ff9500);border-radius:20px;transform:rotate(12deg);display:grid;place-items:center;font:900 42px var(--d);color:#000;box-shadow:0 0 30px rgba(255,122,0,0.4)}

.cat-scroll{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.cat-item{flex:0 0 105px;height:92px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px;text-align:center;transition:all .2s}

.im{aspect-ratio:1;border-radius:14px;background:#0b0b0e;display:grid;place-items:center;font-size:42px;overflow:hidden;position:relative}
.im img{width:100%;height:100%;object-fit:cover}
.cb{padding:8px 4px 4px;display:flex;flex-direction:column;gap:2px}
.ct{font-size:11px;color:var(--a);font-weight:700}
.nm{font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.pr{font:800 16px var(--f);color:var(--a);display:flex;align-items:center;gap:6px;margin-top:6px}
.old-pr{font-size:12px;color:var(--mu);text-decoration:line-through}
.disc-badge{background:var(--a);color:#000;font:800 10px var(--f);padding:1px 5px;border-radius:4px}

.perks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.pk-item{display:flex;align-items:center;gap:10px;padding:6px}
.pk-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,122,0,0.1);display:grid;place-items:center;color:var(--a);font-size:16px}
.pk-tx b{display:block;font-size:12px}.pk-tx span{font-size:10px;color:var(--mu)}

.emp{text-align:center;color:var(--mu);padding:40px 10px;border:1px dashed var(--line);border-radius:18px}
.pan{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.det{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}

.th{display:flex;gap:8px;margin-top:10px;overflow-x:auto}.th img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;flex:none}.th img.on{border-color:var(--a)}

.chat{display:flex;flex-direction:column;height:calc(100dvh - 240px);min-height:300px}
.ms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:#262633;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#ff7a00,#ff9500);color:#000;font-weight:600}
.m.sf{border:1px solid var(--a)}
.cf{display:flex;gap:8px;margin-top:8px;align-items:center}
.row{display:flex;gap:10px}.row>*{flex:1}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,11,14,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
nav button{position:relative;flex:1;flex-direction:column;gap:2px;padding:4px 0;font-size:10px;border:0;background:none;box-shadow:none;color:var(--mu);font-weight:600}

nav button.on{color:var(--a)}

.nb{position:absolute;top:0;right:20%;min-width:16px;height:16px;border-radius:99px;background:var(--a);color:#000;font:800 9px var(--f);display:grid;place-items:center;padding:0 3px}

.mo{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}.mo.o{display:flex}
.sheet{width:min(560px,100%);max-height:92dvh;overflow:auto;background:#16161e;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 18px var(--f);margin:0 0 10px}
.ty{position:fixed;left:50%;bottom:calc(85px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1f1f2a;border:1px solid var(--line);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:90;font-size:13px}.ty.o{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.pill{display:inline-block;font:700 11px var(--f);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);margin-right:4px}.pill.g{color:var(--a);border-color:var(--a)}.pill.o{color:var(--b);border-color:var(--b)}
.auth-tabs{display:flex;gap:6px;margin:12px 0}

.av{width:64px;height:64px;flex:none;border-radius:99px;display:grid;place-items:center;font:700 24px var(--d);color:var(--a);background:#0b0b0e;border:2px solid var(--a)}

.steps{display:flex;gap:6px;margin-bottom:10px}.steps i{flex:1;font-style:normal;border-top:3px solid var(--line);padding-top:4px;font-size:11px;color:var(--mu);text-align:center}.steps i.on{border-color:var(--a);color:var(--a)}

function playBeep(freq=600, dur=0.08){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e){}
}

function createLocalDB() {
  const store = (k, val) => val !== undefined ? LS('db_' + k, JSON.stringify(val)) : JSON.parse(LS('db_' + k) || '[]');
  const listenMap = {};
  const notify = (col) => { if(listenMap[col]) listenMap[col].forEach(cb => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) })); };
  return {
    collection: function(col) {
      return {
        onSnapshot: (cb) => {
          if(!listenMap[col]) listenMap[col] = [];
          listenMap[col].push(cb);
          setTimeout(() => cb({ docs: store(col).map(d => ({ id: d.id, data: () => d })) }), 0);
          return () => { listenMap[col] = listenMap[col].filter(x => x !== cb); };
        },
        where: function(field, op, val) {
          return {
            onSnapshot: (cb) => {
              const filterDocs = () => store(col).filter(d => op === '==' ? d[field] === val : true);
              setTimeout(() => cb({ docs: filterDocs().map(d => ({ id: d.id, data: () => d })) }), 0);
              return () => {};
            }
          };
        },
        doc: function(id) {
          return {
            set: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) arr[idx] = { ...arr[idx], ...data, id };
              else arr.push({ ...data, id });
              store(col, arr); notify(col);
            },
            update: async (data) => {
              let arr = store(col);
              const idx = arr.findIndex(x => x.id === id);
              if(idx >= 0) { arr[idx] = { ...arr[idx], ...data }; store(col, arr); notify(col); }
            },
            delete: async () => {
              let arr = store(col).filter(x => x.id !== id);
              store(col, arr); notify(col);
            },
            onSnapshot: (cb) => {
              const d = store(col).find(x => x.id === id);
              cb({ exists: !!d, data: () => d });
              return () => {};
            }
          };
        }
      };
    }
  };
}

async function act(k) {
  const v = view; if(isBan()) { toast(t("banned")); return; }
  try {
    if(k === "open") await setDeal("open", "m_open");
    else if(k === "sent") await setDeal("sent", "m_sent");
    else if(k === "got") { await setDeal("confirmed", "m_got"); reviewSheet(); }
    else if(k === "cancel") { if(await ask(t("dCancel") + "?")) await setDeal("cancelled", "m_cancel"); }
    else if(k === "disp") {
      if(await ask(t("dDisp") + "?")) {
        await setDeal("dispute", "m_disp"); const n = Date.now();
        await db.collection("tickets").doc(uidn()).set({ uid, text: "⚠ " + t("dDisp") + ": «" + v.title + "» (" + v.tid + ")", ts: n, last: n, status: "open" });
        go("support");
      }
    }
    else if(k === "rev") reviewSheet();
  } catch(x) { toast("!"); }
}

const CODE_H = "e700cd1d4d864992e889c7e6d0176842a53b158c2a1bd5685eb4e7a4c8a6b5ee";
async function sha(x) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("noir-market:" + x)); return [...new Uint8Array(b)].map(z => z.toString(16).padStart(2, "0")).join(""); }

async function prep(f, max, qv) {
  let b; try { b = await createImageBitmap(f); } catch(x) { b = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); }); }
  const w = b.width || b.naturalWidth, h = b.height || b.naturalHeight, s = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s); const x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height); x.drawImage(b, 0, 0, c.width, c.height);
  return new Promise((ok, no) => c.toBlob(r => r ? ok(r) : no(), "image/jpeg", qv));
}

async function upl(f) {
  if(as) { try { const r = await as.upload(await prep(f, 1100, .82)); return "/_blob/" + r.id; } catch(x) {} }
  const bl = await prep(f, 400, .5); return await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(bl); });
}

function ups() {
  $("#up").innerHTML = ph.map((u, i) => `<div class="p"><img src="${u}" alt=""><b data-x="${i}">✕</b></div>`).join("") + (ph.length < 5 ? '<label class="add" for="fl">＋</label>' : "");
  $("#up").querySelectorAll("[data-x]").forEach(b => b.onclick = () => { ph.splice(+b.dataset.x, 1); ups(); });
}

$("#fl").onchange = async ev => {
  const fs = [...ev.target.files].slice(0, 5 - ph.length); ev.target.value = "";
  for(const f of fs) {
    try {
      const u = await upl(f);
      if(ph.reduce((s, z) => s + (z.startsWith("data:") ? z.length : 0), 0) + (u.startsWith("data:") ? u.length : 0) > 190000) { toast(t("pBig")); break; }
      ph.push(u); ups();
    } catch(x) { toast(t("pFail")); }
  }
};

/* Настоящая регистрация / авторизация */
let isRegMode = false;
let authMethod = "tg";

$("#authBtn").onclick = () => {
  if(userAuth) {
    go("profile", { id: uid });
  } else {
    $("#authMo").classList.add("o");
  }
};
$("#authClose").onclick = () => $("#authMo").classList.remove("o");

const setAuthTab = (m, label, placeholder) => {
  authMethod = m;
  $("#atTg").className = m === "tg" ? "gh on" : "gh";
  $("#atPh").className = m === "ph" ? "gh on" : "gh";
  $("#atEm").className = m === "em" ? "gh on" : "gh";
  $("#authBox").innerHTML = `<label class="l">${label}</label><input id="auVal" placeholder="${placeholder}" required>`;
};

$("#atTg").onclick = (ev) => { ev.preventDefault(); setAuthTab("tg", "Telegram Username", "@username"); };
$("#atPh").onclick = (ev) => { ev.preventDefault(); setAuthTab("ph", "Номер телефона", "+7 900 000 00-00"); };
$("#atEm").onclick = (ev) => { ev.preventDefault(); setAuthTab("em", "E-mail адрес", "example@mail.ru"); };

$("#toggleRegBtn").onclick = (ev) => {
  ev.preventDefault();
  isRegMode = !isRegMode;
  $("#authTitle").textContent = isRegMode ? "Регистрация нового аккаунта" : "Вход в аккаунт";
  $("#authSubmitBtn").textContent = isRegMode ? "Зарегистрироваться" : "Войти";
  $("#toggleRegBtn").textContent = isRegMode ? "Уже есть аккаунт? Войти" : "Создать новый аккаунт";
  $("#auNameLbl").style.display = isRegMode ? "block" : "none";
  $("#auName").style.display = isRegMode ? "block" : "none";
  if(isRegMode) $("#auName").required = true; else $("#auName").required = false;
};

$("#authFm").onsubmit = async (ev) => {
  ev.preventDefault();
  const val = $("#auVal").value.trim().toLowerCase();
  const pass = $("#auPass").value.trim();
  const name = $("#auName").value.trim();
  
  if(!val || !pass) return;

  const users = (await new Promise(resolve => {
    db.collection("users").onSnapshot(s => resolve(s.docs.map(d => ({ id: d.id, ...d.data() }))));
  })) || [];

  if(isRegMode) {
    const exists = users.find(u => u.login === val);
    if(exists) { toast("Пользователь с таким контактом уже существует!"); return; }
    
    const newUid = "usr_" + Date.now().toString(36);
    const newUser = { uid: newUid, login: val, pass, name: name || "Игрок " + newUid.slice(-4), method: authMethod, ts: Date.now() };
    await db.collection("users").doc(newUid).set(newUser);
    
    userAuth = newUser;
    uid = newUid;
    LS("noir_user", JSON.stringify(userAuth));
    LS("noir_uid", uid);
    names[uid] = newUser.name;
    
    $("#authMo").classList.remove("o");
    toast("Регистрация успешна! Добро пожаловать!");
    render();
  } else {
    const found = users.find(u => u.login === val && u.pass === pass);
    if(!found) { toast("Неверный логин или пароль!"); return; }
    
    userAuth = found;
    uid = found.uid;
    LS("noir_user", JSON.stringify(userAuth));
    LS("noir_uid", uid);
    names[uid] = found.name;
    
    $("#authMo").classList.remove("o");
    toast("С возвращением, " + found.name + "!");
    render();
  }
};
